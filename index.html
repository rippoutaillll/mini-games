<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ミニゲームズ</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Courier New",monospace;
}

body{
  background:
    linear-gradient(
      135deg,
      #ff5f8f,
      #6a5cff,
      #00c8a3
    );
  color:white;
}

/* =========================================================
   タイトル画面
========================================================= */

#menuScreen{
  position:fixed;
  inset:0;

  padding:32px 24px 20px;

  background:
    linear-gradient(
      135deg,
      #ff5f8f,
      #6a5cff 55%,
      #00c8a3
    );

  display:flex;
  flex-direction:column;

  overflow:hidden;
}

#menuTitle{
  text-align:center;
  font-size:clamp(44px,7vw,80px);
  font-weight:bold;
  letter-spacing:7px;
  text-shadow:5px 5px rgba(0,0,0,.25);
}

#menuSub{
  text-align:center;
  letter-spacing:8px;
  opacity:.75;
}

#gameList{
  width:min(760px,92vw);

  flex:1;

  min-height:0;

  margin:24px auto 0;

  display:grid;

  grid-template-rows:
    repeat(8,minmax(0,1fr));

  gap:6px;
}

.gameItem{
  position:relative;

  display:flex;
  align-items:center;

  min-height:0;

  padding:8px 22px 8px 52px;

  margin:0;

  border:3px solid transparent;

  border-radius:14px;

  background:
    rgba(0,0,0,.2);

  font-size:
    clamp(16px,2.3vh,22px);

  white-space:nowrap;

  overflow:hidden;
}

.gameItem.selected{
  border-color:white;

  background:
    rgba(255,255,255,.2);
}

.gameItem.selected::before{
  content:"▶";

  position:absolute;

  left:20px;

  top:50%;

  transform:
    translateY(-50%);
}

.emptyItem{
  opacity:.18;
}

#pageInfo{
  flex:0 0 auto;

  text-align:center;

  margin-top:10px;

  font-size:14px;
}

#menuHelp{
  flex:0 0 auto;

  margin-top:8px;

  text-align:center;

  opacity:.8;

  font-size:14px;
}

/* =========================================================
   ゲーム画面
   タイトル画面とは完全に別
========================================================= */

#gameScreen{
  display:none;
  position:fixed;
  inset:0;
  background:black;
}

#gameHost{
  position:absolute;
  inset:0;
}

#backHint{
  position:fixed;
  right:16px;
  top:12px;
  z-index:999999;
  color:rgba(255,255,255,.55);
  font-size:12px;
  pointer-events:none;
}
</style>
</head>

<body>

<section id="menuScreen">

  <div id="menuTitle">
    ミニゲームズ
  </div>

  <div id="menuSub">
    MINI GAMES
  </div>

  <div id="gameList"></div>

  <div id="pageInfo"></div>

  <div id="menuHelp">
    ↑ ↓ 選択　
    ← → ページ　
    ENTER 決定
  </div>

</section>


<section id="gameScreen">

  <div id="gameHost"></div>

  <div id="backHint">
    ENTER メニュー
  </div>

</section>


<script>

/* =========================================================
   ミニゲームズ共通土台

   ★ GAME BLOCKは
     MiniGames.register(...)
     するだけでメニューに追加される。

   ★ 各ゲームは自分専用の画面を持つ。

   ★ 1ページ8本。
========================================================= */

window.MiniGames = (() => {

  const games = [];

  const pageSize = 8;

  let page = 0;

  let selected = 0;

  let current = null;


  const menu =
    document.getElementById("menuScreen");

  const screen =
    document.getElementById("gameScreen");

  const host =
    document.getElementById("gameHost");

  const list =
    document.getElementById("gameList");

  const pageInfo =
    document.getElementById("pageInfo");


  function register(game){

    if(
      !game ||
      !game.id ||
      !game.name ||
      typeof game.mount !== "function"
    ){
      return;
    }


    if(
      games.some(
        g => g.id === game.id
      )
    ){
      return;
    }


    /*
      新しく追加したゲームを
      一番上にする
    */

    games.unshift(game);

    render();
  }


  function render(){

    const totalPages =
      Math.max(
        1,
        Math.ceil(
          games.length / pageSize
        )
      );


    page =
      Math.min(
        page,
        totalPages - 1
      );


    const visible =
      games.slice(
        page * pageSize,
        page * pageSize + pageSize
      );


    selected =
      Math.min(
        selected,
        Math.max(
          0,
          visible.length - 1
        )
      );


    list.innerHTML = "";


    visible.forEach(
      (game,index) => {

        const item =
          document.createElement("div");

        item.className =
          "gameItem" +
          (
            index === selected
            ? " selected"
            : ""
          );


        item.textContent =
          game.name;


        list.appendChild(item);

      }
    );


    /*
      空き枠
    */

    for(
      let i = visible.length;
      i < pageSize;
      i++
    ){

      const item =
        document.createElement("div");

      item.className =
        "gameItem emptyItem";

      item.textContent = "—";

      list.appendChild(item);

    }


    pageInfo.textContent =
      "PAGE " +
      (page + 1) +
      " / " +
      totalPages;
  }


  function openSelected(){

    const game =
      games[
        page * pageSize +
        selected
      ];


    if(!game){
      return;
    }


    if(
      current &&
      current.destroy
    ){
      current.destroy();
    }


    current = game;


    host.innerHTML = "";

    menu.style.display =
      "none";

    screen.style.display =
      "block";


    game.mount(host);
  }


  function back(){

    if(
      current &&
      current.destroy
    ){
      current.destroy();
    }


    current = null;


    host.innerHTML = "";

    screen.style.display =
      "none";

    menu.style.display =
      "block";


    render();
  }


  document.addEventListener(
    "keydown",
    function(event){

      /*
        ゲーム中
      */

      if(
        screen.style.display ===
        "block"
      ){

        if(
          event.key === "Enter"
        ){

          event.preventDefault();

          back();
        }

        return;
      }


      /*
        メニュー
      */

      const visibleCount =
        Math.min(
          pageSize,
          games.length -
          page * pageSize
        );


      if(
        event.key === "ArrowDown" &&
        visibleCount
      ){

        event.preventDefault();

        selected =
          (
            selected + 1
          ) %
          visibleCount;

        render();
      }


      if(
        event.key === "ArrowUp" &&
        visibleCount
      ){

        event.preventDefault();

        selected =
          (
            selected - 1 +
            visibleCount
          ) %
          visibleCount;

        render();
      }


      if(
        event.key === "ArrowRight"
      ){

        event.preventDefault();

        const totalPages =
          Math.max(
            1,
            Math.ceil(
              games.length /
              pageSize
            )
          );


        if(
          page <
          totalPages - 1
        ){

          page++;

          selected = 0;

          render();
        }
      }


      if(
        event.key === "ArrowLeft"
      ){

        event.preventDefault();

        if(
          page > 0
        ){

          page--;

          selected = 0;

          render();
        }
      }


      if(
        event.key === "Enter"
      ){

        event.preventDefault();

        openSelected();
      }

    }
  );


  return {
    register,
    render
  };

})();

</script>


<!-- =========================================================
     🚨🚨🚨 GAME BLOCK AREA 🚨🚨🚨

     ★ 新しいゲームは
       この下にGAME BLOCKを丸ごと貼る。

     ★ 共通土台は触らない。

========================================================= -->


<!-- ==========================================================================
     🎮 GAME BLOCK 01
     ブロック崩し

     ★ この開始コメントから
       GAME BLOCK 01 ENDまで丸ごとコピーすれば
       JSFiddleで単体テストできる
========================================================================== -->

<style>

.gbBreakout{
  position:fixed;
  inset:0;

  background:
    radial-gradient(
      circle at 50% 20%,
      #203a78,
      #080b20 72%
    );

  font-family:
    "Courier New",
    monospace;

  color:white;
}

.gbBreakout canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

.gbBreakoutTitle{
  position:absolute;
  left:30px;
  top:22px;

  font-size:
    clamp(36px,6vw,68px);

  font-weight:bold;

  color:#79f7ff;

  text-shadow:
    4px 4px #304e99;
}

.gbBreakoutScore{
  position:absolute;
  right:30px;
  top:30px;

  color:#ffe16b;

  font-size:20px;
}

.gbBreakoutMessage{
  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  padding:
    30px 42px;

  border:
    3px solid white;

  border-radius:
    18px;

  background:
    rgba(5,7,25,.95);

  text-align:center;

  font-size:28px;

  min-width:320px;
}

.gbBreakoutMessage small{
  display:block;

  margin-top:12px;

  color:#aaa;

  font-size:13px;

  line-height:1.8;
}

</style>


<script>

(() => {

  function makeBreakout(){

    const root =
      document.createElement("div");

    root.className =
      "gbBreakout";


    root.innerHTML = `
      <canvas></canvas>

      <div class="gbBreakoutTitle">
        BREAKOUT
      </div>

      <div class="gbBreakoutScore">
        SCORE: 0
      </div>

      <div class="gbBreakoutMessage">
        ブロック崩し

        <small>
          SPACE スタート<br>
          ← → 移動
        </small>
      </div>
    `;


    const canvas =
      root.querySelector("canvas");

    const ctx =
      canvas.getContext("2d");

    const scoreElement =
      root.querySelector(
        ".gbBreakoutScore"
      );

    const message =
      root.querySelector(
        ".gbBreakoutMessage"
      );


    const keys = {
      left:false,
      right:false
    };


    const paddle = {
      x:0,
      y:0,
      width:110,
      height:14,
      speed:8
    };


    const ball = {
      x:0,
      y:0,
      radius:8,
      dx:4,
      dy:-4
    };


    let blocks = [];

    let running = false;

    let score = 0;

    let animationId = null;

    let width = 0;

    let height = 0;


    function resize(){

      width =
        canvas.width =
        root.clientWidth;

      height =
        canvas.height =
        root.clientHeight;


      paddle.y =
        height - 55;


      if(!running){

        paddle.x =
          width / 2 -
          paddle.width / 2;

        ball.x =
          width / 2;

        ball.y =
          height - 85;
      }
    }


    function reset(){

      running = false;

      score = 0;

      scoreElement.textContent =
        "SCORE: 0";


      paddle.x =
        width / 2 -
        paddle.width / 2;


      ball.x =
        width / 2;

      ball.y =
        height - 85;

      ball.dx = 4;

      ball.dy = -4;


      blocks = [];


      const cols = 10;

      const gap = 8;

      const blockWidth =
        Math.min(
          70,
          (
            width - 100
          ) / cols -
          gap
        );


      const startX =
        (
          width -
          (
            cols *
            (
              blockWidth +
              gap
            ) -
            gap
          )
        ) / 2;


      for(
        let row = 0;
        row < 5;
        row++
      ){

        for(
          let col = 0;
          col < cols;
          col++
        ){

          blocks.push({

            x:
              startX +
              col *
              (
                blockWidth +
                gap
              ),

            y:
              105 +
              row * 32,

            width:
              blockWidth,

            height:
              22,

            alive:
              true

          });
        }
      }


      message.innerHTML =
        "ブロック崩し" +
        "<small>" +
        "SPACE スタート<br>" +
        "← → 移動" +
        "</small>";


      message.style.display =
        "block";
    }


    function start(){

      reset();

      running = true;

      message.style.display =
        "none";
    }


    function update(){

      if(!running){
        return;
      }


      if(keys.left){

        paddle.x -=
          paddle.speed;
      }


      if(keys.right){

        paddle.x +=
          paddle.speed;
      }


      paddle.x =
        Math.max(
          0,
          Math.min(
            width -
            paddle.width,
            paddle.x
          )
        );


      ball.x +=
        ball.dx;

      ball.y +=
        ball.dy;


      if(
        ball.x -
        ball.radius < 0 ||
        ball.x +
        ball.radius >
        width
      ){

        ball.dx *= -1;
      }


      if(
        ball.y -
        ball.radius < 0
      ){

        ball.dy *= -1;
      }


      if(
        ball.dy > 0 &&
        ball.y +
        ball.radius >=
        paddle.y &&
        ball.y -
        ball.radius <=
        paddle.y +
        paddle.height &&
        ball.x >=
        paddle.x &&
        ball.x <=
        paddle.x +
        paddle.width
      ){

        ball.y =
          paddle.y -
          ball.radius;


        ball.dy =
          -Math.abs(
            ball.dy
          );


        ball.dx =
          (
            (
              ball.x -
              (
                paddle.x +
                paddle.width / 2
              )
            ) /
            (
              paddle.width / 2
            )
          ) * 6;
      }


      for(
        const block of
        blocks
      ){

        if(
          !block.alive
        ){
          continue;
        }


        if(
          ball.x +
          ball.radius >
          block.x &&

          ball.x -
          ball.radius <
          block.x +
          block.width &&

          ball.y +
          ball.radius >
          block.y &&

          ball.y -
          ball.radius <
          block.y +
          block.height
        ){

          block.alive =
            false;

          ball.dy *= -1;

          score += 10;

          scoreElement.textContent =
            "SCORE: " +
            score;

          break;
        }
      }


      if(
        blocks.every(
          block =>
            !block.alive
        )
      ){

        running = false;

        message.innerHTML =
          "CLEAR!" +
          "<small>" +
          "SCORE: " +
          score +
          "<br>" +
          "SPACE もう一度" +
          "</small>";

        message.style.display =
          "block";
      }


      if(
        ball.y -
        ball.radius >
        height
      ){

        running = false;

        message.innerHTML =
          "GAME OVER" +
          "<small>" +
          "SCORE: " +
          score +
          "<br>" +
          "SPACE リトライ" +
          "</small>";

        message.style.display =
          "block";
      }
    }


    function draw(){

      ctx.clearRect(
        0,
        0,
        width,
        height
      );


      ctx.fillStyle =
        "#ffffff";


      ctx.fillRect(
        paddle.x,
        paddle.y,
        paddle.width,
        paddle.height
      );


      ctx.beginPath();

      ctx.arc(
        ball.x,
        ball.y,
        ball.radius,
        0,
        Math.PI * 2
      );

      ctx.fill();


      blocks.forEach(
        block => {

          if(
            !block.alive
          ){
            return;
          }


          ctx.fillRect(
            block.x,
            block.y,
            block.width,
            block.height
          );
        }
      );
    }


    function loop(){

      update();

      draw();

      animationId =
        requestAnimationFrame(
          loop
        );
    }


    function keyDown(event){

      if(
        event.key === " "
      ){

        event.preventDefault();

        if(!running){

          start();
        }
      }


      if(
        event.key ===
        "ArrowLeft"
      ){

        keys.left = true;

        event.preventDefault();
      }


      if(
        event.key ===
        "ArrowRight"
      ){

        keys.right = true;

        event.preventDefault();
      }
    }


    function keyUp(event){

      if(
        event.key ===
        "ArrowLeft"
      ){

        keys.left = false;
      }


      if(
        event.key ===
        "ArrowRight"
      ){

        keys.right = false;
      }
    }


    function mount(target){

      target.appendChild(root);

      resize();

      reset();

      loop();
    }


    function destroy(){

      cancelAnimationFrame(
        animationId
      );


      document.removeEventListener(
        "keydown",
        keyDown
      );


      document.removeEventListener(
        "keyup",
        keyUp
      );


      window.removeEventListener(
        "resize",
        resize
      );
    }


    document.addEventListener(
      "keydown",
      keyDown
    );


    document.addEventListener(
      "keyup",
      keyUp
    );


    window.addEventListener(
      "resize",
      resize
    );


    return {
      mount,
      destroy
    };
  }


  const game = {

    id:"breakout",

    name:"(仮)ブロック崩し",


    mount(target){

      const instance =
        makeBreakout();


      instance.mount(
        target
      );


      game.destroy =
        instance.destroy;
    },


    destroy(){}

  };


  /*
    ミニゲームズ内なら登録。

    単体JSFiddleなら
    自分で全画面起動。
  */

  if(
    window.MiniGames
  ){

    window.MiniGames.register(
      game
    );

  }else{

    const host =
      document.createElement("div");


    host.style.cssText =
      "position:fixed;inset:0;background:#000";


    document.body.appendChild(
      host
    );


    game.mount(
      host
    );
  }

})();

</script>

<!-- ================================== GAME BLOCK 01 END ================================== -->


<!-- ==========================================================================
     🎮 GAME BLOCK 02
     迷路脱出

     ★ これもGAME BLOCK単体でテスト可能
========================================================================== -->

<style>

.gbMaze{
  position:fixed;
  inset:0;

  background:
    radial-gradient(
      circle at 50% 45%,
      #174d3b,
      #06110f 72%
    );

  font-family:
    "Courier New",
    monospace;

  color:white;
}

.gbMaze canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

.gbMazeTitle{
  position:absolute;
  left:30px;
  top:22px;

  font-size:
    clamp(36px,6vw,68px);

  font-weight:bold;

  color:#70ffad;

  text-shadow:
    4px 4px #145c3d;
}

.gbMazeTime{
  position:absolute;
  right:30px;
  top:30px;

  color:#ffe36e;

  font-size:20px;
}

.gbMazeMessage{
  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  padding:
    30px 42px;

  border:
    3px solid white;

  border-radius:
    18px;

  background:
    rgba(2,14,11,.95);

  text-align:center;

  font-size:28px;

  min-width:320px;
}

.gbMazeMessage small{
  display:block;

  margin-top:12px;

  color:#aaa;

  font-size:13px;

  line-height:1.8;
}

</style>


<script>

(() => {

  function makeMaze(){

    const map = [

      "####################",
      "#S.....##.........##",
      "#.####....###.###..#",
      "#...##.####.....##.#",
      "###....###########.#",
      "#...####......####.#",
      "#.###.##.##.#....#.#",
      "#......#.##.#.##...#",
      "#.####.####.########",
      "#...##....#.......G#",
      "####################"

 　　];


    const root =
      document.createElement("div");


    root.className =
      "gbMaze";


    root.innerHTML = `
      <canvas></canvas>

      <div class="gbMazeTitle">
        MAZE
      </div>

      <div class="gbMazeTime">
        TIME: 0.0
      </div>

      <div class="gbMazeMessage">
        迷路脱出

        <small>
          SPACE スタート<br>
          ↑ ↓ ← → 移動
        </small>
      </div>
    `;


    const canvas =
      root.querySelector("canvas");

    const ctx =
      canvas.getContext("2d");

    const timeElement =
      root.querySelector(
        ".gbMazeTime"
      );

    const message =
      root.querySelector(
        ".gbMazeMessage"
      );


    const player = {
      x:1,
      y:1
    };


    const goal = {
      x:18,
      y:9
    };


    let running = false;

    let startTime = 0;

    let animationId = null;

    let width = 0;

    let height = 0;

    let tile = 32;


    function resize(){

      width =
        canvas.width =
        root.clientWidth;

      height =
        canvas.height =
        root.clientHeight;


      tile =
        Math.min(
          48,
          Math.floor(
            Math.min(
              width /
              (
                map[0].length +
                2
              ),
              height /
              (
                map.length +
                2
              )
            )
          )
        );
    }


    function reset(){

      running = false;

      player.x = 1;

      player.y = 1;


      timeElement.textContent =
        "TIME: 0.0";


      message.innerHTML =
        "迷路脱出" +
        "<small>" +
        "SPACE スタート<br>" +
        "↑ ↓ ← → 移動" +
        "</small>";


      message.style.display =
        "block";
    }


    function start(){

      reset();

      running = true;

      startTime =
        performance.now();


      message.style.display =
        "none";
    }


    function move(key){

      if(!running){
        return;
      }


      let dx = 0;

      let dy = 0;


      if(
        key === "ArrowUp"
      ){
        dy = -1;
      }


      if(
        key === "ArrowDown"
      ){
        dy = 1;
      }


      if(
        key === "ArrowLeft"
      ){
        dx = -1;
      }


      if(
        key === "ArrowRight"
      ){
        dx = 1;
      }


      if(
        !dx &&
        !dy
      ){
        return;
      }


      const nx =
        player.x +
        dx;

      const ny =
        player.y +
        dy;


      if(
        map[ny] &&
        map[ny][nx] !== "#"
      ){

        player.x =
          nx;

        player.y =
          ny;
      }


      if(
        player.x === goal.x &&
        player.y === goal.y
      ){

        running = false;


        const seconds =
          (
            performance.now() -
            startTime
          ) / 1000;


        message.innerHTML =
          "CLEAR!" +
          "<small>" +
          "TIME: " +
          seconds.toFixed(1) +
          " 秒<br>" +
          "SPACE もう一度" +
          "</small>";


        message.style.display =
          "block";
      }
    }


    function update(){

      if(!running){
        return;
      }


      timeElement.textContent =
        "TIME: " +
        (
          (
            performance.now() -
            startTime
          ) /
          1000
        ).toFixed(1);
    }


    function draw(){

      ctx.clearRect(
        0,
        0,
        width,
        height
      );


      const offsetX =
        (
          width -
          map[0].length *
          tile
        ) / 2;


      const offsetY =
        (
          height -
          map.length *
          tile
        ) / 2;


      for(
        let y = 0;
        y < map.length;
        y++
      ){

        for(
          let x = 0;
          x < map[y].length;
          x++
        ){

          ctx.fillStyle =
            map[y][x] === "#"
            ? "#e9fff4"
            : "#071612";


          ctx.fillRect(
            offsetX +
            x * tile,

            offsetY +
            y * tile,

            tile - 1,

            tile - 1
          );
        }
      }


      ctx.fillStyle =
        "#ffe36e";


      ctx.fillRect(
        offsetX +
        goal.x * tile +
        6,

        offsetY +
        goal.y * tile +
        6,

        tile - 12,

        tile - 12
      );


      ctx.fillStyle =
        "#70ffad";


      ctx.fillRect(
        offsetX +
        player.x * tile +
        7,

        offsetY +
        player.y * tile +
        7,

        tile - 14,

        tile - 14
      );
    }


    function loop(){

      update();

      draw();

      animationId =
        requestAnimationFrame(
          loop
        );
    }


    function keyDown(event){

      if(
        [
          "ArrowUp",
          "ArrowDown",
          "ArrowLeft",
          "ArrowRight",
          " "
        ].includes(
          event.key
        )
      ){

        event.preventDefault();
      }


      if(
        event.key === " " &&
        !running
      ){

        start();

        return;
      }


      move(
        event.key
      );
    }


    function mount(target){

      target.appendChild(
        root
      );


      resize();

      reset();

      loop();
    }


    function destroy(){

      cancelAnimationFrame(
        animationId
      );


      document.removeEventListener(
        "keydown",
        keyDown
      );


      window.removeEventListener(
        "resize",
        resize
      );
    }


    document.addEventListener(
      "keydown",
      keyDown
    );


    window.addEventListener(
      "resize",
      resize
    );


    return {
      mount,
      destroy
    };
  }


  const game = {

    id:"maze",

    name:"(仮)迷路脱出",


    mount(target){

      const instance =
        makeMaze();


      instance.mount(
        target
      );


      game.destroy =
        instance.destroy;
    },


    destroy(){}

  };


  if(
    window.MiniGames
  ){

    window.MiniGames.register(
      game
    );

  }else{

    const host =
      document.createElement("div");


    host.style.cssText =
      "position:fixed;inset:0;background:#000";


    document.body.appendChild(
      host
    );


    game.mount(
      host
    );
  }

})();

<script>

(() => {

  function makeDodge(){

    const root =
      document.createElement(
        "div"
      );


    root.className =
      "gbDodge";


    root.innerHTML = `
      <canvas></canvas>

      <div class="gbDodgeTitle">
        DODGE!
      </div>

      <div class="gbDodgeScore">
        TIME: 0.0
      </div>

      <div class="gbDodgeMessage">
        DODGE!

        <small>
          SPACE スタート<br>
          ↑ ↓ ← → 移動
        </small>
      </div>
    `;


    const canvas =
      root.querySelector(
        "canvas"
      );


    const ctx =
      canvas.getContext(
        "2d"
      );


    const scoreElement =
      root.querySelector(
        ".gbDodgeScore"
      );


    const message =
      root.querySelector(
        ".gbDodgeMessage"
      );


    const player = {

      x:0,

      y:0,

      radius:18,

      speed:7

    };


    const keys = {

      up:false,

      down:false,

      left:false,

      right:false

    };


    let enemies = [];

    let running = false;

    let startTime = 0;

    let lastSpawn = 0;

    let animationId = null;

    let width = 0;

    let height = 0;


    function resize(){

      width =
        canvas.width =
        root.clientWidth;


      height =
        canvas.height =
        root.clientHeight;


      if(!running){

        player.x =
          width / 2;

        player.y =
          height / 2;
      }
    }


    function reset(){

      running = false;

      enemies = [];


      player.x =
        width / 2;


      player.y =
        height / 2;


      scoreElement.textContent =
        "TIME: 0.0";


      message.innerHTML =
        "DODGE!" +

        "<small>" +

        "SPACE スタート<br>" +

        "↑ ↓ ← → 移動" +

        "</small>";


      message.style.display =
        "block";
    }


    function start(){

      reset();

      running = true;


      startTime =
        performance.now();


      lastSpawn =
        startTime;


      message.style.display =
        "none";
    }


    function spawnEnemy(){

      const side =
        Math.floor(
          Math.random() * 4
        );


      let x;

      let y;


      if(side === 0){

        x = -30;

        y =
          Math.random() *
          height;

      }else if(side === 1){

        x =
          width + 30;

        y =
          Math.random() *
          height;

      }else if(side === 2){

        x =
          Math.random() *
          width;

        y = -30;

      }else{

        x =
          Math.random() *
          width;

        y =
          height + 30;
      }


      enemies.push({

        x:x,

        y:y,

        radius:
          12 +
          Math.random() * 8,

        speed:
          2.8 +
          Math.random() * 1.6

      });
    }


    function hit(){

      running = false;


      root.classList.remove(
        "gbDodgeShake"
      );


      void root.offsetWidth;


      root.classList.add(
        "gbDodgeShake"
      );


      const time =
        (
          performance.now() -
          startTime
        ) / 1000;


      message.innerHTML =
        "GAME OVER" +

        "<small>" +

        "TIME: " +

        time.toFixed(1) +

        " 秒<br><br>" +

        "SPACE リトライ" +

        "</small>";


      message.style.display =
        "block";
    }


    function update(time){

      if(!running){
        return;
      }


      const elapsed =
        (
          time -
          startTime
        ) / 1000;


      scoreElement.textContent =
        "TIME: " +
        elapsed.toFixed(1);


      const spawnInterval =
        Math.max(
          280,
          680 -
          elapsed * 15
        );


      if(
        time -
        lastSpawn >=
        spawnInterval
      ){

        spawnEnemy();


        if(
          elapsed > 2.5 &&
          enemies.length < 4
        ){

          spawnEnemy();
        }


        if(
          elapsed > 6 &&
          enemies.length < 7
        ){

          spawnEnemy();
        }


        if(
          elapsed > 11 &&
          enemies.length < 10
        ){

          spawnEnemy();
        }


        lastSpawn =
          time;
      }


      if(keys.up){

        player.y -=
          player.speed;
      }


      if(keys.down){

        player.y +=
          player.speed;
      }


      if(keys.left){

        player.x -=
          player.speed;
      }


      if(keys.right){

        player.x +=
          player.speed;
      }


      player.x =
        Math.max(
          player.radius,
          Math.min(
            width -
            player.radius,
            player.x
          )
        );


      player.y =
        Math.max(
          player.radius,
          Math.min(
            height -
            player.radius,
            player.y
          )
        );


      for(
        const enemy of
        enemies
      ){

        const dx =
          player.x -
          enemy.x;


        const dy =
          player.y -
          enemy.y;


        const distance =
          Math.hypot(
            dx,
            dy
          );


        if(distance){

          enemy.x +=
  　　　　　(
    　　　　　dx /
    　　　　　distance
  　　　　　) *
  　　　　　enemy.speed *
　　　　　  0.55;

　　　　　enemy.y +=
　　　　　  (
    　　　　　dy /
　　　　　    distance
　　　　　  ) *
　　　　　  enemy.speed *
  　　　　　0.55;
        }


        if(
          distance <
          player.radius +
          enemy.radius
        ){

          hit();

          return;
        }
      }
    }


    function draw(){

      ctx.clearRect(
        0,
        0,
        width,
        height
      );


      ctx.fillStyle =
        "#08020f";


      ctx.fillRect(
        0,
        0,
        width,
        height
      );


      /*
        背景グリッド
      */

      ctx.strokeStyle =
        "rgba(255,255,255,.04)";


      for(
        let x = 0;
        x < width;
        x += 50
      ){

        ctx.beginPath();

        ctx.moveTo(
          x,
          0
        );

        ctx.lineTo(
          x,
          height
        );

        ctx.stroke();
      }


      for(
        let y = 0;
        y < height;
        y += 50
      ){

        ctx.beginPath();

        ctx.moveTo(
          0,
          y
        );

        ctx.lineTo(
          width,
          y
        );

        ctx.stroke();
      }


      /*
        敵
      */

      enemies.forEach(
        enemy => {

          ctx.fillStyle =
            "#ff3b81";


          ctx.beginPath();


          ctx.arc(
            enemy.x,
            enemy.y,
            enemy.radius,
            0,
            Math.PI * 2
          );


          ctx.fill();


          ctx.fillStyle =
            "#ffffff";


          ctx.beginPath();


          ctx.arc(
            enemy.x,
            enemy.y,
            3,
            0,
            Math.PI * 2
          );


          ctx.fill();
        }
      );


      /*
        プレイヤー
      */

      ctx.fillStyle =
        "#72f1ff";


      ctx.beginPath();


      ctx.arc(
        player.x,
        player.y,
        player.radius,
        0,
        Math.PI * 2
      );


      ctx.fill();


      ctx.fillStyle =
        "#ffffff";


      ctx.beginPath();


      ctx.arc(
        player.x,
        player.y,
        5,
        0,
        Math.PI * 2
      );


      ctx.fill();
    }


    function loop(time){

      update(time);

      draw();


      animationId =
        requestAnimationFrame(
          loop
        );
    }


    function keyDown(event){

      if(
        event.key === " "
      ){

        event.preventDefault();


        if(!running){

          start();
        }


        return;
      }


      if(
        event.key ===
        "ArrowUp"
      ){

        keys.up = true;

        event.preventDefault();
      }


      if(
        event.key ===
        "ArrowDown"
      ){

        keys.down = true;

        event.preventDefault();
      }


      if(
        event.key ===
        "ArrowLeft"
      ){

        keys.left = true;

        event.preventDefault();
      }


      if(
        event.key ===
        "ArrowRight"
      ){

        keys.right = true;

        event.preventDefault();
      }
    }


    function keyUp(event){

      if(
        event.key ===
        "ArrowUp"
      ){

        keys.up = false;
      }


      if(
        event.key ===
        "ArrowDown"
      ){

        keys.down = false;
      }


      if(
        event.key ===
        "ArrowLeft"
      ){

        keys.left = false;
      }


      if(
        event.key ===
        "ArrowRight"
      ){

        keys.right = false;
      }
    }


    function mount(target){

      target.appendChild(
        root
      );


      resize();

      reset();


      animationId =
        requestAnimationFrame(
          loop
        );
    }


    function destroy(){

      cancelAnimationFrame(
        animationId
      );


      document.removeEventListener(
        "keydown",
        keyDown
      );


      document.removeEventListener(
        "keyup",
        keyUp
      );


      window.removeEventListener(
        "resize",
        resize
      );
    }


    document.addEventListener(
      "keydown",
      keyDown
    );


    document.addEventListener(
      "keyup",
      keyUp
    );


    window.addEventListener(
      "resize",
      resize
    );


    return {
      mount,
      destroy
    };
  }


  const game = {

    id:"dodge",

    name:"(仮)DODGE!",


    mount(target){

      const instance =
        makeDodge();


      instance.mount(
        target
      );


      game.destroy =
        instance.destroy;
    },


    destroy(){}

  };


  /*
    ミニゲームズなら自動登録。

    GAME BLOCKだけJSFiddleで動かした場合は、
    自分で全画面起動。
  */

  if(
    window.MiniGames
  ){

    window.MiniGames.register(
      game
    );

  }else{

    const host =
      document.createElement(
        "div"
      );


    host.style.cssText =
      "position:fixed;inset:0;background:#000";


    document.body.appendChild(
      host
    );


    game.mount(
      host
    );
  }

})();

</script>

        s.style.setProperty("--dx", Math.cos(angle) * dist + "px");
        s.style.setProperty("--dy", Math.sin(angle) * dist + "px");
        s.style.setProperty("--color", colors[Math.floor(Math.random() * colors.length)]);

        s.style.left = (window.innerWidth / 2) + "px";
        s.style.top = (window.innerHeight / 2) + "px";

        root.appendChild(s);
        setTimeout(() => s.remove(), 800);
      }
    }

    function loop() {
      const elapsed = (performance.now() - startTime) / 1000;
      numberEl.textContent = elapsed.toFixed(3);
      if (elapsed >= 0.25) numberEl.classList.add("mg5pop10-hide");
      rafId = requestAnimationFrame(loop);
    }

    function start() {
      running = true;
      startTime = performance.now();
      lastResult = null;

      numberEl.textContent = "0.000";
      numberEl.classList.remove("mg5pop10-hide");

      msgEl.textContent = "Spaceでストップ";

      root.classList.add("mg5pop10-bgstop");
      panelEl.classList.add("mg5pop10-panel-show");

      centerEl.classList.remove("mg5pop10-center-hide");
      resultLayer.classList.remove("mg5pop10-result-show");
      resultLayer.innerHTML = "";

      rafId = requestAnimationFrame(loop);
    }

    function stop() {
      if (!running) return;
      running = false;

      if (rafId) cancelAnimationFrame(rafId);

      const elapsed = (performance.now() - startTime) / 1000;
      lastResult = elapsed;

      const rank = computeRank(Math.abs(elapsed - TARGET));

      panelEl.classList.remove("mg5pop10-panel-show");
      centerEl.classList.add("mg5pop10-center-hide");

      /* 結果レイヤー表示 */
      resultLayer.innerHTML = `
        <div class="mg5pop10-result-number">${elapsed.toFixed(3)} 秒</div>
        <div class="mg5pop10-rank-main mg5pop10-rank-main-${rank}">${rank}</div>
        <div class="mg5pop10-rank-text">rank</div>
        <div class="mg5pop10-result-reset">←キーでリセット</div>
      `;
      resultLayer.classList.add("mg5pop10-result-show");

      const mainRankEl = resultLayer.querySelector(".mg5pop10-rank-main");
      setTimeout(() => {
        mainRankEl.classList.add("mg5pop10-rank-main-show");
        spawnStarTrails(40); /* ★ 星の軌跡 */
      }, 50);

      if (rank === "S") spawnStarTrails(60);
      else if (rank === "A") spawnStarTrails(40);
    }

    function reset() {
      running = false;
      if (rafId) cancelAnimationFrame(rafId);

      numberEl.textContent = "0.000";
      numberEl.classList.remove("mg5pop10-hide");

      msgEl.textContent = "Spaceでスタート";

      root.classList.remove("mg5pop10-bgstop");
      panelEl.classList.remove("mg5pop10-panel-show");

      centerEl.classList.remove("mg5pop10-center-hide");
      resultLayer.classList.remove("mg5pop10-result-show");
      resultLayer.innerHTML = "";
    }

    function handleKey(e) {
      if (e.repeat) return;

      if (e.code === "Space") {
        e.preventDefault();
        running ? stop() : start();
      } else if (e.code === "ArrowLeft") {
        e.preventDefault();
        reset();
      } else if (e.code === "ArrowRight") {
        e.preventDefault();
        if (lastResult != null) {
          const rank = computeRank(Math.abs(lastResult - TARGET));
          resultLayer.innerHTML = `
            <div class="mg5pop10-result-number">${lastResult.toFixed(3)} 秒</div>
            <div class="mg5pop10-rank-main mg5pop10-rank-main-${rank}">${rank}</div>
            <div class="mg5pop10-rank-text">rank</div>
            <div class="mg5pop10-result-reset">←キーでリセット</div>
          `;
          resultLayer.classList.add("mg5pop10-result-show");
          centerEl.classList.add("mg5pop10-center-hide");

          const mainRankEl = resultLayer.querySelector(".mg5pop10-rank-main");
          setTimeout(() => {
            mainRankEl.classList.add("mg5pop10-rank-main-show");
            spawnStarTrails(40);
          }, 50);
        } else {
          msgEl.textContent = "まだ結果がありません";
        }
      } else if (e.code === "ArrowUp") {
        e.preventDefault();
        msgEl.textContent = "数字はすぐ消える…感覚で5秒を感じろ！";
      } else if (e.code === "ArrowDown") {
        e.preventDefault();
        msgEl.textContent = "Space:開始/停止  ←:リセット  →:前回結果";
      }
    }

    function mount(target) {
      root = document.createElement("div");
      root.className = "mg5pop10-root";

      panelEl = document.createElement("div");
      panelEl.className = "mg5pop10-panel";
      root.appendChild(panelEl);

      centerEl = document.createElement("div");
      centerEl.className = "mg5pop10-center";

      const title = document.createElement("div");
      title.className = "mg5pop10-title";
      title.textContent = "5秒を狙え！";

      numberEl = document.createElement("div");
      numberEl.className = "mg5pop10-number";
      numberEl.textContent = "0.000";

      msgEl = document.createElement("div");
      msgEl.className = "mg5pop10-msg";
      msgEl.textContent = "Spaceでスタート";

      resetHintEl = document.createElement("div");
      resetHintEl.className = "mg5pop10-reset-hint";
      resetHintEl.textContent = "←キーでリセット";

      centerEl.appendChild(title);
      centerEl.appendChild(numberEl);
      centerEl.appendChild(msgEl);
      centerEl.appendChild(resetHintEl);

      resultLayer = document.createElement("div");
      resultLayer.className = "mg5pop10-result-layer";

      root.appendChild(centerEl);
      root.appendChild(resultLayer);
      target.appendChild(root);

      window.addEventListener("keydown", handleKey);
    }

    function destroy() {
      if (rafId) cancelAnimationFrame(rafId);
      window.removeEventListener("keydown", handleKey);
      if (root && root.parentNode) root.parentNode.removeChild(root);
    }

    return { mount, destroy };
  }

  const game = {
    id: "five-sense-pop10-v1",
    name: "(仮)5秒を狙え！",
    mount(target) {
      const instance = makeGame();
      instance.mount(target);
      game.destroy = instance.destroy;
    },
    destroy() {}
  };

  if (window.MiniGames) {
    window.MiniGames.register(game);
  } else {
    const host = document.createElement("div");
    host.style.cssText = "position:fixed;inset:0;background:#000";
    document.body.appendChild(host);
    game.mount(host);
  }
})();

          ox++
        ){

                gy
              )
            ]=
              0;

          }

        }

      }

    }

  }


  function nearestBoundaryPoint(x,y){

  const tolerance =
    paper.width * .08;

  const candidates = [];


  /*
    左端
  */

  if(
    x - paper.left <=
    tolerance
  ){

    candidates.push({
      x:paper.left,
      y:y,
      distance:
        x - paper.left
    });
  }


  /*
    右端
  */

  if(
    paper.right - x <=
    tolerance
  ){

    candidates.push({
      x:paper.right,
      y:y,
      distance:
        paper.right - x
    });
  }


  /*
    上端
  */

  if(
    y - paper.top <=
    tolerance
  ){

    candidates.push({
      x:x,
      y:paper.top,
      distance:
        y - paper.top
    });
  }


  /*
    下端
  */

  if(
    paper.bottom - y <=
    tolerance
  ){

    candidates.push({
      x:x,
      y:paper.bottom,
      distance:
        paper.bottom - y
    });
  }


  /*
    上下左右のどの端にも
    近くなければ接続しない
  */

  if(
    candidates.length === 0
  ){

    return null;
  }


  /*
    一番近い外周だけに接続
  */

  candidates.sort(
    (a,b) =>
      a.distance -
      b.distance
  );


  return {
    x:candidates[0].x,
    y:candidates[0].y
  };
}


  function getComponents(){

    const seen=
      new Uint8Array(
        mask.length
      );


    const components=[];


    const directions=[
      [1,0],
      [-1,0],
      [0,1],
      [0,-1]
    ];


    for(
      let y=0;
      y<GRID_H;
      y++
    ){

      for(
        let x=0;
        x<GRID_W;
        x++
      ){

        const start=
          idx(
            x,
            y
          );


        if(
          !mask[start] ||
          seen[start]
        ){

          continue;

        }


        const cells=[];

        const queue=[
          start
        ];


        seen[start]=
          1;


        let touchesTop=
          false;


        for(
          let qi=0;
          qi<queue.length;
          qi++
        ){

          const n=
            queue[qi];


          const cy=
            Math.floor(
              n/
              GRID_W
            );


          const cx=
            n-
            cy*
            GRID_W;


          cells.push(
            n
          );


          if(
            cy===0
          ){

            touchesTop=
              true;

          }


          for(
            const [
              dx,
              dy
            ] of
            directions
          ){

            const nx=
              cx+
              dx;


            const ny=
              cy+
              dy;


            if(
              !inGrid(
                nx,
                ny
              )
            ){

              continue;

            }


            const ni=
              idx(
                nx,
                ny
              );


            if(
              mask[ni] &&
              !seen[ni]
            ){

              seen[ni]=
                1;


              queue.push(
                ni
              );

            }

          }

        }


        components.push({

          cells:
            cells,

          touchesTop:
            touchesTop

        });

      }

    }


    return components;

  }


  function componentToTexture(
    cells
  ){

    const texture=
      document.createElement(
        "canvas"
      );


    texture.width=
      GRID_W;


    texture.height=
      GRID_H;


    const textureCtx=
      texture.getContext(
        "2d"
      );


    textureCtx.fillStyle=
      "#ddd6c8";


    for(
      const n of
      cells
    ){

      const y=
        Math.floor(
          n/
          GRID_W
        );


      const x=
        n-
        y*
        GRID_W;


      textureCtx.fillRect(
        x,
        y,
        1,
        1
      );

    }


    return texture;

  }


function getConnectedShotIndices(
  startIndex
){

  const visited =
    new Set([startIndex]);

  const queue =
    [startIndex];


  while(queue.length){

    const current =
      queue.shift();


    edges.forEach(
      edge => {

        let next = null;

        if(edge.a === current){
          next = edge.b;
        }else if(edge.b === current){
          next = edge.a;
        }

        if(
          next !== null &&
          !visited.has(next)
        ){
          visited.add(next);
          queue.push(next);
        }
      }
    );
  }


  return visited;
}


function crackNetworkTouchesBoundary(
  startIndex
){

  const network =
    getConnectedShotIndices(
      startIndex
    );

  const boundaryPoints = [];


  edgeLinks.forEach(
    link => {

      if(
        network.has(
          link.shot
        )
      ){
        boundaryPoints.push({
          x:link.x,
          y:link.y
        });
      }
    }
  );


  if(
    boundaryPoints.length < 2
  ){
    return false;
  }


  const minimumDistance =
    paper.width * .12;


  for(
    let i=0;
    i<boundaryPoints.length;
    i++
  ){

    for(
      let j=i+1;
      j<boundaryPoints.length;
      j++
    ){

      if(
        Math.hypot(
          boundaryPoints[i].x -
          boundaryPoints[j].x,

          boundaryPoints[i].y -
          boundaryPoints[j].y
        ) >=
        minimumDistance
      ){
        return true;
      }
    }
  }


  return false;
}
function resolveCut(){

    const components=
      getComponents();


    if(
      components.length<=1
    ){

      updatePaperTexture();

      return false;

    }


    let keep=
      components.find(
        component=>
          component.touchesTop
      );


    /*
      念のため上端に
      つながる紙がなければ
      最大面積を残す。
    */

    if(!keep){

      keep=
        components.reduce(
          (a,b)=>
            a.cells.length>=
            b.cells.length
            ?
            a
            :
            b
        );

    }


    const keepMask=
      new Uint8Array(
        mask.length
      );


    for(
      const n of
      keep.cells
    ){

      keepMask[n]=
        1;

    }


    for(
      const component of
      components
    ){

      if(
        component===
        keep
      ){

        continue;

      }


      fallingPieces.push({

        texture:
          componentToTexture(
            component.cells
          ),

        offsetY:
          0,

        speed:
          2.5

      });

    }


    mask=
      keepMask;


    updatePaperTexture();


    shots=[];

    edges=[];

    edgeLinks=[];


    const percent=
      calculatePaperPercent();


    paperElement.textContent=
      percent.toFixed(
        1
      );


    evaluateAfterCut(
      percent
    );


    return true;

  }


  function shoot(){

    if(
      phase!=="playing"
    ){

      return;

    }


    muzzleFlash=
      1;


    root.classList.remove(
      "shotShake"
    );


    void root.offsetWidth;


    root.classList.add(
      "shotShake"
    );


    if(
      !pointInsidePaper(
        crosshair.x,
        crosshair.y
      )
    ){

      return;

    }


    const shot={

      x:
        crosshair.x,

      y:
        crosshair.y

    };


    const nearby=
      findNearbyShots(
        shot.x,
        shot.y
      );


    const newIndex=
      shots.length;


    shots.push(
      shot
    );


    /*
      弾痕そのもの
    */

    rasterCrackCanvas(
      shot.x,
      shot.y,
      shot.x,
      shot.y
    );


    /*
      一定距離以内にある
      全弾痕と接続
    */

    nearby.forEach(
      index=>{

        edges.push({

          a:
            index,

          b:
            newIndex

        });


        rasterCrackCanvas(

          shots[index].x,

          shots[index].y,

          shot.x,

          shot.y

        );

      }
    );


    /*
      紙の境界が近ければ
      自動的に境界まで裂ける。
    */

    const boundary=
      nearestBoundaryPoint(
        shot.x,
        shot.y
      );


    if(boundary){

      edgeLinks.push({

        shot:
          newIndex,

        x:
          boundary.x,

        y:
          boundary.y

      });


      rasterCrackCanvas(

        shot.x,

        shot.y,

        boundary.x,

        boundary.y

      );

    }


if(
  crackNetworkTouchesBoundary(
    newIndex
  ) &&
  getConnectedShotIndices(
    newIndex
  ).size ===
  shots.length
){

  const network =
    getConnectedShotIndices(
      newIndex
    );


  const oldMask =
    mask;


  const candidateMask =
    mask.slice();


  mask =
    candidateMask;


  network.forEach(
    index => {

      const shot =
        shots[index];

      rasterCrackCanvas(
        shot.x,
        shot.y,
        shot.x,
        shot.y
      );
    }
  );


  edges.forEach(
    edge => {

      if(
        network.has(edge.a) &&
        network.has(edge.b)
      ){

        rasterCrackCanvas(
          shots[edge.a].x,
          shots[edge.a].y,
          shots[edge.b].x,
          shots[edge.b].y
        );
      }
    }
  );


  edgeLinks.forEach(
    link => {

      if(
        network.has(
          link.shot
        )
      ){

        rasterCrackCanvas(
          shots[link.shot].x,
          shots[link.shot].y,
          link.x,
          link.y
        );
      }
    }
  );


  if(
    !resolveCut()
  ){

    mask =
      oldMask;

    updatePaperTexture();
  }

}else{

  updatePaperTexture();
}

  }


  function calculatePaperPercent(){

    let count=
      0;


    for(
      const value of
      mask
    ){

      count+=
        value;

    }


    return (
      count /
      initialCellCount *
      100
    );

  }

    if(
      difference<=3

    }


    if(
      difference<=5
    ){
      return "B";
    }


    if(
      difference<=8
    ){
      return "C";
    }


    if(
      difference<=11
    ){
      return "D";
    }


    if(
      difference<=13
    ){
      return "E";
    }


    if(
      difference<=15
    ){
      return "F";

    return "G";

  function evaluateAfterCut(
    percent
  ){

    const difference=
      Math.abs(
        percent-
        targetPercent

    if(
      difference<=15

      finishGame(

        percent,

        getRank(
          difference
        )

      );

      return;

    }


    if(
      percent<
      targetPercent

      finishGame(
        percent,
        "G"
      );

    }

  }

  function update(
    time
  ){

    if(
      phase==="playing"
    ){

      updateAimZone();

      updateCrosshair();


      const remaining=
        Math.max(

          0,

          timeLimit-
          (
            time-
            startTime
          ) /
          1000

        );


      timeElement.textContent=
        remaining.toFixed(
          1
        );


      if(
        remaining<=0
      ){

        timeout();

        return;

      }

    }


    fallingPieces.forEach(
      piece=>{

        piece.offsetY+=
          piece.speed;


        piece.speed+=
          .16;

      }
    );


    fallingPieces=
      fallingPieces.filter(
        piece=>
          piece.offsetY<
          height+
          500
      );


    muzzleFlash*=
      .78;

  }


  function drawBackground(){

    ctx.fillStyle=
      "#0c1119";


    ctx.fillRect(
      0,
      0,
      width,
      height
    );


    ctx.strokeStyle=
      "rgba(255,255,255,.025)";


    ctx.lineWidth=
      1;


    for(
      let x=0;
      x<width;
      x+=45
    ){

      ctx.beginPath();

      ctx.moveTo(
        x,
        0
      );

      ctx.lineTo(
        x,
        height
      );

      ctx.stroke();

    }


    for(
      let y=0;
      y<height;
      y+=45
    ){

      ctx.beginPath();

      ctx.moveTo(
        0,
        y
      );

      ctx.lineTo(
        width,
        y
      );

      ctx.stroke();

    }

  }


  function drawPaper(){

    ctx.drawImage(

      paperTexture,

      paper.left,

      paper.top,

      paper.width,

      paper.height

    );


    
  }


  function drawFallingPieces(){

    fallingPieces.forEach(

  function drawShots(){

    ctx.lineWidth=
      3;


    ctx.strokeStyle=
      "#7d2727";


    edges.forEach(
      edge=>{

        const a=
          shots[
            edge.a
          ];


        const b=
          shots[
            edge.b
          ];


        if(
          !a ||
          !b
        ){

          return;

        }


        ctx.beginPath();

        ctx.moveTo(
          a.x,
          a.y
        );

        ctx.lineTo(
          b.x,
          b.y
        );

        ctx.stroke();

      }
    );


    edgeLinks.forEach(
      edge=>{

        const shot=
          shots[
            edge.shot
          ];


        if(!shot){

          return;

        }


        ctx.beginPath();

        ctx.moveTo(
          shot.x,
          shot.y
        );

        ctx.lineTo(
          edge.x,
          edge.y
        );

        ctx.stroke();

      }
    );


    shots.forEach(
      shot=>{

        /*
          放射状の裂け
        */

        ctx.strokeStyle=
          "rgba(75,45,35,.8)";


        ctx.lineWidth=
          1.4;


        for(
          let i=0;
          i<7;
          i++
        ){

          const angle=
            (
              i/
              7
            ) *
            Math.PI*
            2 +

            (
              shot.x+
              shot.y
            ) *
            .01;


          const inner=
            7;


          const outer=
            11+
            (
              i%
              3
            )*
            2;


          ctx.beginPath();


          ctx.moveTo(

            shot.x+
            Math.cos(
              angle
            )*
            inner,

            shot.y+
            Math.sin(
              angle
            )*
            inner

          );


          ctx.lineTo(

            shot.x+
            Math.cos(
              angle
            )*
            outer,

            shot.y+
            Math.sin(
              angle
            )*
            outer

          );


          ctx.stroke();

        }


        /*
          焦げ
        */

        ctx.fillStyle=
          "rgba(105,65,45,.55)";


        ctx.beginPath();


        ctx.arc(
  shot.x,
  shot.y,
  11,
  0,
  Math.PI * 2
);


        ctx.fill();


        /*
          貫通穴
        */

        ctx.fillStyle=
          "#17100d";


        ctx.beginPath();


        ctx.arc(
  shot.x,
  shot.y,
  7,
  0,
  Math.PI * 2
);


        ctx.fill();


        ctx.strokeStyle=
          "rgba(255,210,170,.28)";


        ctx.lineWidth=
          1;


        ctx.beginPath();


        ctx.arc(
          shot.x-1,
          shot.y-1,
          4,
          .3,
          2.4
        );


        ctx.stroke();

      }
    );

  }


  function drawAim(){

    ctx.save();


    ctx.setLineDash(
      [9,8]
    );


    ctx.strokeStyle=
      "rgba(108,224,255,.70)";


    ctx.lineWidth=
      3;


    ctx.beginPath();


    ctx.arc(
      aimZone.x,
      aimZone.y,
      aimZone.radius,
      0,
      Math.PI*

    );


    ctx.stroke();


    ctx.setLineDash(
      []
    );


    ctx.strokeStyle=
      "#ff5858";


    ctx.lineWidth=
      2;

      crosshair.x-

      crosshair.y
    );


    ctx.lineTo(
      crosshair.x+
      size,
      crosshair.y
    );

      crosshair.y-
      size
    );


    ctx.lineTo(

    );

  function draw(){

      );

  function loop(time){

    update(
      time
    );


    draw();


    animationId=
      requestAnimationFrame(
        loop
      );

  function keyDown(
    event
  ){

    if(
      [
        "ArrowUp",
        "ArrowDown",
        "ArrowLeft",
        "ArrowRight",
        " "
      ].includes(
        event.key
      )
    ){

      event.preventDefault();

    }


    if(
      event.key===
      " "
    ){

      if(
        phase===
        "playing"
      ){

        shoot();

      }else if(
        phase===
        "ready" ||
        phase===
        "result"
      ){

        start();

      }


      return;

    }


    if(
      phase!==
      "playing"
    ){

      return;

    }


    if(
      event.key===
      "ArrowUp"
    ){

      keys.up=
        true;

    }


    if(
      event.key===
      "ArrowDown"
    ){

      keys.down=
        true;

    }


    if(
      event.key===
      "ArrowLeft"
    ){

      keys.left=
        true;

    }


    if(
      event.key===
      "ArrowRight"
    ){

      keys.right=
        true;

    }

  }


  function keyUp(
    event
  ){

    if(
      event.key===
      "ArrowUp"
    ){

      keys.up=
        false;

    }


    if(
      event.key===
      "ArrowDown"
    ){

      keys.down=
        false;

    }


    if(
      event.key===
      "ArrowLeft"
    ){

      keys.left=
        false;

    }


    if(
      event.key===
      "ArrowRight"
    ){

      keys.right=
        false;

    }

  }


  function mount(
    target
  ){

    target.appendChild(
      root
    );


    resize();

    reset();


    animationId=
      requestAnimationFrame(
        loop
      );

  }


  function destroy(){

    cancelAnimationFrame(
      animationId
    );


    document.removeEventListener(
      "keydown",
      keyDown
    );


    document.removeEventListener(
      "keyup",
      keyUp
    );


    window.removeEventListener(
      "resize",
      resize

    ],

    [
      200000,
      800000
    ]
  ];


  const mode =
    modes[
      Math.floor(
        Math.random() *
        modes.length
      )
    ];


  drift =
    mode[0];


  volatility =
    mode[1];


  marketDuration =
    1.5 +
    Math.random() *
    4;


  marketTimer =
    0;
}

function marketUpdate(dt){

  marketTimer +=
    dt;


  shockTimer -=
    dt;


  if(
    marketTimer >=
    marketDuration
  ){

    chooseMarket();
  }


  price +=
    (
      drift +
      (
        Math.random() *
        2 -
        1
      ) *
      volatility
    ) *
    dt *
    2.5;


  if(
    shockTimer <= 0 &&
    Math.random() <
    .04
  ){

    const shock =
      (
        5000000 +
        Math.random() *
        6000000
      ) *
      (
        Math.random() <
        .5
          ? -1
          : 1
      );


    price +=
      shock;


    shockTimer =
      2 +
      Math.random() *
      4;
  }


  price =
    Math.max(
      1000000,
      price
    );
}

    function getProfit(slot){

      if(
        !slot.type
      ){

        return 0;
      }


      if(
        slot.type ===
        "long"
      ){

        return (
          price -
          slot.entry
        );
      }


      return (
        slot.entry -
        price
      );
    }


    function drawSlot(index){

      const slot =
        slots[index];


      const box =
        slotEls[index];


      const position =
        box.querySelector(
          ".position"

      const entry =

        );

      box.classList.remove(

        entry.textContent =
          "---";


        profit.textContent =
          "±¥0";


        profit.className =
          "profit";


        return;
      }


      position.textContent =
        slot.type ===
        "long"
          ? "LONG"
          : "SHORT";


      position.style.color =
        slot.type ===
        "long"
          ? "#62ffa4"
          : "#ff6969";


      box.classList.add(
        slot.type
      );


      entry.textContent =
        formatYen(
          slot.entry
        );


      const p =
        getProfit(
          slot
        );


      profit.textContent =
        signedYen(

      profit.className =
        "profit " +

    function updateHUD(){

function reactSlot(

){

function openPosition(

){

function closePosition(

totalAsset +=

    function operate(
      index,
      shortMode
    ){

      if(
        phase !==
        "playing"
      ){

        return;
      }


      if(
        slots[index].type
      ){

        closePosition(
          index,
          false
        );

      }else{

        openPosition(
          index,
          shortMode
            ? "short"
            : "long"
        );
      }
    }


    function recordPrice(){

      prices.push(
        price
      );


      if(
        prices.length >
        160
      ){

        prices.shift();
      }
    }


    function drawChart(){

      const width =
        canvas.clientWidth;


      const height =
        canvas.clientHeight;


      ctx.clearRect(
        0,
        0,
        width,
        height
      );


      if(
        prices.length <
        2
      ){

        return;
      }


      let min =
        Math.min(
          ...prices
        );


      let max =
        Math.max(
          ...prices
        );


      if(
        max -
        min <
        6000000
      ){

        const center =
          (
            max +
            min
          ) /
          2;


        min =
          center -
          3000000;


        max =
          center +
          3000000;
      }


      const range =
        max -
        min;


      const top =
        95;


      const bottom =
        25;


      const h =
        height -
        top -
        bottom;


      ctx.strokeStyle =
        "rgba(150,255,200,.08)";


      ctx.lineWidth =
        1;


      for(
        let i=0;
        i<=5;
        i++
      ){

        const y =
          top +
          h *
          i /
          5;


        ctx.beginPath();


        ctx.moveTo(
          0,
          y
        );


        ctx.lineTo(
          width,
          y
        );


        ctx.stroke();
      }


      const gradient =
        ctx.createLinearGradient(
          0,
          top,
          0,
          height
        );


      gradient.addColorStop(
        0,
        "rgba(98,255,164,.20)"
      );


      gradient.addColorStop(
        1,
        "rgba(98,255,164,0)"
      );


      ctx.beginPath();


      prices.forEach(
        (value,i) => {

          const x =
            i /
            (
              prices.length -
              1
            ) *
            width;


          const y =
            top +
            (
              1 -
              (
                value -
                min
              ) /
              range
            ) *
            h;


          if(
            i === 0
          ){

            ctx.moveTo(
              x,
              y
            );

          }else{

            ctx.lineTo(
              x,
              y
            );
          }
        }
      );


      ctx.lineTo(
        width,
        height
      );


      ctx.lineTo(
        0,
        height
      );


      ctx.closePath();


      ctx.fillStyle =
        gradient;


      ctx.fill();


      ctx.beginPath();


      prices.forEach(
        (value,i) => {

          const x =
            i /
            (
              prices.length -
              1
            ) *
            width;


          const y =
            top +
            (
              1 -
              (
                value -
                min
              ) /
              range
            ) *
            h;


          if(
            i === 0
          ){

            ctx.moveTo(
              x,
              y
            );

          }else{

            ctx.lineTo(
              x,
              y
            );
          }
        }
      );


      ctx.lineWidth =
        3;


      ctx.strokeStyle = "#5edcff";


      ctx.shadowBlur =
        10;


      ctx.shadowColor =
        ctx.strokeStyle;


      ctx.stroke();


      ctx.shadowBlur =
        0;
    }


    function getRank(){

      if(

      if(

      }


      if(

      }


      if(

      ){

        return "C";
      }


      if(

      ){

        return "D";
      }


      if(
        totalAsset >=
        -10000000
      ){

        return "E";
      }


      if(

      ){

      }

    }


    function showCountdown(

    ){

      countdownEl.textContent =

      );

    function clearSequenceTimers(){

      sequenceTimers.forEach(
        clearTimeout
      );


      sequenceTimers =
        [];
    }


    function later(
      fn,
      ms
    ){

      const id =
        setTimeout(
          fn,
          ms
        );


      sequenceTimers.push(
        id
      );


      return id;
    }


function beginFinishSequence(){

if(
phase !==
"playing"
){
return;
}

phase =
"timeout";

timeLeft =
0;

updateHUD();

// まずTIME OUTをしっかり見せる
showEvent(
"TIME UP",
"#ffffff"
);

// 3秒後に「強制決済」
later(
() => {

  if(destroyed){
    return;
  }

  phase =
    "forcing";

  showEvent(
    "強制決済",
    "#ffe066"
  );

},
3000

);

// 「強制決済」を見せてから実際に決済
later(
() => {

  if(destroyed){
    return;
  }

  closePosition(
    0,
    true
  );

  closePosition(
    1,
    true
  );

  updateHUD();

},
5500

);

// 決済後、総資産をハイライト
later(
() => {

  if(destroyed){
    return;
  }

  assetBox.classList.remove(
    "highlight"
  );

  void assetBox.offsetWidth;

  assetBox.classList.add(
    "highlight"
  );

},
6200

);

// 総資産を十分見せてからリザルト
later(
() => {

  if(destroyed){
    return;
  }

  const rank =
    getRank();


  rankEl.textContent =
    rank;

  rankEl.style.color =
    rankColors[rank];


  resultAssetEl.textContent =
    signedYen(
      totalAsset
    );

  resultAssetEl.style.color =
    totalAsset >= 0
      ? "#62ffa4"
      : "#ff6464";


  resultOverlay.classList.remove(
    "hidden"
  );

  phase =
    "result";

},
9000

);
}

function startGame(){

  clearSequenceTimers();


  assetEl
    .getAnimations()
    .forEach(
      animation =>
        animation.cancel()
    );


  assetEl.style.filter =
    "";

  assetEl.style.textShadow =
    "";


  phase =
    "starting";


  price =
    18000000 +
    Math.random() *
    6000000;


  startPrice =
    price;


  totalAsset =
    0;


  timeLeft =
    45;


  chartTimer =
    0;


  marketTimer =
    0;


  shockTimer =
    2 +
    Math.random() *
    3;


  lastCountdownNumber =
    null;


  slots[0].type =
    null;


  slots[0].entry =
    0;


  slots[1].type =
    null;


  slots[1].entry =
    0;


  prices =
    Array(30).fill(
      price
    );


  chooseMarket();


  countdownEl.textContent =
    "";


  countdownEl.classList.remove(
    "show"
  );


  eventEl.textContent =
    "";


  eventEl.classList.remove(
    "show"
  );


  assetBox.classList.remove(
    "highlight"
  );


  startOverlay.classList.add(
    "hidden"
  );


  resultOverlay.classList.add(
    "hidden"
  );


  updateHUD();


  showCountdown(3);


  later(
    () => {

      if(destroyed){
        return;
      }

      showCountdown(2);

    },
    1000
  );


  later(
    () => {

      if(destroyed){
        return;
      }

      showCountdown(1);

    },
    2000
  );


  later(
    () => {

      if(destroyed){
        return;
      }

      countdownEl.textContent =
        "";

      countdownEl.classList.remove(
        "show"
      );

      lastTime =
        performance.now();

      phase =
        "playing";

    },
    3000
  );
}

    function loop(now){

      if(
        destroyed
      ){

        return;
      }


      const dt =
        Math.min(
          .05,
          (
            now -
            lastTime
          ) /
          1000 ||
          0
        );


      lastTime =
        now;


      if(
        phase ===
        "playing"
      ){

        timeLeft -=
          dt;


        marketUpdate(
          dt
        );


        chartTimer +=
          dt;


        if(
          chartTimer >=
          .08
        ){

          chartTimer =
            0;


          recordPrice();
        }


        if(
          timeLeft <=
          5 &&
          timeLeft >
          0
        ){

          const number =
            Math.ceil(
              timeLeft
            );


          if(
            number !==
            lastCountdownNumber
          ){

            lastCountdownNumber =
              number;


            showCountdown(
              number
            );
          }
        }


        if(
          timeLeft <=
          0
        ){

          timeLeft =
            0;


          beginFinishSequence();
        }


        updateHUD();
      }


      drawChart();


      rafId =
        requestAnimationFrame(
          loop
        );
    }


    function handleKeyDown(
      event
    ){

      if(
        event.code ===
        "Space"
      ){

        event.preventDefault();


        spaceDown =
          true;


        if(
          !event.repeat &&
          (
            phase ===
            "ready" ||
            phase ===
            "result"
          )
        ){

          startGame();
        }


        return;
      }


      if(
        event.repeat
      ){

        return;
      }


      if(
        event.code ===
        "ArrowLeft"
      ){

        event.preventDefault();


        operate(
          0,
          spaceDown
        );


        return;
      }


      if(
        event.code ===
        "ArrowRight"
      ){

        event.preventDefault();


        operate(
          1,
          spaceDown
        );
      }
    }


    function handleKeyUp(
      event
    ){

      if(
        event.code ===
        "Space"
      ){

        spaceDown =
          false;
      }
    }


    window.addEventListener(
      "keydown",
      handleKeyDown
    );


    window.addEventListener(
      "keyup",
      handleKeyUp
    );


    window.addEventListener(
      "resize",
      resizeCanvas
    );


    resizeCanvas();


    chooseMarket();


    prices =
      Array(30).fill(
        price
      );


    updateHUD();


    rafId =
      requestAnimationFrame(
        loop
      );


    return {

      destroy(){

        destroyed =
          true;


        clearSequenceTimers();


        if(
          rafId
        ){

          cancelAnimationFrame(
            rafId
          );
        }


        window.removeEventListener(
          "keydown",
          handleKeyDown
        );


        window.removeEventListener(
          "keyup",
          handleKeyUp
        );


        window.removeEventListener(
          "resize",
          resizeCanvas
        );
      }
    };
  }


  const gameDefinition = {

    id:
      GAME_ID,

    name:
      GAME_TITLE,

    mount:
      createGame
  };


  if(
    window.MiniGames &&
    typeof
    window.MiniGames.register ===
    "function"
  ){

    window.MiniGames.register(
      gameDefinition
    );

  }else{

    function startStandalone(){

      document.documentElement.style.margin =
        "0";


      document.documentElement.style.width =
        "100%";


      document.documentElement.style.height =
        "100%";


      document.documentElement.style.background =
        "#000";


      document.body.style.margin =
        "0";


      document.body.style.width =
        "100%";


      document.body.style.height =
        "100%";


      document.body.style.overflow =
        "hidden";


      document.body.style.background =
        "#000";


      const standalone =
        document.createElement(
          "div"
        );


      standalone.style.position =
        "fixed";


      standalone.style.inset =
        "0";


      standalone.style.width =
        "100vw";


      standalone.style.height =
        "100vh";


      document.body.appendChild(
        standalone
      );


      createGame(
        standalone
      );
    }


    if(
      document.body
    ){

      startStandalone();

    }else{

      window.addEventListener(
        "DOMContentLoaded",
        startStandalone,
        {
          once:true
        }
      );
    }
  }

})();

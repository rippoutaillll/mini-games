  function clamp(value,minimum,maximum){

    return Math.max(
      minimum,
      Math.min(
        maximum,
        value
      )
    );
  }

  function randomRange(minimum,maximum){

    return (
      minimum +
      Math.random() *
      (
        maximum -
        minimum
      )
    );
  }

  function randomInteger(minimum,maximum){

    return Math.floor(
      randomRange(
        minimum,
        maximum + 1
      )
    );
  }

  function randomDirection(){

    return (
      Math.random() < 0.5
        ? -1
        : 1
    );
  }

  function normalizeAngle(angle){

    angle %= TAU;

    if(angle > Math.PI){
      angle -= TAU;
    }

    if(angle < -Math.PI){
      angle += TAU;
    }

    return angle;
  }

  function easeOutCubic(progress){

    return (
      1 -
      Math.pow(
        1 - progress,
        3
      )
    );
  }

  /*
    弾痕を毎フレーム同じ形で描くための
    固定乱数。
  */
  function seededRandom(seed){

    const value =
      Math.sin(
        seed * 12.9898 +
        78.233
      ) *
      43758.5453;

    return (
      value -
      Math.floor(
        value
      )
    );
  }

  function chooseCueSpawnTime(){

    let selectedTime = 0;

    for(
      let attempt = 0;
      attempt < CFG.cueTimeRerollCount;
      attempt++
    ){

      const selection = Math.random();

      if(
        selection <
        CFG.cueEarlyChance
      ){

        selectedTime =
          randomRange(
            CFG.cueEarlyMinimumDelay,
            CFG.cueEarlyMaximumDelay
          );

      }else if(
        selection <
        CFG.cueEarlyChance +
        CFG.cueNormalChance
      ){

        selectedTime =
          randomRange(
            CFG.cueNormalMinimumDelay,
            CFG.cueNormalMaximumDelay
          );

      }else{

        selectedTime =
          randomRange(
            CFG.cueLateMinimumDelay,
            CFG.cueLateMaximumDelay
          );
      }

      /*
        1ラウンド目はそのまま採用する。

        2、3ラウンド目は、
        前回と十分違う時間なら採用する。
      */
      if(
        currentRound === 1 ||
        Math.abs(
          selectedTime -
          previousCueSpawnTime
        ) >=
        CFG.minimumCueTimeDifference
      ){

        return selectedTime;
      }
    }

    /*
      再抽選上限に達した場合。
    */
    return selectedTime;
  }

  function startNewGame(){

    currentRound = 1;
    roundScore = 0;
    totalScore = 0;

    previousCueSpawnTime = -100;

    startRound();
  }

  function startRound(){

    elapsedTime = 0;
    shotTime = 0;
    transitionTime = 0;
    resultTime = 0;

    cueSpawned = false;
    cueEscaped = false;

    shotUsed = false;
    shotKind = 'none';

    shotLocalX = 0;
    shotLocalY = 0;
    shotDistanceRatio = Infinity;

    roundScore = 0;
    resultNumber = 0;
    resultImpactSeed = 1;

    balls = [];
    sparks = [];

    screenFlash = 0;
    recoil = 0;

    cueSpawnTime =
      chooseCueSpawnTime();

    previousCueSpawnTime =
      cueSpawnTime;

    nextFakeSpawnTime =
      randomRange(
        CFG.firstFakeDelayMin,
        CFG.firstFakeDelayMax
      );

    fakeBurstRemaining = 0;

    mode = 'play';
    spaceReady = false;
  }

  function countVisibleFakeBalls(){

    let count = 0;

    for(const ball of balls){

      if(
        ball.kind ===
        'number'
      ){

        count++;
      }
    }

    return count;
  }

  function isFakePositionAvailable(positionX){

    for(const ball of balls){

      /*
        新しく出現するボールと、
        画面上部付近の既存ボールが
        重ならないようにする。
      */
      if(
        ball.y <
        CFG.ballRadius * 3.0
      ){

        if(
          Math.abs(
            ball.x -
            positionX
          ) <
          CFG.minimumBallSeparation
        ){

          return false;
        }
      }
    }

    return true;
  }

function chooseFakePosition(){

  /*
    キューボールとナンバーボールが
    接触しないために必要な中心間距離。
  */
  const requiredDistance =
    CFG.ballRadius * 2 +
    CFG.cueBallSafetyGap;

  /*
    ナンバーボールとキューボールの
    出現時刻の差から、縦方向の距離を計算する。

    全ボールが同じ速度なので、
    この縦方向の距離は落下中も変わらない。
  */
  const spawnTimeDifference =
    nextFakeSpawnTime -
    cueSpawnTime;

  const verticalDistance =
    Math.abs(
      spawnTimeDifference *
      CFG.fallSpeed
    );

  for(
    let attempt = 0;
    attempt < 30;
    attempt++
  ){

    const positionX =
      randomRange(
        CFG.fakeHorizontalMargin,
        W -
        CFG.fakeHorizontalMargin
      );

    let positionIsAvailable =
      true;

    /*
      すでに画面上部にいるボールとの
      出現直後の重なりを避ける。
    */
    for(const ball of balls){

      if(
        ball.y <
        CFG.ballRadius * 3
      ){

        const horizontalDistance =
          ball.x -
          positionX;

        const verticalSeparation =
          ball.y -
          CFG.ballStartY;

        const distance =
          Math.hypot(
            horizontalDistance,
            verticalSeparation
          );

        if(
          distance <
          requiredDistance
        ){

          positionIsAvailable =
            false;

          break;
        }
      }
    }

    if(!positionIsAvailable){
      continue;
    }

    /*
      キューボールとの将来的な接触を判定する。

      ナンバーボールは中央を通ってもよい。
      縦横を合わせた中心間距離が十分なら、
      中央付近でも出現できる。
    */
    const horizontalDistanceFromCue =
      Math.abs(
        positionX -
        CFG.aimX
      );

    const distanceFromCue =
      Math.hypot(
        horizontalDistanceFromCue,
        verticalDistance
      );

    if(
      distanceFromCue <
      requiredDistance
    ){

      continue;
    }

    return positionX;
  }

  /*
    安全な位置が見つからなければ、
    無理に出現させない。
  */
  return null;
}

  function scheduleNextFake(){

    /*
      バースト途中。
    */
    if(fakeBurstRemaining > 0){

      fakeBurstRemaining--;

      nextFakeSpawnTime =
        elapsedTime +
        randomRange(
          CFG.fakeBurstIntervalMin,
          CFG.fakeBurstIntervalMax
        );

      return;
    }

    /*
      新しいバーストを開始する。
    */
    if(
      Math.random() <
      CFG.fakeBurstChance
    ){

      fakeBurstRemaining =
        randomInteger(
          CFG.fakeBurstMinimumCount,
          CFG.fakeBurstMaximumCount
        ) -
        1;

      nextFakeSpawnTime =
        elapsedTime +
        randomRange(
          CFG.fakeBurstIntervalMin,
          CFG.fakeBurstIntervalMax
        );

      return;
    }

    /*
      ときどき長い間を作る。

      ただし毎回ではないため、
      空白後に必ずキューボールが来るとは限らない。
    */
    if(
      Math.random() <
      CFG.fakePauseChance
    ){

      nextFakeSpawnTime =
        elapsedTime +
        randomRange(
          CFG.fakePauseMin,
          CFG.fakePauseMax
        );

      return;
    }

    nextFakeSpawnTime =
      elapsedTime +
      randomRange(
        CFG.fakeIntervalMin,
        CFG.fakeIntervalMax
      );
  }

function spawnFakeBall(){

  if(
    countVisibleFakeBalls() >=
    CFG.maximumVisibleFakeBalls
  ){

    nextFakeSpawnTime =
      elapsedTime + 0.12;

    return;
  }

  const positionX =
    chooseFakePosition();

  /*
    安全な位置がない場合は、
    今回のフェイントを出さずに少し待つ。

    危険な位置へ強制出現させない。
  */
  if(positionX === null){

    nextFakeSpawnTime =
      elapsedTime +
      randomRange(
        0.12,
        0.25
      );

    return;
  }

  createBall(
    'number',
    positionX,
    randomInteger(
      1,
      15
    )
  );

  scheduleNextFake();
}

  function createBall(
    kind,
    positionX,
    number
  ){

    balls.push({

      kind:kind,

      x:positionX,
      y:CFG.ballStartY,

      radius:
        CFG.ballRadius,

      number:
        number || 0,

/*
 *キ*ーボールもナンバーボールも
  完全に同じ速度で落下する。
*/
speed:
 CFG.fallSpeed,

      surfaceAngle:
        kind === 'number'
          ? randomRange(
              -Math.PI,
              Math.PI
            )
          : 0,

      latitude:
        randomRange(
          -0.48,
          0.48
        ),

      spin:
        randomRange(
          CFG.ballSpinMin,
          CFG.ballSpinMax
        ) *
        randomDirection(),

      latitudeVelocity:
        randomRange(
          CFG.ballLatitudeSpeedMin,
          CFG.ballLatitudeSpeedMax
        ) *
        randomDirection(),

      shot:false,
      hitX:0,
      hitY:0,

      impactSeed:
        randomRange(
          1,
          10000
        )
    });
  }

  function calculateRoundScore(distanceRatio){

    /*
      中心は100点。

      ボールの外周へ近づくほど
      0点へ近づく。
    */
    const accuracy =
      clamp(
        1 -
        distanceRatio,
        0,
        1
      );

    return Math.round(
      CFG.maximumRoundScore *
      Math.pow(
        accuracy,
        CFG.scoreCurvePower
      )
    );
  }

  function getFinalRank(){

    if(
      totalScore >=
      CFG.finalRankS
    ){
      return 'S';
    }

    if(
      totalScore >=
      CFG.finalRankA
    ){
      return 'A';
    }

    if(
      totalScore >=
      CFG.finalRankB
    ){
      return 'B';
    }

    if(
      totalScore >=
      CFG.finalRankC
    ){
      return 'C';
    }

    if(
      totalScore >=
      CFG.finalRankD
    ){
      return 'D';
    }

    if(
      totalScore >=
      CFG.finalRankE
    ){
      return 'E';
    }

    return 'F';
  }

  function shoot(){

    if(
      mode !== 'play' ||
      shotUsed
    ){
      return;
    }

    shotUsed = true;
    spaceReady = false;

    shotTime = 0;
    screenFlash = 1;
    recoil = 1;

    let hitBall = null;
    let nearestDistance = Infinity;

    for(const ball of balls){

      const deltaX =
        CFG.aimX -
        ball.x;

      const deltaY =
        CFG.aimY -
        ball.y;

      const distance =
        Math.hypot(
          deltaX,
          deltaY
        );

      if(
        distance <=
        ball.radius &&
        distance <
        nearestDistance
      ){

        hitBall = ball;
        nearestDistance = distance;
      }
    }

    if(hitBall){

      shotLocalX =
        (
          CFG.aimX -
          hitBall.x
        ) /
        hitBall.radius;

      shotLocalY =
        (
          CFG.aimY -
          hitBall.y
        ) /
        hitBall.radius;

      hitBall.shot = true;
      hitBall.hitX = shotLocalX;
      hitBall.hitY = shotLocalY;

      resultImpactSeed =
        hitBall.impactSeed;

      if(
        hitBall.kind ===
        'cue'
      ){

        shotKind = 'cue';

        shotDistanceRatio =
          Math.hypot(
            shotLocalX,
            shotLocalY
          );

        roundScore =
          calculateRoundScore(
            shotDistanceRatio
          );

      }else{

        shotKind = 'number';
        resultNumber = hitBall.number;
        roundScore = 0;
      }

    }else{

      shotKind = 'empty';
      roundScore = 0;
    }

    totalScore += roundScore;

    createShotSparks();

    mode = 'shotFreeze';
  }

  function createShotSparks(){

    for(
      let i = 0;
      i < CFG.shotSparkCount;
      i++
    ){

      const angle =
        randomRange(
          0,
          TAU
        );

      const speed =
        randomRange(
          100,
          320
        );

      sparks.push({

        x:CFG.aimX,
        y:CFG.aimY,

        velocityX:
          Math.cos(
            angle
          ) *
          speed,

        velocityY:
          Math.sin(
            angle
          ) *
          speed,

        life:
          randomRange(
            0.12,
            0.30
          ),

        maximumLife:0.30,

        size:
          randomRange(
            2,
            5
          )
      });
    }
  }

  function beginResult(){

    transitionTime = 0;
    mode = 'fadeOut';
  }

  function updateEffects(deltaTime){

    screenFlash =
      Math.max(
        0,
        screenFlash -
        deltaTime /
        CFG.shotFlashSeconds
      );

    recoil =
      Math.max(
        0,
        recoil -
        deltaTime * 8
      );

    for(
      let i = sparks.length - 1;
      i >= 0;
      i--
    ){

      const spark = sparks[i];

      spark.life -= deltaTime;

      if(
        spark.life <= 0
      ){

        sparks.splice(
          i,
          1
        );

        continue;
      }

      spark.x +=
        spark.velocityX *
        deltaTime;

      spark.y +=
        spark.velocityY *
        deltaTime;

      spark.velocityX *=
        Math.pow(
          0.03,
          deltaTime
        );

      spark.velocityY *=
        Math.pow(
          0.03,
          deltaTime
        );
    }
  }

  function updateBallRotation(
    ball,
    deltaTime,
    multiplier
  ){

    if(
      ball.kind !==
      'number'
    ){
      return;
    }

    ball.surfaceAngle +=
      ball.spin *
      deltaTime *
      multiplier;

    ball.surfaceAngle =
      normalizeAngle(
        ball.surfaceAngle
      );

    ball.latitude +=
      ball.latitudeVelocity *
      deltaTime *
      multiplier;

    if(
      ball.latitude > 0.64
    ){

      ball.latitude = 0.64;
      ball.latitudeVelocity *= -1;
    }

    if(
      ball.latitude < -0.64
    ){

      ball.latitude = -0.64;
      ball.latitudeVelocity *= -1;
    }
  }

  function update(deltaTime){

    updateEffects(
      deltaTime
    );

    if(
      mode === 'play'
    ){

      elapsedTime += deltaTime;

      /*
        ナンバーボールはラウンド中ずっと生成する。

        キューボールが出現しても停止しない。
      */
      if(
        elapsedTime >=
        nextFakeSpawnTime
      ){

        spawnFakeBall();
      }

      /*
        キューボールをランダムな時刻で出す。
      */
      if(
        !cueSpawned &&
        elapsedTime >=
        cueSpawnTime
      ){

        cueSpawned = true;

        createBall(
          'cue',
          CFG.aimX,
          0
        );
      }

      for(const ball of balls){

        ball.y +=
          ball.speed *
          deltaTime;

        updateBallRotation(
          ball,
          deltaTime,
          1
        );
      }

      balls =
        balls.filter(
          function(ball){

            if(
              ball.y -
              ball.radius >
              CFG.ballRemoveY
            ){

              if(
                ball.kind ===
                'cue'
              ){

                cueEscaped = true;
              }

              return false;
            }

            return true;
          }
        );

      /*
        キューボールを見逃した場合。
      */
      if(
        cueEscaped &&
        !shotUsed
      ){

        shotUsed = true;
        shotKind = 'missed';
        roundScore = 0;

        beginResult();
      }

    }else if(
      mode ===
      'shotFreeze'
    ){

      shotTime += deltaTime;

      for(const ball of balls){

        updateBallRotation(
          ball,
          deltaTime,
          0.18
        );
      }

      if(
        shotTime >=
        CFG.shotFreezeSeconds
      ){

        beginResult();
      }

    }else if(
      mode ===
      'fadeOut'
    ){

      transitionTime += deltaTime;

      if(
        transitionTime >=
        CFG.fadeOutSeconds
      ){

        transitionTime = 0;
        mode = 'blackHold';
      }

    }else if(
      mode ===
      'blackHold'
    ){

      transitionTime += deltaTime;

      if(
        transitionTime >=
        CFG.blackHoldSeconds
      ){

        transitionTime = 0;
        resultTime = 0;

        mode = 'resultFadeIn';
      }

    }else if(
      mode ===
      'resultFadeIn'
    ){

      transitionTime += deltaTime;
      resultTime += deltaTime;

      if(
        transitionTime >=
        CFG.fadeInSeconds
      ){

        transitionTime = 0;
        spaceReady = false;

        mode = 'result';
      }

    }else if(
      mode === 'result'
    ){

      resultTime += deltaTime;
    }
  }

  function getBallColor(number){

    /*
      全ナンバーボールを単色にする。
    */
    const colors = [
      '#f1c232',
      '#3c83d5',
      '#e34c43',
      '#834eb2',
      '#ed782e',
      '#3b9a62',
      '#8b3038',
      '#34373b'
    ];

    return (
      colors[
        (
          number - 1
        ) %
        colors.length
      ]
    );
  }

  function drawBallShadow(radius){

    ctx.save();

    ctx.translate(
      0,
      radius * 1.12
    );

    ctx.scale(
      1,
      0.24
    );

    const shadow =
      ctx.createRadialGradient(
        0,
        0,
        1,
        0,
        0,
        radius * 1.1
      );

    shadow.addColorStop(
      0,
      'rgba(0,0,0,.38)'
    );

    shadow.addColorStop(
      1,
      'rgba(0,0,0,0)'
    );

    ctx.fillStyle = shadow;

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      radius * 1.1,
      0,
      TAU
    );

    ctx.fill();

    ctx.restore();
  }

  /*
    ナンバーボールの番号面。

    白丸と数字は同じ球面変形を受ける。
  */
  function drawNumberPatch(ball){

    const radius = ball.radius;

    const longitude =
      normalizeAngle(
        ball.surfaceAngle
      );

    const frontAmount =
      Math.cos(
        longitude
      );

    /*
      裏側では描かない。
    */
    if(frontAmount <= 0){
      return;
    }

    const latitude =
      clamp(
        ball.latitude,
        -0.64,
        0.64
      );

    const patchX =
      Math.sin(
        longitude
      ) *
      Math.cos(
        latitude
      ) *
      radius *
      0.78;

    const patchY =
      Math.sin(
        latitude
      ) *
      radius *
      0.74;

    const horizontalScale =
      Math.max(
        0.025,
        frontAmount
      );

    const verticalScale =
      Math.max(
        0.46,
        Math.cos(
          latitude
        )
      );

    const patchRadius =
      radius *
      0.34 *
      (
        0.74 +
        frontAmount * 0.26
      );

    ctx.save();

    ctx.translate(
      patchX,
      patchY
    );

    ctx.rotate(
      -Math.sin(
        longitude
      ) *
      latitude *
      0.30
    );

    ctx.scale(
      horizontalScale,
      verticalScale
    );

    ctx.globalAlpha *=
      0.55 +
      frontAmount * 0.45;

    const patchGradient =
      ctx.createRadialGradient(
        -patchRadius * 0.27,
        -patchRadius * 0.30,
        patchRadius * 0.05,

        0,
        0,
        patchRadius
      );

    patchGradient.addColorStop(
      0,
      '#ffffff'
    );

    patchGradient.addColorStop(
      0.68,
      '#f7f3e3'
    );

    patchGradient.addColorStop(
      1,
      '#cbc6b4'
    );

    ctx.fillStyle =
      patchGradient;

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      patchRadius,
      0,
      TAU
    );

    ctx.fill();

    ctx.strokeStyle =
      'rgba(20,18,15,.55)';

    ctx.lineWidth =
      Math.min(
        12,
        2 /
        Math.max(
          horizontalScale,
          0.15
        )
      );

    ctx.stroke();

    ctx.fillStyle =
      '#111111';

    ctx.font =
      '900 ' +
      Math.round(
        radius * 0.34
      ) +
      'px Arial';

    ctx.textAlign =
      'center';

    ctx.textBaseline =
      'middle';

    ctx.fillText(
      String(
        ball.number
      ),
      0,
      radius * 0.015
    );

    ctx.restore();
  }

  /*
    リアル寄りの弾痕。

    大きな焦げ跡にはせず、
    小さな穿孔、欠けた縁、短い亀裂、
    穴の内壁を描く。
  */
  function drawBulletHole(ball){

    if(!ball.shot){
      return;
    }

    const radius = ball.radius;

    const scaleRatio =
      radius /
      CFG.ballRadius;

    const hitX =
      ball.hitX *
      radius;

    const hitY =
      ball.hitY *
      radius;

    const holeRadius =
      CFG.bulletHoleRadius *
      scaleRatio;

    const rimRadius =
      CFG.bulletRimRadius *
      scaleRatio;

    const residueRadius =
      CFG.bulletResidueRadius *
      scaleRatio;

    const seed =
      ball.impactSeed || 1;

    ctx.save();

    /*
      ボールの外へ描画しない。
    */
    ctx.beginPath();

    ctx.arc(
      0,
      0,
      radius - 1,
      0,
      TAU
    );

    ctx.clip();

    /*
      ごく薄い粉状の接触跡。
    */
    const residue =
      ctx.createRadialGradient(
        hitX,
        hitY,
        rimRadius * 0.5,

        hitX,
        hitY,
        residueRadius
      );

    residue.addColorStop(
      0,
      'rgba(74,68,57,.34)'
    );

    residue.addColorStop(
      0.55,
      'rgba(110,100,82,.12)'
    );

    residue.addColorStop(
      1,
      'rgba(110,100,82,0)'
    );

    ctx.fillStyle = residue;

    ctx.beginPath();

    ctx.arc(
      hitX,
      hitY,
      residueRadius,
      0,
      TAU
    );

    ctx.fill();

    /*
      短い放射状の亀裂。
    */
    const crackCount =
      CFG.bulletCrackMinimumCount +
      Math.floor(
        seededRandom(
          seed + 7.31
        ) *
        (
          CFG.bulletCrackMaximumCount -
          CFG.bulletCrackMinimumCount +
          1
        )
      );

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    for(
      let i = 0;
      i < crackCount;
      i++
    ){

      const angle =
        (
          i /
          crackCount
        ) *
        TAU +
        seededRandom(
          seed +
          i * 11.43
        ) *
        1.05;

      const crackLength =
        (
          CFG.bulletCrackMinimumLength +
          seededRandom(
            seed +
            i * 17.19
          ) *
          (
            CFG.bulletCrackMaximumLength -
            CFG.bulletCrackMinimumLength
          )
        ) *
        scaleRatio;

      const bend =
        (
          seededRandom(
            seed +
            i * 23.77
          ) -
          0.5
        ) *
        2.1 *
        scaleRatio;

      const startDistance =
        rimRadius * 0.72;

      const middleDistance =
        crackLength * 0.58;

      const startX =
        hitX +
        Math.cos(
          angle
        ) *
        startDistance;

      const startY =
        hitY +
        Math.sin(
          angle
        ) *
        startDistance;

      const middleX =
        hitX +
        Math.cos(
          angle
        ) *
        middleDistance +
        Math.cos(
          angle +
          Math.PI / 2
        ) *
        bend;

      const middleY =
        hitY +
        Math.sin(
          angle
        ) *
        middleDistance +
        Math.sin(
          angle +
          Math.PI / 2
        ) *
        bend;

      const endX =
        hitX +
        Math.cos(
          angle
        ) *
        crackLength;

      const endY =
        hitY +
        Math.sin(
          angle
        ) *
        crackLength;

      ctx.strokeStyle =
        'rgba(52,47,39,.68)';

      ctx.lineWidth =
        Math.max(
          0.55,
          0.72 * scaleRatio
        );

      ctx.beginPath();

      ctx.moveTo(
        startX,
        startY
      );

      ctx.lineTo(
        middleX,
        middleY
      );

      ctx.lineTo(
        endX,
        endY
      );

      ctx.stroke();

      /*
        亀裂の片側のハイライト。
      */
      ctx.strokeStyle =
        'rgba(255,252,235,.22)';

      ctx.lineWidth =
        Math.max(
          0.30,
          0.34 * scaleRatio
        );

      ctx.beginPath();

      ctx.moveTo(
        startX - 0.45,
        startY - 0.45
      );

      ctx.lineTo(
        middleX - 0.45,
        middleY - 0.45
      );

      ctx.lineTo(
        endX - 0.45,
        endY - 0.45
      );

      ctx.stroke();
    }

    /*
      欠けた外縁。

      規則的な円ではなく、
      小さな不均一形状にする。
    */
    const rimPointCount = 14;

    ctx.fillStyle =
      '#b8b19f';

    ctx.beginPath();

    for(
      let i = 0;
      i < rimPointCount;
      i++
    ){

      const angle =
        (
          i /
          rimPointCount
        ) *
        TAU;

      const unevenRadius =
        rimRadius *
        (
          0.80 +
          seededRandom(
            seed +
            i * 5.93
          ) *
          0.38
        );

      const pointX =
        hitX +
        Math.cos(
          angle
        ) *
        unevenRadius;

      const pointY =
        hitY +
        Math.sin(
          angle
        ) *
        unevenRadius;

      if(i === 0){

        ctx.moveTo(
          pointX,
          pointY
        );

      }else{

        ctx.lineTo(
          pointX,
          pointY
        );
      }
    }

    ctx.closePath();
    ctx.fill();

    /*
      欠けた縁の陰影。
    */
    const rimShade =
      ctx.createRadialGradient(
        hitX -
        holeRadius * 0.32,
        hitY -
        holeRadius * 0.32,
        holeRadius * 0.10,

        hitX,
        hitY,
        rimRadius
      );

    rimShade.addColorStop(
      0,
      '#030303'
    );

    rimShade.addColorStop(
      0.46,
      '#0d0c0b'
    );

    rimShade.addColorStop(
      0.72,
      '#3a362f'
    );

    rimShade.addColorStop(
      1,
      'rgba(122,114,97,.70)'
    );

    ctx.fillStyle = rimShade;

    ctx.beginPath();

    ctx.arc(
      hitX,
      hitY,
      rimRadius * 0.76,
      0,
      TAU
    );

    ctx.fill();

    /*
      穿孔の内部。
    */
    const hole =
      ctx.createRadialGradient(
        hitX -
        holeRadius * 0.26,
        hitY -
        holeRadius * 0.23,
        holeRadius * 0.05,

        hitX,
        hitY,
        holeRadius
      );

    hole.addColorStop(
      0,
      '#000000'
    );

    hole.addColorStop(
      0.58,
      '#030303'
    );

    hole.addColorStop(
      1,
      '#171512'
    );

    ctx.fillStyle = hole;

    ctx.beginPath();

    ctx.ellipse(
      hitX,
      hitY,
      holeRadius,
      holeRadius * 0.88,
      -0.17,
      0,
      TAU
    );

    ctx.fill();

    /*
      穴の下側に見える内壁。
    */
    ctx.strokeStyle =
      'rgba(195,185,158,.46)';

    ctx.lineWidth =
      Math.max(
        0.65,
        0.82 * scaleRatio
      );

    ctx.beginPath();

    ctx.arc(
      hitX,
      hitY,
      holeRadius * 1.08,
      0.16,
      Math.PI * 0.86
    );

    ctx.stroke();

    /*
      穴の上側の暗い縁。
    */
    ctx.strokeStyle =
      'rgba(0,0,0,.88)';

    ctx.lineWidth =
      Math.max(
        0.62,
        0.78 * scaleRatio
      );

    ctx.beginPath();

    ctx.arc(
      hitX,
      hitY,
      holeRadius * 1.06,
      Math.PI * 1.02,
      TAU - 0.12
    );

    ctx.stroke();

    ctx.restore();
  }

  function drawBall(ball,alpha){

    ctx.save();

    ctx.globalAlpha =
      alpha === undefined
        ? 1
        : alpha;

    ctx.translate(
      ball.x,
      ball.y
    );

    const radius = ball.radius;

    drawBallShadow(
      radius
    );

    const mainColor =
      ball.kind === 'cue'
        ? '#f4f1e1'
        : getBallColor(
            ball.number
          );

    const sphere =
      ctx.createRadialGradient(
        -radius * 0.36,
        -radius * 0.40,
        radius * 0.05,

        radius * 0.08,
        radius * 0.10,
        radius * 1.02
      );

    sphere.addColorStop(
      0,
      '#ffffff'
    );

    sphere.addColorStop(
      0.20,
      ball.kind === 'cue'
        ? '#fffdf4'
        : mainColor
    );

    sphere.addColorStop(
      0.66,
      ball.kind === 'cue'
        ? '#ddd9c8'
        : mainColor
    );

    sphere.addColorStop(
      1,
      ball.kind === 'cue'
        ? '#74736a'
        : '#1b1b1b'
    );

    ctx.fillStyle = sphere;

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      radius,
      0,
      TAU
    );

    ctx.fill();

    if(
      ball.kind ===
      'number'
    ){

      drawNumberPatch(
        ball
      );
    }

    ctx.strokeStyle =
      'rgba(8,8,8,.58)';

    ctx.lineWidth =
      Math.max(
        2,
        radius * 0.025
      );

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      radius,
      0,
      TAU
    );

    ctx.stroke();

    /*
      表面反射。
    */
    const shine =
      ctx.createRadialGradient(
        -radius * 0.42,
        -radius * 0.46,
        1,

        -radius * 0.42,
        -radius * 0.46,
        radius * 0.42
      );

    shine.addColorStop(
      0,
      'rgba(255,255,255,.78)'
    );

    shine.addColorStop(
      0.34,
      'rgba(255,255,255,.30)'
    );

    shine.addColorStop(
      1,
      'rgba(255,255,255,0)'
    );

    ctx.fillStyle = shine;

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      radius,
      0,
      TAU
    );

    ctx.fill();

    drawBulletHole(
      ball
    );

    ctx.restore();
  }

        clamp(
          spark.life /
          spark.maximumLife,
          0,
          1

      ctx.fillStyle =
        '#fff3bd';

      ctx.shadowColor =
        '#ffb23c';

      ctx.shadowBlur = 10;

      ctx.beginPath();

      ctx.arc(
        spark.x,
        spark.y,
        spark.size,
        0,
        TAU
      );

      ctx.fill();

      ctx.restore();

    if(
      screenFlash > 0

      ctx.fillStyle =
        'rgba(255,255,255,' +
        screenFlash * 0.58 +

      ctx.fillRect(
        0,

function getRankColor(rank){

  const colors = {

    F:'#69D9FF', // 水色
    E:'#9BE04B', // 黄緑
    D:'#FFD84A', // 黄色
    C:'#FF982F', // オレンジ
    B:'#FF4242', // 赤
    A:'#FF69B4', // ピンク
    S:'#FF6F78'  // ピンクとオレンジの中間
  };

  return colors[rank];
}


function drawResultBackground(){

  /*
    最終ラウンドだけ赤系の背景にする。

    この変数は、この関数の中で定義して
    この関数の中だけで使用する。
  */
  const isFinalResult =
    currentRound ===
    CFG.totalRounds;

  const background =
    ctx.createLinearGradient(
      0,
      0,
      0,
      H
    );

  if(isFinalResult){

    background.addColorStop(
      0,
      '#b84b4b'
    );

    background.addColorStop(
      0.55,
      '#87333b'
    );

    background.addColorStop(
      1,
      '#4b1e27'
    );

  }else{

    background.addColorStop(
      0,
      '#4e9c84'
    );

    background.addColorStop(
      0.55,
      '#3b816b'
    );

    background.addColorStop(
      1,
      '#28604f'
    );
  }

  ctx.fillStyle =
    background;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  /*
    中央の照明。

    最終リザルトでは暖色系、
    1、2ラウンド目では緑系にする。
  */
  const glow =
    ctx.createRadialGradient(
      W / 2,
      240,
      20,

      W / 2,
      240,
      440
    );

  if(isFinalResult){

    glow.addColorStop(
      0,
      'rgba(255,220,205,.28)'
    );

    glow.addColorStop(
      1,
      'rgba(0,0,0,0)'
    );

  }else{

    glow.addColorStop(
      0,
      'rgba(230,255,245,.31)'
    );

    glow.addColorStop(
      1,
      'rgba(0,0,0,0)'
    );
  }

  ctx.fillStyle =
    glow;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  /*
    下側の床。

    最終リザルトでは赤系、
    それ以外では緑系。
  */
  ctx.fillStyle =
    isFinalResult
      ? '#632933'
      : '#34725f';

  ctx.beginPath();

  ctx.moveTo(
    0,
    430
  );

  ctx.lineTo(
    W,
    390
  );

  ctx.lineTo(
    W,
    H
  );

  ctx.lineTo(
    0,
    H
  );

  ctx.closePath();

  ctx.fill();
}

  function drawResultBall(){

    const progress =
      clamp(
        (
          resultTime -
          CFG.resultRevealDelay
        ) /
        0.30,
        0,
        1
      );

    const easedProgress =
      easeOutCubic(
        progress
      );

    const resultBall = {

      kind:
        shotKind === 'number'
          ? 'number'
          : 'cue',

      number:
        shotKind === 'number'
          ? resultNumber
          : 0,

      x:W / 2,

      y:
        158 -
        (
          1 -
          easedProgress
        ) *
        38,

      radius:
        CFG.resultBallRadius,

      surfaceAngle:0,
      latitude:0,

      /*
        キューボールへ命中したときだけ
        弾痕を表示する。
      */
      shot:
        shotKind === 'cue',

      hitX:
        shotLocalX,

      hitY:
        shotLocalY,

      impactSeed:
        resultImpactSeed
    };

    drawBall(
      resultBall,
      easedProgress
    );
  }

if(

    const pixelRatio =
      Math.min(
        window.devicePixelRatio ||
        1,
        2
      );

    canvas.width =
      Math.max(
        1,
        Math.round(
          rect.width *
          pixelRatio
        )
      );

    canvas.height =
      Math.max(
        1,
        Math.round(
          rect.height *
          pixelRatio
        )
      );

      Math.min(
        canvas.width / W,
        canvas.height / H
      );

    canvasOffsetX =
      (
        canvas.width -
        W *
        canvasScale
      ) /

    canvasOffsetY =

      );

      );

      canvas
    );

    root.appendChild(
      focusHint
    );

    target.appendChild(
      root
    );

    ctx =
      canvas.getContext(
        '2d'
      );

    resize();

    window.addEventListener(
      'keydown',
      keyDown,
      {
        passive:false
      }
    );

    window.addEventListener(
      'keyup',
      keyUp,
      {
        passive:false
      }
    );

    window.addEventListener(
      'resize',
      resize
    );

    root.addEventListener(
      'pointerdown',
      focusGame
    );

    animationFrame =
      requestAnimationFrame(
        gameLoop
      );

    setTimeout(
      focusGame,
      0
    );
  }

  function destroy(){

    if(destroyed){
      return;
    }

    destroyed = true;

    cancelAnimationFrame(
      animationFrame
    );

    window.removeEventListener(
      'keydown',
      keyDown
    );

    window.removeEventListener(
      'keyup',
      keyUp
    );

    window.removeEventListener(
      'resize',
      resize
    );

    if(root){

      root.removeEventListener(
        'pointerdown',
        focusGame
      );

      root.remove();
    }

    root = null;
    canvas = null;
    ctx = null;

    balls = [];
    sparks = [];
  }

  return {
    mount:mount,
    destroy:destroy
  };
}

    if(x<size-1){
      result.push({x:x+1,y:y});
    }

    if(y>0){
      result.push({x:x,y:y-1});

    if(y<size-1){
      result.push({x:x,y:y+1});

    return result;

  function distanceToSegment(px,py,ax,ay,bx,by){
    const dx=bx-ax;
    const dy=by-ay;
    const lengthSquared=dx*dx+dy*dy;

    if(lengthSquared===0){
      return Math.hypot(px-ax,py-ay);
    }

    const t=clamp(
      ((px-ax)*dx+(py-ay)*dy)/lengthSquared,
      0,
      1
    );

    return Math.hypot(
      px-(ax+dx*t),
      py-(ay+dy*t)
    );
  }

    ctx.moveTo(x+radius,y);
    ctx.lineTo(x+width-radius,y);
    ctx.quadraticCurveTo(x+width,y,x+width,y+radius);
    ctx.lineTo(x+width,y+height-radius);
    ctx.quadraticCurveTo(

      y+height,
      x+width-radius,
      y+height
    );
    ctx.lineTo(x+radius,y+height);
    ctx.quadraticCurveTo(x,y+height,x,y+height-radius);
    ctx.lineTo(x,y+radius);
    ctx.quadraticCurveTo(x,y,x+radius,y);

    };

  function normalizeCrosshairVelocity(){
    let x=crosshairVX;
    let y=crosshairVY;
    let length=Math.hypot(x,y);

    if(length===0){
      x=1;
      y=0.5;
      length=Math.hypot(x,y);
    }

    x/=length;
    y/=length;

    if(Math.abs(x)<CFG.minimumAxisRatio){
      x=CFG.minimumAxisRatio*(x<0?-1:1);
    }

    if(Math.abs(y)<CFG.minimumAxisRatio){
      y=CFG.minimumAxisRatio*(y<0?-1:1);
    }

    length=Math.hypot(x,y);

    crosshairVX=x/length*CFG.crosshairSpeed;
    crosshairVY=y/length*CFG.crosshairSpeed;
  }

    crosshairX=CFG.shootX+CFG.shootW*0.31;

    const startAngles=[

      Math.PI*0.16,
      Math.PI*0.24
    ];

    const angle=startAngles[
      randomInteger(0,startAngles.length-1)
    ];

    crosshairVX=Math.cos(angle)*CFG.crosshairSpeed;
    crosshairVY=Math.sin(angle)*CFG.crosshairSpeed;

      );

    crosshairVX=Math.cos(angle)*CFG.crosshairSpeed;
    crosshairVY=Math.sin(angle)*CFG.crosshairSpeed;

    normalizeCrosshairVelocity();

      CFG.crosshairRadius+

      CFG.shootX+
      CFG.shootW-
      CFG.crosshairRadius-
      12;

      CFG.shootY+
      CFG.crosshairRadius+
      12;

    const maximumY=
      CFG.shootY+
      CFG.shootH-
      CFG.crosshairRadius-
      12;

    crosshairX+=crosshairVX*deltaTime;
    crosshairY+=crosshairVY*deltaTime;

    let reflected=false;

    if(crosshairX<minimumX){
      crosshairX=minimumX;
      crosshairVX=Math.abs(crosshairVX);
      reflected=true;
    }

    if(crosshairX>maximumX){
      crosshairX=maximumX;
      crosshairVX=-Math.abs(crosshairVX);
      reflected=true;
    }

    if(crosshairY<minimumY){
      crosshairY=minimumY;
      crosshairVY=Math.abs(crosshairVY);
      reflected=true;
    }

    if(crosshairY>maximumY){
      crosshairY=maximumY;
      crosshairVY=-Math.abs(crosshairVY);
      reflected=true;

    if(reflected){

    const x=crosshairX-enemyX;
    const y=crosshairY-CFG.enemyY;

    if(
      Math.hypot(x,y+132)<=
      CFG.headRadius+4
    ){
      return true;
    }

    if(
      x>=-CFG.torsoWidth/2&&
      x<=CFG.torsoWidth/2&&
      y>=-98&&
      y<=47
    ){
      return true;
    }

    if(
      distanceToSegment(
        x,y,
        -27,-77,
        -72,-145
      )<=CFG.limbWidth/2+4
    ){
      return true;
    }

    if(
      distanceToSegment(
        x,y,
        27,-77,
        72,-145
      )<=CFG.limbWidth/2+4
    ){
      return true;
    }

    if(
      Math.hypot(x+72,y+145)<=
      CFG.limbWidth*0.68
    ){
      return true;
    }

    if(
      Math.hypot(x-72,y+145)<=
      CFG.limbWidth*0.68
    ){
      return true;
    }

    if(
      distanceToSegment(
        x,y,
        -28,36,
        -55,116
      )<=CFG.limbWidth/2+4
    ){
      return true;
    }

    if(
      distanceToSegment(
        x,y,
        28,36,
        55,116
      )<=CFG.limbWidth/2+4
    ){
      return true;
    }

    return false;
  }

  function generatePath(size,targetLength){
    const start={
      x:randomInteger(0,size-1),
      y:randomInteger(0,size-1)
    };

    const path=[start];

    const visited=new Set([
      cellKey(start.x,start.y)
    ]);

    function search(){
      if(path.length===targetLength){
        return true;
      }

      const current=path[path.length-1];

      let candidates=getNeighbors(
        current.x,
        current.y,
        size
      ).filter(function(cell){
        return !visited.has(
          cellKey(cell.x,cell.y)
        );
      });

      candidates=shuffle(candidates);

      candidates.sort(function(a,b){
        const aOptions=getNeighbors(
          a.x,
          a.y,
          size
        ).filter(function(cell){
          return !visited.has(
            cellKey(cell.x,cell.y)
          );
        }).length;

        const bOptions=getNeighbors(
          b.x,
          b.y,
          size
        ).filter(function(cell){
          return !visited.has(
            cellKey(cell.x,cell.y)
          );
        }).length;

        return aOptions-bOptions;
      });

      for(const candidate of candidates){
        const key=cellKey(
          candidate.x,
          candidate.y
        );

        visited.add(key);
        path.push(candidate);

        if(search()){
          return true;
        }

        path.pop();
        visited.delete(key);
      }

      return false;
    }

    return search()?path:null;
  }

  function countExtraConnections(path,size){
    const indices=new Map();

    for(let i=0;i<path.length;i++){
      indices.set(
        cellKey(path[i].x,path[i].y),
        i
      );
    }

    let count=0;

    for(let i=0;i<path.length;i++){
      const neighbors=getNeighbors(
        path[i].x,
        path[i].y,
        size
      );

      for(const neighbor of neighbors){
        const index=indices.get(
          cellKey(
            neighbor.x,
            neighbor.y
          )
        );

        if(
          index!==undefined&&
          Math.abs(index-i)>1
        ){
          count++;
        }
      }
    }

    return Math.floor(count/2);
  }

  function buildPuzzle(size,path){
    const active=new Set();

    for(const cell of path){
      active.add(
        cellKey(cell.x,cell.y)
      );
    }

    const start=path[0];
    const goal=path[path.length-1];

    return{
      size:size,
      active:active,
      solution:path.slice(),

      start:{
        x:start.x,
        y:start.y
      },

      goal:{
        x:goal.x,
        y:goal.y
      },

      current:{
        x:start.x,
        y:start.y
      },

      visited:new Set([
        cellKey(start.x,start.y)
      ]),

      trail:[{
        x:start.x,
        y:start.y
      }]
    };
  }

  function fallbackPuzzle(){
    return buildPuzzle(
      5,
      [
        {x:0,y:0},
        {x:1,y:0},
        {x:2,y:0},
        {x:3,y:0},
        {x:4,y:0},
        {x:4,y:1},
        {x:3,y:1},
        {x:2,y:1},
        {x:1,y:1},
        {x:0,y:1},
        {x:0,y:2},
        {x:1,y:2},
        {x:2,y:2},
        {x:3,y:2},
        {x:4,y:2}
      ]

  }

  function generatePuzzle(){
    const settings=getPuzzleSettings();

    for(
      let attempt=0;
      attempt<CFG.generationAttempts;
      attempt++
    ){
      const length=randomInteger(
        settings.minimumLength,
        settings.maximumLength
      );

      const path=generatePath(
        settings.size,
        length
      );

      if(!path){
        continue;
      }

      if(
        countExtraConnections(
          path,
          settings.size
        )>
        settings.maximumExtraConnections
      ){
        continue;
      }

      return buildPuzzle(
        settings.size,
        path
      );
    }

    return fallbackPuzzle();
  }

  function startNewPuzzle(){
    puzzle=generatePuzzle();
    puzzleState='active';
    puzzleEffectTimer=0;

    heldArrow=null;
    heldArrowTime=0;
    nextArrowRepeat=0;
  }

  function hasRemainingSolution(){
    if(!puzzle){
      return false;
    }

    let explored=0;
    const maximumExplored=80000;

    function search(current,visited){
      explored++;

      if(explored>maximumExplored){
        return true;
      }

      if(
        visited.size===
        puzzle.active.size
      ){
        return(
          current.x===puzzle.goal.x&&
          current.y===puzzle.goal.y
        );
      }

      let candidates=getNeighbors(
        current.x,
        current.y,
        puzzle.size
      ).filter(function(cell){
        const key=cellKey(
          cell.x,
          cell.y
        );

        return(
          puzzle.active.has(key)&&
          !visited.has(key)
        );
      });

      candidates=candidates.filter(
        function(cell){
          const goal=
            cell.x===puzzle.goal.x&&
            cell.y===puzzle.goal.y;

          if(!goal){
            return true;
          }

          return(
            visited.size===
            puzzle.active.size-1
          );
        }
      );

      for(const candidate of candidates){
        const key=cellKey(
          candidate.x,
          candidate.y
        );

        visited.add(key);

        if(search(candidate,visited)){
          return true;
        }

        visited.delete(key);
      }

      return false;
    }

    return search(
      puzzle.current,
      new Set(puzzle.visited)
    );
  }

  function completePuzzle(){
    score++;
    puzzleState='clear';
    puzzleEffectTimer=
      CFG.puzzleClearSeconds;
    heldArrow=null;
  }

  function failPuzzle(){
    puzzleState='failed';
    puzzleEffectTimer=
      CFG.puzzleFailSeconds;
    heldArrow=null;
  }

  function movePuzzle(direction){
    if(
      mode!=='play'||
      puzzleState!=='active'||
      !puzzle
    ){
      return;
    }

    const movements={
      ArrowLeft:{x:-1,y:0},
      ArrowRight:{x:1,y:0},
      ArrowUp:{x:0,y:-1},
      ArrowDown:{x:0,y:1}
    };

    const movement=movements[direction];

    if(!movement){
      return;
    }

    const next={
      x:puzzle.current.x+movement.x,
      y:puzzle.current.y+movement.y
    };

    const key=cellKey(next.x,next.y);

    if(
      !puzzle.active.has(key)||
      puzzle.visited.has(key)
    ){
      return;
    }

    puzzle.current=next;
    puzzle.visited.add(key);
    puzzle.trail.push({
      x:next.x,
      y:next.y
    });

    const allVisited=
      puzzle.visited.size===
      puzzle.active.size;

    const reachedGoal=
      next.x===puzzle.goal.x&&
      next.y===puzzle.goal.y;

    if(allVisited){
      if(reachedGoal){
        completePuzzle();
      }else{
        failPuzzle();
      }

      return;
    }

    if(reachedGoal){
      failPuzzle();
      return;
    }

    if(!hasRemainingSolution()){
      failPuzzle();
    }
  }

/*

enemyX=

  function beginTimeUp(){
    if(mode!=='play'){
      return;
    }

    remainingTime=0;
    timeUpTimer=0;
    heldArrow=null;
    mode='timeUp';
  }

  function updateHeldArrow(deltaTime){
    if(
      !heldArrow||
      mode!=='play'||
      puzzleState!=='active'
    ){
      return;
    }

    heldArrowTime+=deltaTime;

    if(
      heldArrowTime<
      CFG.arrowRepeatDelay
    ){
      return;
    }

    if(
      heldArrowTime>=
      nextArrowRepeat
    ){
      movePuzzle(heldArrow);

      nextArrowRepeat+=
        CFG.arrowRepeatInterval;
    }
  }

  function updateEffects(deltaTime){
    shotPulse=Math.max(
      0,
      shotPulse-deltaTime*8
    );

    areaFlash=Math.max(
      0,
      areaFlash-deltaTime
    );

    timeChangeTimer=Math.max(
      0,
      timeChangeTimer-deltaTime
    );

    for(
      let i=shotRings.length-1;
      i>=0;
      i--
    ){
      const ring=shotRings[i];

      ring.life-=deltaTime;
      ring.radius+=deltaTime*90;

      if(ring.life<=0){
        shotRings.splice(i,1);
      }
    }
  }

  function update(deltaTime){
    updateEffects(deltaTime);

    if(mode==='play'){
      updateHeldArrow(deltaTime);

      if(
        puzzleState==='clear'||
        puzzleState==='failed'
      ){
        puzzleEffectTimer-=deltaTime;

        if(puzzleEffectTimer<=0){
          startNewPuzzle();
        }
      }

      updateEnemy(deltaTime);
      updateCrosshair(deltaTime);

      shotCooldown=Math.max(
        0,
        shotCooldown-deltaTime
      );

      if(!testMode){
        remainingTime-=deltaTime;

        if(remainingTime<=0){
          beginTimeUp();
        }
      }

    }else if(mode==='timeUp'){
      timeUpTimer+=deltaTime;

      if(
        timeUpTimer>=
        CFG.timeUpSeconds
      ){
        fadeTimer=0;
        mode='resultFade';
      }

    }else if(mode==='resultFade'){
      fadeTimer+=deltaTime;

      if(fadeTimer>=CFG.fadeSeconds){
        spaceReady=false;
        mode='result';
      }
    }
  }

  function getPuzzleLayout(){
    const padding=48;

    const cellSize=Math.min(
      (
        CFG.puzzleW-
        padding*2
      )/
      puzzle.size,

      (
        CFG.puzzleH-
        padding*2
      )/
      puzzle.size
    );

    return{
      cellSize:cellSize,

      originX:
        CFG.puzzleX+
        (
          CFG.puzzleW-
          cellSize*puzzle.size
        )/2,

      originY:
        CFG.puzzleY+
        (
          CFG.puzzleH-
          cellSize*puzzle.size
        )/2
    };
  }

  function getCellCenter(x,y){
    const layout=getPuzzleLayout();

    return{
      x:
        layout.originX+
        (x+0.5)*
        layout.cellSize,

      y:
        layout.originY+
        (y+0.5)*
        layout.cellSize
    };
  }

  function drawStar(
    centerX,
    centerY,
    outerRadius,
    innerRadius
  ){
    ctx.beginPath();

    for(let i=0;i<10;i++){
      const radius=
        i%2===0
          ?outerRadius
          :innerRadius;

      const angle=
        -Math.PI/2+
        i*Math.PI/5;

      const x=
        centerX+
        Math.cos(angle)*radius;

      const y=
        centerY+
        Math.sin(angle)*radius;

      if(i===0){
        ctx.moveTo(x,y);
      }else{
        ctx.lineTo(x,y);
      }
    }

    ctx.closePath();
  }

  function drawPuzzle(){
    drawPanel(
      CFG.puzzleX,
      CFG.puzzleY,
      CFG.puzzleW,
      CFG.puzzleH,
      CFG.areaBackgroundColor
    );

    if(!puzzle){
      return;
    }

    const layout=getPuzzleLayout();
    const cellSize=layout.cellSize;

    for(let y=0;y<puzzle.size;y++){
      for(let x=0;x<puzzle.size;x++){
        const key=cellKey(x,y);

        if(!puzzle.active.has(key)){
          continue;
        }

        const center=getCellCenter(x,y);
        const squareSize=cellSize*0.75;
        const visited=puzzle.visited.has(key);

        ctx.fillStyle=
          visited
            ?'#4aaada'
            :'#f4f7f8';

        ctx.strokeStyle=
          visited
            ?'#1d7199'
            :'#81949e';

        ctx.lineWidth=2;

        roundedRect(
          center.x-squareSize/2,
          center.y-squareSize/2,
          squareSize,
          squareSize,
          Math.max(
            6,
            squareSize*0.13
          )
        );

        ctx.fill();
        ctx.stroke();
      }
    }

    if(puzzle.trail.length>1){
      ctx.strokeStyle='#135d84';

      ctx.lineWidth=Math.max(
        6,
        cellSize*0.12
      );

      ctx.lineCap='round';
      ctx.lineJoin='round';
      ctx.beginPath();

      for(
        let i=0;
        i<puzzle.trail.length;
        i++
      ){
        const center=getCellCenter(
          puzzle.trail[i].x,
          puzzle.trail[i].y
        );

        if(i===0){
          ctx.moveTo(
            center.x,
            center.y
          );
        }else{
          ctx.lineTo(
            center.x,
            center.y
          );
        }
      }

      ctx.stroke();
    }

    const goal=getCellCenter(
      puzzle.goal.x,
      puzzle.goal.y
    );

    ctx.fillStyle='#ffc83d';
    ctx.strokeStyle='#a96e10';
    ctx.lineWidth=2;

    drawStar(
      goal.x,
      goal.y,
      cellSize*0.22,
      cellSize*0.10
    );

    ctx.fill();
    ctx.stroke();

    const current=getCellCenter(
      puzzle.current.x,
      puzzle.current.y
    );

    ctx.fillStyle='#ffffff';
    ctx.strokeStyle='#174f6b';
    ctx.lineWidth=3;

    ctx.beginPath();
    ctx.arc(
      current.x,
      current.y,
      cellSize*0.17,
      0,
      TAU
    );
    ctx.fill();
    ctx.stroke();

    if(puzzleState==='clear'){
      ctx.save();

      ctx.strokeStyle='#69ef92';
      ctx.shadowColor='#69ef92';
      ctx.shadowBlur=22;
      ctx.lineWidth=7;

      roundedRect(
        CFG.puzzleX+3,
        CFG.puzzleY+3,
        CFG.puzzleW-6,
        CFG.puzzleH-6,
        16
      );

      ctx.stroke();
      ctx.restore();
    }

    if(puzzleState==='failed'){
      const progress=
        1-
        puzzleEffectTimer/
        CFG.puzzleFailSeconds;

      const scale=
        0.68+
        easeOutCubic(
          clamp(
            progress*2.2,
            0,
            1
          )
        )*
        0.32;

      ctx.save();

      ctx.fillStyle=
        'rgba(125,15,20,.30)';

      roundedRect(
        CFG.puzzleX+3,
        CFG.puzzleY+3,
        CFG.puzzleW-6,
        CFG.puzzleH-6,
        16
      );

      ctx.fill();

      ctx.translate(
        CFG.puzzleX+
        CFG.puzzleW/2,

        CFG.puzzleY+
        CFG.puzzleH/2
      );

      ctx.scale(scale,scale);

      ctx.strokeStyle='#ff3838';
      ctx.shadowColor='#ff2929';
      ctx.shadowBlur=25;
      ctx.lineWidth=24;
      ctx.lineCap='round';

      ctx.beginPath();
      ctx.moveTo(-72,-72);
      ctx.lineTo(72,72);
      ctx.moveTo(72,-72);
      ctx.lineTo(-72,72);
      ctx.stroke();

      ctx.restore();
    }

  function render(){
    ctx.setTransform(
      canvasScale,
      0,
      0,
      canvasScale,
      canvasOffsetX,
      canvasOffsetY
    );

    ctx.clearRect(
      -canvasOffsetX/canvasScale,
      -canvasOffsetY/canvasScale,
      canvas.width/canvasScale,
      canvas.height/canvasScale
    );

    ctx.save();

    ctx.beginPath();
    ctx.rect(0,0,W,H);
    ctx.clip();

    if(mode==='title'){
      drawTitle();
    }else if(mode==='play'){
      drawPlay();
    }else if(mode==='timeUp'){
      drawTimeUp();
    }else if(mode==='resultFade'){
      drawTimeUp();

      ctx.fillStyle=
        'rgba(0,0,0,'+
        clamp(
          fadeTimer/
          CFG.fadeSeconds,
          0,
          1
        )+
        ')';

      ctx.fillRect(0,0,W,H);
    }else if(mode==='result'){
      drawResult();
    }

    ctx.restore();
  }

  function isArrowKey(code){
    return(
      code==='ArrowLeft'||
      code==='ArrowRight'||
      code==='ArrowUp'||
      code==='ArrowDown'
    );
  }

  function keyDown(event){
    if(
      event.code==='ShiftLeft'||
      event.code==='ShiftRight'
    ){
      shiftDown=true;
      return;
    }

    if(isArrowKey(event.code)){
      event.preventDefault();

      if(event.repeat){
        return;
      }

      heldArrow=event.code;
      heldArrowTime=0;
      nextArrowRepeat=
        CFG.arrowRepeatDelay;

      movePuzzle(event.code);
      return;
    }

    if(event.code!=='Space'){
      return;
    }

    event.preventDefault();

    if(
      event.repeat||
      !spaceReady
    ){
      return;
    }

    spaceReady=false;

    if(mode==='title'){
      startGame(
        shiftDown||
        event.shiftKey
      );
      return;
    }

    if(mode==='play'){
      shoot();
      return;
    }

    if(mode==='result'){
      mode='title';
      testMode=false;
      puzzle=null;
      shotRings=[];
      heldArrow=null;
    }
  }

  function keyUp(event){
    if(
      event.code==='ShiftLeft'||
      event.code==='ShiftRight'
    ){
      shiftDown=false;
      return;
    }

    if(isArrowKey(event.code)){
      event.preventDefault();

      if(heldArrow===event.code){
        heldArrow=null;
        heldArrowTime=0;
      }

      return;
    }

    if(event.code==='Space'){
      event.preventDefault();
      spaceReady=true;
    }
  }

  function resize(){
    if(!root||!canvas){
      return;
    }

    const rect=
      root.getBoundingClientRect();

    const pixelRatio=Math.min(
      window.devicePixelRatio||1,
      2
    );

    canvas.width=Math.max(
      1,
      Math.round(
        rect.width*pixelRatio
      )
    );

    canvas.height=Math.max(
      1,
      Math.round(
        rect.height*pixelRatio
      )
    );

    canvasScale=Math.min(
      canvas.width/W,
      canvas.height/H
    );

    canvasOffsetX=
      (
        canvas.width-
        W*canvasScale
      )/2;

    canvasOffsetY=
      (
        canvas.height-
        H*canvasScale
      )/2;
  }

  function focusGame(){
    if(root){
      root.focus();
    }
  }

  function gameLoop(timestamp){
    if(destroyed){
      return;
    }

    const deltaTime=
      previousTime
        ?Math.min(
            0.033,
            (
              timestamp-
              previousTime
            )/1000
          )
        :0;

    previousTime=timestamp;

    update(deltaTime);
    render();

    animationFrame=
      requestAnimationFrame(
        gameLoop
      );
  }

  function mount(target){
    destroyed=false;
    previousTime=0;

    root=document.createElement('div');
    root.className='dtls-root';
    root.tabIndex=0;

    canvas=
      document.createElement(
        'canvas'
      );

    root.appendChild(canvas);
    target.appendChild(root);

    ctx=canvas.getContext('2d');

    resize();

    window.addEventListener(
      'keydown',
      keyDown,
      {passive:false}
    );

    window.addEventListener(
      'keyup',
      keyUp,
      {passive:false}
    );

    window.addEventListener(
      'resize',
      resize
    );

    root.addEventListener(
      'pointerdown',
      focusGame
    );

    animationFrame=
      requestAnimationFrame(
        gameLoop
      );

    setTimeout(focusGame,0);
  }

  function destroy(){
    if(destroyed){
      return;
    }

    destroyed=true;

    cancelAnimationFrame(
      animationFrame
    );

    window.removeEventListener(
      'keydown',
      keyDown
    );

    window.removeEventListener(
      'keyup',
      keyUp
    );

    window.removeEventListener(
      'resize',
      resize
    );

    if(root){
      root.removeEventListener(
        'pointerdown',
        focusGame
      );

      root.remove();
    }

    root=null;
    canvas=null;
    ctx=null;
    puzzle=null;
    shotRings=[];
  }

  return{
    mount:mount,
    destroy:destroy
  };
}

};

}

})();

<script>
(function(){
'use strict';

const GAME_ID = 'ceiling-trap-ricochet-20260828';

function createCeilingTrap(){

  const W = 600;
  const H = 800;

  /*
    ============================================================
    調整しやすい設定
    ============================================================

    maxHP
    ハートのHP。

    heartSize
    ハートの大きさ。

    ceilingFallSeconds
    天井が点線へ到達するまでの秒数。

    aimRoundTripSeconds
    銃が10度から50度へ動き、
    再び10度へ戻るまでの秒数。

    shotCooldownSeconds
    次の弾を撃てるようになるまでの秒数。

    bulletSpeed
    弾の速度。

    bulletRadius
    弾の大きさ。

    switchRadius
    スイッチの大きさ。
    ============================================================
  */

  const CFG = {
    maxHP: 3,
    heartSize: 46,
    ceilingFallSeconds: 30,
    aimRoundTripSeconds: 3,
    shotCooldownSeconds: 2,
    bulletSpeed: 480,
    bulletRadius: 6,
    switchRadius: 15,

    dangerLineY: H * 0.5,
    ceilingStartY: 70,
    ceilingHeight: 120,
    ceilingVisualHeight: 1200,
    aimMinDeg: 10,
    aimMaxDeg: 50
  };

  let root = null;
  let canvas = null;
  let ctx = null;

  let raf = 0;
  let last = 0;
  let destroyed = false;

  let scale = 1;
  let offsetX = 0;
  let offsetY = 0;

  let mode = 'title';

  let elapsed = 0;
  let ceilingY = CFG.ceilingStartY;
  let aimClock = 0;
  let cooldown = 0;
  let recoil = 0;

  let hp = CFG.maxHP;

  let bullets = [];
  let sparks = [];
  let heartBits = [];
  let switches = [];

  let shake = 0;
  let crushClock = 0;
  let fallSpeed = 0;
  let personFall = 0;
  let hitFlashTime = 0;
  let fatalFlashTime = 0;

  let spaceHeld = false;
  let spaceArmed = false;

  const person = {
    x: 55,
    y: H - 205,
    w: 105,
    h: 170
  };

  function reset(){

    mode = 'play';

    elapsed = 0;
    ceilingY = CFG.ceilingStartY;

    aimClock = 0;
    cooldown = 0;
    recoil = 0;

    hp = CFG.maxHP;

    bullets = [];
    sparks = [];
    heartBits = [];

    shake = 0;
    crushClock = 0;
    fallSpeed = 0;
    personFall = 0;
    hitFlashTime = 0;
    fatalFlashTime = 0;

    /*
      開始に使ったSpaceで発砲させない。
      一度Spaceを離すまでは撃てない。
    */
    spaceArmed = false;

    switches = [
      { x: W * 0.22, pressed: false, press: 0 },
      { x: W * 0.50, pressed: false, press: 0 },
      { x: W * 0.78, pressed: false, press: 0 }
    ];
  }

  function clamp(value,min,max){
    return Math.max(min,Math.min(max,value));
  }

  function aimAngle(){

    const cycle = Math.max(
      0.2,
      CFG.aimRoundTripSeconds
    );

    const half = cycle / 2;
    const t = (aimClock % cycle) / half;

    /*
      0から1へ進み、次に1から0へ戻る。
      端で減速せず等速で往復する。
    */
    const progress = t <= 1
      ? t
      : 2 - t;

    const degrees =
      CFG.aimMinDeg +
      (
        CFG.aimMaxDeg -
        CFG.aimMinDeg
      ) * progress;

    return degrees * Math.PI / 180;
  }

  function gunPivot(){

  const personScale = 1.4;

  return {
    x:
      person.x +
      37 * personScale,

    y:
      person.y +
      personFall +
      38 * personScale
  };
}

  function fire(){

    if(
      mode !== 'play' ||
      cooldown > 0
    ){
      return;
    }

    const angle = aimAngle();
    const pivot = gunPivot();
    const gunLength = 58 * 1.4;

    const muzzleX =
      pivot.x +
      Math.cos(angle) * gunLength;

    const muzzleY =
      pivot.y -
      Math.sin(angle) * gunLength;

    bullets.push({
      x: muzzleX,
      y: muzzleY,
      previousX: muzzleX,
      previousY: muzzleY,

      vx: Math.cos(angle) * CFG.bulletSpeed,
      vy: -Math.sin(angle) * CFG.bulletSpeed,

      radius: CFG.bulletRadius,
      reflected: false,
      age: 0
    });

    cooldown = CFG.shotCooldownSeconds;
    recoil = 1;

    spawnSparks(
      muzzleX,
      muzzleY,
      Math.cos(angle),
      -Math.sin(angle),
      8,
      'muzzle'
    );
  }

  function spawnSparks(
    x,
    y,
    directionX,
    directionY,
    count,
    type
  ){

    for(let i = 0; i < count; i++){

      const spread =
        (Math.random() - 0.5) *
        (
          type === 'muzzle'
            ? 1.1
            : Math.PI * 2
        );

      const angle =
        type === 'muzzle'
          ? Math.atan2(
              directionY,
              directionX
            ) + spread
          : spread;

      const speed =
        (
          type === 'muzzle'
            ? 80
            : 55
        ) +
        Math.random() *
        (
          type === 'muzzle'
            ? 170
            : 140
        );

      sparks.push({
        x: x,
        y: y,

        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,

        life: 0.18 + Math.random() * 0.28,
        size: 1 + Math.random() * 2.4,

        color:
          type === 'heart'
            ? '#ef334d'
            : '#ffc35b'
      });
    }
  }

function heartCenter(){

  const personScale = 1.4;

  return {
    x:
      person.x +
      35 * personScale,

    /*
      最後の「+ 12」が下へずらす量。
    */
    y:
      person.y +
      personFall +
      54 * personScale +
      20
  };
}

  function circleHit(
    bullet,
    targetX,
    targetY,
    targetRadius
  ){

    const dx = bullet.x - targetX;
    const dy = bullet.y - targetY;

    const combinedRadius =
      bullet.radius +
      targetRadius;

    return (
      dx * dx +
      dy * dy
    ) <= (
      combinedRadius *
      combinedRadius
    );
  }

  function pressSwitch(
    switchObject,
    bulletIndex
  ){

    switchObject.pressed = true;
    switchObject.press = 0;

    /*
      スイッチに当たった弾は消える。
    */
    bullets.splice(bulletIndex,1);

function bulletHitsPerson(bullet){

  const personScale = 1.4;

  const personX =
    person.x;

  const personY =
    person.y +
    personFall;

  /*
    頭の当たり判定。
  */
  const headX =
    personX +
    35 * personScale;

  const headY =
    personY +
    22 * personScale;

  const headRadius =
    19 * personScale;

  const headDX =
    bullet.x -
    headX;

  const headDY =
    bullet.y -
    headY;

  const combinedHeadRadius =
    bullet.radius +
    headRadius;

  const hitHead =
    headDX * headDX +
    headDY * headDY <=
    combinedHeadRadius *
    combinedHeadRadius;

  /*
    胴体の当たり判定。
  */
  const body = {
    x:
      personX +
      13 * personScale,

    y:
      personY +
      35 * personScale,

    w:
      44 * personScale,

    h:
      59 * personScale
  };

  /*
    左脚の当たり判定。
  */
  const leftLeg = {
    x:
      personX +
      12 * personScale,

    y:
      personY +
      88 * personScale,

    w:
      23 * personScale,

    h:
      40 * personScale
  };

  /*
    右脚の当たり判定。
  */
  const rightLeg = {
    x:
      personX +
      38 * personScale,

    y:
      personY +
      88 * personScale,

    w:
      23 * personScale,

    h:
      40 * personScale
  };

  function circleHitsRectangle(
    circle,
    rectangle
  ){

    const nearestX =
      Math.max(
        rectangle.x,
        Math.min(
          circle.x,
          rectangle.x +
          rectangle.w
        )
      );

    const nearestY =
      Math.max(
        rectangle.y,
        Math.min(
          circle.y,
          rectangle.y +
          rectangle.h
        )
      );

    const dx =
      circle.x -
      nearestX;

    const dy =
      circle.y -
      nearestY;

    return (
      dx * dx +
      dy * dy <=
      circle.radius *
      circle.radius
    );
  }

  if(hitHead){
    return true;
  }

  if(
    circleHitsRectangle(
      bullet,
      body
    )
  ){
    return true;
  }

  if(
    circleHitsRectangle(
      bullet,
      leftLeg
    )
  ){
    return true;
  }

  if(
    circleHitsRectangle(
      bullet,
      rightLeg
    )
  ){
    return true;
  }

  return false;
}


function updateBullets(
  deltaTime,
  allowHeartDamage
){

  /*
    天井の下側が弾の反射面。
    スイッチもこの高さに付いている。
  */
  const ceilingSurface =
    ceilingY +
    CFG.ceilingHeight;

  for(
    let bulletIndex = bullets.length - 1;
    bulletIndex >= 0;
    bulletIndex--
  ){

    const bullet =
      bullets[bulletIndex];

    bullet.previousX =
      bullet.x;

    bullet.previousY =
      bullet.y;

    bullet.age +=
      deltaTime;

    let remainingTime =
      deltaTime;

    let guard = 0;
    let removed = false;

    /*
      弾の高速移動による
      すり抜けを防ぐため、
      移動を細かく分けて計算する。
    */
    while(
      remainingTime > 0 &&
      guard++ < 8 &&
      !removed
    ){

      const step =
        Math.min(
          remainingTime,
          0.004
        );

      bullet.x +=
        bullet.vx *
        step;

      bullet.y +=
        bullet.vy *
        step;

      remainingTime -=
        step;

      /*
        スイッチの判定を、
        壁や天井の反射より先に確認する。

        この処理により、
        半円の端をかすめた弾も反応する。
      */
      let hitSwitch = false;

      for(
        const switchObject
        of switches
      ){

        /*
          押されたスイッチは
          天井へ引っ込んでいるため、
          判定しない。
        */
        if(
          switchObject.pressed
        ){
          continue;
        }

        /*
          見た目より少し広い判定。

          1.18を大きくすると
          さらに当たりやすくなる。
        */
        const switchHitRadius =
          CFG.switchRadius *
          0.9;

        if(
          circleHit(
            bullet,
            switchObject.x,
            ceilingSurface,
            switchHitRadius
          )
        ){

          pressSwitch(
            switchObject,
            bulletIndex
          );

          removed = true;
          hitSwitch = true;

          break;
        }
      }

      /*
        スイッチへ当たった弾は
        pressSwitch()で削除済み。
      */
      if(hitSwitch){
        break;
      }

      let bounced = false;

      /*
        左壁で反射。
      */
      if(
        bullet.x -
        bullet.radius <
        0 &&
        bullet.vx < 0
      ){

        bullet.x =
          bullet.radius;

        bullet.vx =
          -bullet.vx;

        bounced = true;
      }

      /*
        右壁で反射。
      */
      if(
        bullet.x +
        bullet.radius >
        W &&
        bullet.vx > 0
      ){

        bullet.x =
          W -
          bullet.radius;

        bullet.vx =
          -bullet.vx;

        bounced = true;
      }

      /*
        スイッチ以外の天井部分で反射。
      */
      if(
        bullet.y -
        bullet.radius <
        ceilingSurface &&
        bullet.vy < 0
      ){

        bullet.y =
          ceilingSurface +
          bullet.radius;

        bullet.vy =
          -bullet.vy;

        bounced = true;
      }

/*
  壁または天井で反射した弾を
  危険な弾へ切り替える。
*/
if(bounced){

  bullet.reflected = true;

  /*
    反射地点に小さな火花を出す。
  */
  spawnSparks(
    bullet.x,
    bullet.y,
    0,
    0,
    6,
    'wall'
  );
}

/*
  一度以上反射した弾が人物へ当たると、
  HPが1減って弾が消える。

  発射直後の弾はreflectedがfalseなので、
  銃口付近で自分に当たることはない。
*/
if(
  allowHeartDamage &&
  bullet.reflected &&
  bulletHitsPerson(bullet)
){

  damageHeart(
    bulletIndex
  );

  removed = true;

  break;
}    }

    /*
      下端では反射しない。
      弾全体が画面外へ出たら削除する。
    */
    if(
      !removed &&
      bullet.y -
      bullet.radius >
      H + 12
    ){

      bullets.splice(
        bulletIndex,
        1
      );
    }
  }
}

      elapsed += deltaTime;
      aimClock += deltaTime;

        0,
        cooldown - deltaTime
      );

      const ceilingProgress = clamp(
        elapsed /
        Math.max(
          0.1,
          CFG.ceilingFallSeconds
        ),
        0,
        1
      );

      ceilingY =
        CFG.ceilingStartY +
        (
          CFG.dangerLineY -
          CFG.ceilingHeight -

        ) *

      );

}else if(mode === 'fatalFlash'){

    単純な機械的シルエットにする。
  */
  ctx.fillStyle = '#76929e';
  ctx.strokeStyle = '#263941';
  ctx.lineWidth = 2;

  ctx.beginPath();

  ctx.arc(
    35,
    21,
    19,
    Math.PI,
    Math.PI * 2
  );

  ctx.lineTo(
    54,
    29
  );

  ctx.quadraticCurveTo(
    51,
    37,
    42,
    38
  );

  ctx.lineTo(
    25,
    38
  );

  ctx.quadraticCurveTo(
    16,
    34,
    16,
    25
  );

  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  /*
    ヘルメット上部の明るい面。
  */
  ctx.fillStyle = '#b8cbd2';

  ctx.beginPath();

  ctx.arc(
    35,
    20,
    14,
    Math.PI,
    Math.PI * 1.82
  );

  ctx.lineTo(
    22,
    20
  );

  ctx.closePath();
  ctx.fill();

  /*
    顔の代わりになる暗いバイザー。
  */
  ctx.fillStyle = '#1c2a30';

  ctx.beginPath();

  ctx.roundRect(
    35,
    20,
    20,
    11,
    4
  );

  ctx.fill();

  /*
    バイザーの小さな反射。
  */
  ctx.fillStyle = 'rgba(160,225,240,.48)';

  ctx.fillRect(
    39,

  );

  /*

  ctx.save();

  );

  /*

  ctx.fillStyle = '#26373f';

  );

  /*

  */

  /*

}


  function heartPath(x,y,size){

    ctx.beginPath();

    ctx.moveTo(
      x,
      y + size * 0.32
    );

    ctx.bezierCurveTo(
      x - size * 0.58,
      y - size * 0.08,

      x - size * 0.5,
      y - size * 0.62,

      x,
      y - size * 0.33
    );

    ctx.bezierCurveTo(
      x + size * 0.5,
      y - size * 0.62,

      x + size * 0.58,
      y - size * 0.08,

      x,
      y + size * 0.32
    );

    ctx.closePath();
  }

  function drawHeart(){

    if(hp <= 0 && mode !== 'fatalFlash'
    ){
      return;
    }

    const heart = heartCenter();

    const hpRatio =
      hp /
      CFG.maxHP;

    const danger =
      1 -
      hpRatio;

    /*
      HPが少ないほど鼓動と発光が強くなる。
    */
    const pulse =
      1 +
      danger *
      0.08 *
      Math.sin(
        performance.now() *
        0.012
      );

    const size =
      CFG.heartSize *
      pulse;

    /*
      最初は落ち着いた赤。
      HPが減るほど明るい赤へ変化する。
    */
    const red =
      Math.round(
        135 +
        danger * 120
      );

    const green =
      Math.round(
        32 +
        danger * 28
      );

    const blue =
      Math.round(
        45 +
        danger * 18
      );

    ctx.save();

    ctx.shadowColor =
      'rgb(' +
      red + ',' +
      green + ',' +
      blue + ')';

    ctx.shadowBlur =
      5 +
      danger * 17;

    ctx.fillStyle =
      'rgb(' +
      red + ',' +
      green + ',' +
      blue + ')';

    heartPath(
      heart.x,
      heart.y,
      size
    );

    ctx.fill();

    ctx.shadowBlur = 0;

    /*
      HPが減るほどひびを増やす。
    */
    ctx.strokeStyle =
      'rgba(35,0,6,.85)';

    ctx.lineWidth = 2;

    if(
      hp <=
      CFG.maxHP * 0.75
    ){
      ctx.beginPath();

      ctx.moveTo(
        heart.x - 2,
        heart.y -
        size * 0.27
      );

      ctx.lineTo(
        heart.x + 3,
        heart.y -
        size * 0.02
      );

      ctx.lineTo(
        heart.x - 4,
        heart.y +
        size * 0.14
      );

      ctx.stroke();
    }

    if(
      hp <=
      CFG.maxHP * 0.45
    ){
      ctx.beginPath();

      ctx.moveTo(
        heart.x + 3,
        heart.y -
        size * 0.02
      );

      ctx.lineTo(
        heart.x +
        size * 0.24,
        heart.y +
        size * 0.03
      );

      ctx.lineTo(
        heart.x +
        size * 0.08,
        heart.y +
        size * 0.24
      );

      ctx.stroke();
    }

    ctx.restore();
  }

  function drawBullets(){

    for(const bullet of bullets){

      ctx.save();

      /*
        短い黄銅色の軌跡。
        強く発光させず、レーザーには見せない。
      */
      ctx.strokeStyle =
        'rgba(214,166,77,.38)';

      ctx.lineWidth = 3;

      ctx.beginPath();

      ctx.moveTo(
        bullet.x -
        bullet.vx /
        CFG.bulletSpeed *
        18,

        bullet.y -
        bullet.vy /
        CFG.bulletSpeed *
        18
      );

      ctx.lineTo(
        bullet.x,
        bullet.y
      );

      ctx.stroke();

      ctx.fillStyle = '#c99a43';
      ctx.strokeStyle = '#5b421d';
      ctx.lineWidth = 1.5;

      ctx.beginPath();

      ctx.arc(
        bullet.x,
        bullet.y,
        bullet.radius,
        0,
        Math.PI * 2
      );

      ctx.fill();
      ctx.stroke();

      ctx.restore();
    }
  }

  function drawParticles(){

    for(const spark of sparks){

      ctx.save();

      ctx.globalAlpha = clamp(
        spark.life * 4,
        0,
        1
      );

      ctx.fillStyle =
        spark.color;

      ctx.fillRect(
        spark.x,
        spark.y,
        spark.size,
        spark.size
      );

      ctx.restore();
    }

    for(const piece of heartBits){

      ctx.save();

      ctx.globalAlpha = clamp(
        piece.life,
        0,
        1
      );

      ctx.translate(
        piece.x,
        piece.y
      );

      ctx.rotate(
        piece.rotation
      );

      ctx.fillStyle = '#e7354d';

      ctx.fillRect(
        -piece.size / 2,
        -piece.size / 3,
        piece.size,
        piece.size * 0.7
      );

      ctx.restore();
    }
  }


function drawShotGauge(){

  /*
    プレイ中だけ表示する。
  */
  if(mode !== 'play'){
    return;
  }

  /*
    クールタイムの回復率。
    発射直後は0、発射可能なら1。
  */
  const recovery =
    CFG.shotCooldownSeconds <= 0
      ? 1
      : clamp(
          1 -
          cooldown /
          CFG.shotCooldownSeconds,
          0,
          1
        );

  /*
    人物の右側にゲージを固定する。
  */
  const gaugeX =
    person.x + 120;

  const gaugeY =
    person.y + 108;

  const gaugeWidth = 105;
  const gaugeHeight = 12;

  ctx.save();

  /*
    ゲージの暗い背景。
  */
  ctx.fillStyle =
    'rgba(15,20,23,.82)';

  ctx.fillRect(
    gaugeX,
    gaugeY,
    gaugeWidth,
    gaugeHeight
  );

  /*
    回復中のゲージ。
    待機中は黄橙色、発射可能になると緑色。
  */
  ctx.fillStyle =
    recovery >= 1
      ? '#d94b00'
      : '#dda43b';

  ctx.fillRect(
    gaugeX + 2,
    gaugeY + 2,
    (
      gaugeWidth - 4
    ) * recovery,
    gaugeHeight - 4
  );

  /*
    枠線。
  */
  ctx.strokeStyle =
    recovery >= 1
      ? '#ffd09a'
      : 'rgba(255,236,190,.8)';

  ctx.lineWidth = 2;

  ctx.strokeRect(
    gaugeX,
    gaugeY,
    gaugeWidth,
    gaugeHeight
  );

  ctx.restore();
}

function drawHP(){

  ctx.save();

  /*
    HP表示の背景。
  */
  ctx.fillStyle = 'rgba(20,25,29,.86)';

  ctx.fillRect(
    18,
    H - 62,
    128,
    42
  );

  /*
    HP表示の枠線。
  */
  ctx.strokeStyle = 'rgba(230,239,243,.7)';
  ctx.lineWidth = 2;

  ctx.strokeRect(
    18,
    H - 62,
    128,
    42
  );

  /*
    HPという文字。
  */
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 21px sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';

  ctx.fillText(
    'HP',
    31,
    H - 41
  );

  /*
    HPを5個の四角で表示する。
  */
  const blockWidth = 20;
  const blockHeight = 17;
  const blockGap = 5;
  const startX = 66;

  for(let i = 0; i < CFG.maxHP; i++){

    /*
      残っているHPは赤。
      減ったHPは暗い灰色。
    */
    if(i < hp){

      const danger =
        1 -
        hp / CFG.maxHP;

      const red =
        Math.round(
          185 +
          danger * 70
        );

      ctx.fillStyle =
        'rgb(' +
        red +
        ',42,58)';

    }else{

      ctx.fillStyle = '#3b3f43';
    }

    ctx.fillRect(
      startX +
      i *
      (
        blockWidth +
        blockGap
      ),
      H - 50,
      blockWidth,
      blockHeight
    );

    /*
      各HPブロックの枠線。
    */
    ctx.strokeStyle = 'rgba(255,255,255,.22)';
    ctx.lineWidth = 1;

    ctx.strokeRect(
      startX +
      i *
      (
        blockWidth +
        blockGap
      ),
      H - 50,
      blockWidth,
      blockHeight
    );
  }

  ctx.restore();
}

  function drawTitle(){

    );

    );

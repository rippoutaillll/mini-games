  }

  function drawClear(){

  ctx.save();

  const pulse =
    1 +
    0.025 *
    Math.sin(
      performance.now() *
      0.006
    );

  ctx.translate(
    W / 2,
    350
  );

  ctx.scale(
    pulse,
    pulse
  );

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  /*
    serifをやめ、角が安定しやすい
    sans-serifを使用する。
  */
  ctx.font =
    '900 92px sans-serif';

  /*
    角の接続を丸くする。
    Eなどの角から棘が出にくくなる。
  */
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  /*
    マイターが極端に伸びることも抑える。
  */
  ctx.miterLimit = 2;

  /*
    黒い外縁。
    前より少し細くする。
  */
  ctx.lineWidth = 9;

  ctx.strokeStyle =
    'rgba(55,29,0,.88)';

  ctx.strokeText(
    'CLEAR',
    0,
    0
  );

  /*
    金色の内側の縁。
  */
  ctx.lineWidth = 4;

  ctx.strokeStyle =
    '#f0a72b';

  ctx.strokeText(
    'CLEAR',
    0,
    0
  );

  /*
    文字本体。
  */
  ctx.fillStyle =
    '#fff3b0';

  ctx.shadowColor =
    '#ffd34e';

  ctx.shadowBlur = 24;

  ctx.fillText(
    'CLEAR',
    0,
    0
  );

  /*
    文字上部の白いハイライト。
  */
  ctx.globalAlpha = 0.42;

  ctx.fillStyle = '#ffffff';

  ctx.save();

  ctx.beginPath();

  ctx.rect(
    -220,
    -43,
    440,
    28
  );

  ctx.clip();

  ctx.fillText(
    'CLEAR',
    0,
    0
  );

  ctx.restore();

  ctx.restore();

  ctx.save();

  ctx.shadowBlur = 0;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 25px sans-serif';

  ctx.fillText(
    'SPACEでもう一度',
    W / 2,
    475
  );

  ctx.restore();
}

  function drawGameOver(){

    ctx.fillStyle =
      'rgba(0,0,0,.56)';

    ctx.fillRect(0,0,W,H);

    ctx.textAlign = 'center';

    ctx.fillStyle = '#e8e8e8';
    ctx.font = 'bold 58px sans-serif';

    ctx.fillText(
      'GAME OVER',
      W / 2,
      350
    );

    ctx.font = 'bold 25px sans-serif';

    ctx.fillText(
      'SPACEでもう一度',
      W / 2,
      435
    );
  }

  function render(){

    ctx.setTransform(
      scale,
      0,
      0,
      scale,
      offsetX,
      offsetY
    );

    /*
      Canvas全体を消去する。
    */
    ctx.clearRect(
      -offsetX / scale,
      -offsetY / scale,
      canvas.width / scale,
      canvas.height / scale
    );

    ctx.save();

    /*
      ゲーム画面外の黒い帯に
      弾や粒子を描画しない。
    */
    ctx.beginPath();
    ctx.rect(0,0,W,H);
    ctx.clip();

    if(shake > 0){

      ctx.translate(
        (
          Math.random() -
          0.5
        ) * shake,

        (
          Math.random() -
          0.5
        ) * shake
      );
    }

    if(mode === 'title'){

      drawTitle();
      ctx.restore();
      return;
    }

   drawBackground();
   drawDangerLine();
   drawPerson();
   drawShotGauge();
   drawBullets();
   drawParticles();
   drawCeiling();
   drawHP();

    if(mode === 'clear'){
      drawClear();
    }

    if(mode === 'gameOver'){
      drawGameOver();
    }

    ctx.restore();
  }

  function resize(){

    if(
      !root ||
      !canvas
    ){
      return;
    }

    const rect =
      root.getBoundingClientRect();

    const pixelRatio =
      Math.min(
        window.devicePixelRatio ||
        1,
        2
      );

    canvas.width =
      Math.max(
        1,
        Math.round(
          rect.width *
          pixelRatio
        )
      );

    canvas.height =
      Math.max(
        1,
        Math.round(
          rect.height *
          pixelRatio
        )
      );

    scale = Math.min(
      canvas.width / W,
      canvas.height / H
    );

    offsetX =
      (
        canvas.width -
        W * scale
      ) / 2;

    offsetY =
      (
        canvas.height -
        H * scale
      ) / 2;
  }

  function keyDown(event){

    if(
      ![
        'Space',
        'ArrowLeft',
        'ArrowRight',
        'ArrowUp',
        'ArrowDown'
      ].includes(event.code)
    ){
      return;
    }

    event.preventDefault();

    /*
      矢印キーは使用しない。
      Enterも一切処理しない。
    */
    if(
      event.code !== 'Space' ||
      event.repeat
    ){
      return;
    }

    spaceHeld = true;

    if(mode === 'title'){

      reset();
      return;
    }

    if(
      mode === 'gameOver' ||
      mode === 'clear'
    ){

      if(spaceArmed){
        reset();
      }

      return;
    }

    if(
      mode === 'play' &&
      spaceArmed
    ){
      fire();
    }
  }

  function keyUp(event){

    if(
      ![
        'Space',
        'ArrowLeft',
        'ArrowRight',
        'ArrowUp',
        'ArrowDown'
      ].includes(event.code)
    ){
      return;
    }

    event.preventDefault();

    if(event.code === 'Space'){

      spaceHeld = false;

      /*
        Spaceを一度離した後から
        射撃や再挑戦を許可する。
      */
      spaceArmed = true;
    }
  }

  function pointerDown(){

    if(root){
      root.focus();
    }
  }

  function loop(timestamp){

    if(destroyed){
      return;
    }

    const deltaTime =
      last
        ? Math.min(
            0.033,
            (
              timestamp -
              last
            ) / 1000
          )
        : 0;

    last = timestamp;

    update(deltaTime);
    render();

    raf =
      requestAnimationFrame(loop);
  }

  function mount(target){

    destroyed = false;
    last = 0;

    root =
      document.createElement('div');

    root.className = 'ctg-root';
    root.tabIndex = 0;

    root.setAttribute(
      'aria-label',
      '天井が落ちてくる仕掛け'
    );

    canvas =
      document.createElement('canvas');

    const hint =
      document.createElement('div');

    hint.className = 'ctg-focus';
    hint.textContent =
      '画面をクリックして操作';

    root.appendChild(canvas);
    root.appendChild(hint);

    target.appendChild(root);

    ctx =
      canvas.getContext('2d');

    switches = [
      { x: W * 0.22, pressed: false, press: 0 },
      { x: W * 0.50, pressed: false, press: 0 },
      { x: W * 0.78, pressed: false, press: 0 }
    ];

    resize();

    window.addEventListener(
      'keydown',
      keyDown,
      { passive: false }
    );

    window.addEventListener(
      'keyup',
      keyUp,
      { passive: false }
    );

    window.addEventListener(
      'resize',
      resize
    );

    root.addEventListener(
      'pointerdown',
      pointerDown
    );

    raf =
      requestAnimationFrame(loop);

    setTimeout(function(){

      if(
        root &&
        !destroyed
      ){
        root.focus();
      }

    },0);
  }

  function destroy(){

    if(destroyed){
      return;
    }

    destroyed = true;

    cancelAnimationFrame(raf);

    window.removeEventListener(
      'keydown',
      keyDown
    );

    window.removeEventListener(
      'keyup',
      keyUp
    );

    window.removeEventListener(
      'resize',
      resize
    );

    if(root){

      root.removeEventListener(
        'pointerdown',
        pointerDown
      );

      root.remove();
    }

    root = null;
    canvas = null;
    ctx = null;

    bullets = [];
    sparks = [];
    heartBits = [];
    switches = [];
  }

  return {
    mount: mount,
    destroy: destroy
  };
}

const game = {

  id: GAME_ID,

  name:
    '天井が落ちてくる仕掛け',

  _instance: null,

  mount: function(target){

    this.destroy();

    this._instance =
      createCeilingTrap();

    this._instance.mount(target);
  },

  destroy: function(){

    if(this._instance){

      this._instance.destroy();
      this._instance = null;
    }
  }
};

if(
  window.MiniGames &&
  typeof window.MiniGames.register ===
    'function'
){

  window.MiniGames.register(game);

}else{

  document.documentElement.style.width =
    '100%';

  document.documentElement.style.height =
    '100%';

  document.body.style.cssText =
    'margin:0;' +
    'width:100%;' +
    'height:100%;' +
    'overflow:hidden;' +
    'background:#000;';

  const standaloneHost =
    document.createElement('div');

  standaloneHost.style.cssText =
    'position:fixed;' +
    'inset:0;' +
    'width:100%;' +
    'height:100%;' +
    'background:#000;';

  document.body.appendChild(
    standaloneHost
  );

  game.mount(standaloneHost);
}

})();

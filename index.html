landingJumpLockTime = 0;

    dirtAreas = [];
    dirtSerial = 0;
    currentDirtId = null;

    nextDirtPosition =
      bikeWorldPosition() +
      speed *
      randomRange(
        CFG.firstDirtMinSeconds,
        CFG.firstDirtMaxSeconds
      );

    popupTexts = [];
    particles = [];

    screenShake = 0;
    bikeBounce = 0;

    wheelRotation = 0;

    meterNoise = 0;
    meterNoiseClock = 0;
    meterFlash = 0;

    accelerationEffectLevel = 0;
    accelerationEffectTime = 0;
    accelerationEffectDuration = 0;
    accelerationEffectAmount = 0;

    failureDelay = 0;
    crashClock = 0;
    exitOffsetX = 0;
    crashAngle = 0;

    finishTime = 0;
    resultDelay = 0;
    bikeExitedScreen = false;

    spaceReady = false;
  }

  function createDirt(){

    const dirtLength =
      CFG.dirtLengths[
        Math.floor(
          Math.random() *
          CFG.dirtLengths.length
        )
      ];

    const dirtStart =
      nextDirtPosition;

    const dirtEnd =
      dirtStart +
      dirtLength;

    dirtAreas.push({
      id:++dirtSerial,
      start:dirtStart,
      end:dirtEnd,
      hit:false
    });

    nextDirtPosition =
      dirtEnd +
      speed *
      randomRange(
        CFG.minimumDirtGapSeconds,
        CFG.maximumDirtGapSeconds
      );
  }

  function findNextDirt(){

    const contactPosition =
      frontContactWorldPosition();

    for(const dirt of dirtAreas){

      if(
        dirt.end >=
        contactPosition
      ){
        return dirt;
      }
    }

    return null;
  }

  function showText(label,type){

    popupTexts.push({
      label:label,
      type:type,
      x:BIKE_X + 8,
      y:bikeY - 135,
      life:CFG.ratingTextSeconds,
      maximumLife:CFG.ratingTextSeconds
    });
  }

  function createParticles(
    x,
    y,
    color,
    count,
    type
  ){

    for(
      let i = 0;
      i < count;
      i++
    ){

      particles.push({
        x:x,
        y:y,
        vx:randomRange(-155,95),
        vy:randomRange(-185,-30),
        life:randomRange(0.25,0.7),
        size:randomRange(2,7),
        color:color,
        type:type
      });
    }
  }

  function startJump(){

if(
  mode !== 'play' ||
  jumping ||
  currentDirtId !== null ||
  landingJumpLockTime > 0
){
  return;
}

    const dirt =
      findNextDirt();

    const frontContactPosition =
      frontContactWorldPosition();

    let gapPixels = Infinity;

    if(dirt){

      gapPixels =
        (
          dirt.start -
          frontContactPosition
        ) *
        worldScale();
    }

    if(
      gapPixels >= 0 &&
      gapPixels <= 10
    ){

      jumpGrade = 'excellent';

      showText(
        'Excellent!',
        'excellent'
      );

    }else if(
      gapPixels > 10 &&
      gapPixels <= 45
    ){

      jumpGrade = 'good';

      showText(
        'Good!',
        'good'
      );

    }else{

      jumpGrade = 'normal';
    }

    jumping = true;
    jumpElapsed = 0;

    currentJumpSeconds =
      CFG.fixedJumpDistance /
      Math.max(
        1,
        speed
      );

    landingGrade = null;
    landingInputUsed = false;

    createParticles(
      BIKE_X - 45,
      BIKE_GROUND_Y - 3,
      '#cfb89a',
      9,
      'dust'
    );
  }

  function registerLandingInput(){

    if(
      !jumping ||
      jumpGrade === 'normal' ||
      landingInputUsed
    ){
      return;
    }

    const progress =
      clamp(
        jumpElapsed /
        currentJumpSeconds,
        0,
        1
      );

    if(
      progress <=
      CFG.landingInputIgnoreRatio
    ){
      return;
    }

    landingInputUsed = true;

    const remaining =
      1 -
      progress;

    if(
      remaining <=
      CFG.landingExcellentRatio
    ){

      landingGrade = 'excellent';

    }else if(
      remaining <=
      CFG.landingGoodRatio
    ){

      landingGrade = 'good';

    }else{

      landingGrade = 'bad';
    }
  }

  function changeSpeed(amount){

    speed =
      Math.max(
        0,
        speed + amount
      );

    meterFlash = 0.45;
    meterNoiseClock = 0;

    if(amount <= 0){
      return;
    }

    accelerationEffectAmount =
      amount;

    if(amount <= 10){

      accelerationEffectLevel = 1;
      accelerationEffectDuration = 0.34;

    }else{

      accelerationEffectLevel = 2;
      accelerationEffectDuration = 0.48;
    }

    accelerationEffectTime =
      accelerationEffectDuration;
  }

  function landBike(
    applyLandingResult
  ){

    jumping = false;
    bikeY = BIKE_GROUND_Y;
    bikeBounce = 1;

landingJumpLockTime =
  CFG.landingJumpLockSeconds;

    if(applyLandingResult){

      let speedChange = 0;

      if(
        jumpGrade === 'excellent'
      ){

        speedChange +=
          CFG.jumpExcellentBonus;

      }else if(
        jumpGrade === 'good'
      ){

        speedChange +=
          CFG.jumpGoodBonus;
      }

      if(jumpGrade !== 'normal'){

        if(
          landingGrade ===
          'excellent'
        ){

          speedChange +=
            CFG.landingExcellentBonus;

          showText(
            'Excellent!',
            'excellent'
          );

          createParticles(
            BIKE_X,
            BIKE_GROUND_Y - 5,
            '#ffd257',
            17,
            'spark'
          );

        }else if(
          landingGrade === 'good'
        ){

          speedChange +=
            CFG.landingGoodBonus;

          showText(
            'Good!',
            'good'
          );

          createParticles(
            BIKE_X,
            BIKE_GROUND_Y - 5,
            '#55eadc',
            13,
            'spark'
          );

        }else if(
          landingGrade === 'bad'
        ){

          speedChange -=
            CFG.dirtSpeedLoss;

          showText(
            'Bad!',
            'bad'
          );

          createParticles(
            BIKE_X,
            BIKE_GROUND_Y - 5,
            '#aeb7bf',
            17,
            'smoke'
          );

          screenShake = 7;
        }
      }

      if(speedChange !== 0){

        changeSpeed(
          speedChange
        );
      }

      if(
        speed <=
        CFG.gameOverSpeed
      ){

        startFailure();
      }
    }

    jumpGrade = 'normal';
    landingGrade = null;
    landingInputUsed = false;
  }

  function hitDirt(dirt){

    if(dirt.hit){
      return;
    }

    dirt.hit = true;
    currentDirtId = dirt.id;

/*
  速度50以下でダートを踏んだ場合は、
  速度を一気に0にする。

  51以上なら通常どおり20減速する。
*/
if(speed <= 70){

  changeSpeed(
    -speed
  );

}else{

  changeSpeed(
    -CFG.dirtSpeedLoss
  );
}

    showText(
      'Bad!',
      'bad'
    );

    screenShake = 7;
    bikeBounce = 1;

    createParticles(
      BIKE_X - 35,
      BIKE_GROUND_Y - 2,
      '#be6728',
      25,
      'mud'
    );

    if(
      speed <=
      CFG.gameOverSpeed
    ){

      startFailure();
    }
  }

  function startFailure(){

    if(mode !== 'play'){
      return;
    }

    mode = 'failureDelay';
    failureDelay = 0.4;
  }

  function updateWheelRotation(
    deltaTime
  ){

    wheelRotation +=
      Math.PI *
      2 *
      CFG.wheelRotationsPerSecond *
      deltaTime;

    wheelRotation %=
      Math.PI * 2;
  }

  function updateJump(
    deltaTime,
    applyLandingResult
  ){

    if(!jumping){
      return;
    }

    jumpElapsed +=
      deltaTime;

    const progress =
      clamp(
        jumpElapsed /
        currentJumpSeconds,
        0,
        1
      );

bikeY =
  BIKE_GROUND_Y -
  Math.sin(
    Math.PI *
    progress
  ) *
  CFG.jumpHeight;

    if(progress >= 1){

      landBike(
        applyLandingResult
      );
    }
  }

  function updateEffects(
    deltaTime
  ){

    for(
      let i =
        particles.length - 1;
      i >= 0;
      i--
    ){

      const particle =
        particles[i];

      particle.life -=
        deltaTime;

      if(particle.life <= 0){

        particles.splice(i,1);
        continue;
      }

      particle.vy +=
        (
          particle.type === 'mud'
            ? 430
            : 270
        ) *
        deltaTime;

      particle.x +=
        particle.vx *
        deltaTime;

      particle.y +=
        particle.vy *
        deltaTime;
    }

    for(
      let i =
        popupTexts.length - 1;
      i >= 0;
      i--
    ){

      const text =
        popupTexts[i];

      text.life -=
        deltaTime;

      text.y -=
        28 *
        deltaTime;

      if(text.life <= 0){

        popupTexts.splice(i,1);
      }
    }

    screenShake =
      Math.max(
        0,
        screenShake -
        deltaTime * 18
      );

    bikeBounce =
      Math.max(
        0,
        bikeBounce -
        deltaTime * 5
      );

    meterFlash =
      Math.max(
        0,
        meterFlash -
        deltaTime
      );

    accelerationEffectTime =
      Math.max(
        0,
        accelerationEffectTime -
        deltaTime
      );

    if(
      accelerationEffectTime <= 0
    ){

      accelerationEffectLevel = 0;
      accelerationEffectAmount = 0;
    }

/*
  リザルト中は速度ノイズを0で固定する。

  プレイ中、転倒演出中、ゴール退出中だけ
  ノイズを更新する。
*/
if(
  speed <= 0 ||
  mode === 'result' ||
  mode === 'gameOver'
){

  meterNoise = 0;
  meterNoiseClock = 0;

}else{

  meterNoiseClock -=
    deltaTime;

  if(meterNoiseClock <= 0){

    meterNoiseClock =
      randomRange(
        0.08,
        0.22
      );

    meterNoise =
      Math.random() < 0.52
        ? 0
        : Math.floor(
            randomRange(
              -2.99,
              3
            )
          );
  }
}

landingJumpLockTime =
  Math.max(
    0,
    landingJumpLockTime -
    deltaTime
  );

}

  function updateDirtCollision(){

    const contactPosition =
      frontContactWorldPosition();

    currentDirtId = null;

    for(const dirt of dirtAreas){

      if(
        contactPosition >= dirt.start &&
        contactPosition <= dirt.end
      ){

        currentDirtId =
          dirt.id;

        if(!jumping){

          hitDirt(dirt);
        }

        break;
      }
    }

    dirtAreas =
      dirtAreas.filter(
        dirt =>
          dirt.end >
          roadDistance - 100
      );
  }

  function update(deltaTime){

    updateEffects(
      deltaTime
    );

    /*
      プレイ中とゴール演出中は、
      1フレームにつき必ず1回だけ更新する。

      速度やジャンプ状態には連動しないため、
      車輪の回転速度は常に一定。
    */
    if(
      mode === 'play' ||
      mode === 'finish'
    ){

      updateWheelRotation(
        deltaTime
      );
    }

    if(mode === 'play'){

      elapsedTime +=
        deltaTime;

      roadDistance +=
        speed *
        deltaTime;

      updateJump(
        deltaTime,
        true
      );

      updateDirtCollision();

      const dirtSpawnAheadDistance =
        W /
        worldScale() +
        35;

      while(
        nextDirtPosition <
          CFG.goalDistance -
          140 &&
        nextDirtPosition <=
          roadDistance +
          dirtSpawnAheadDistance
      ){

        createDirt();
      }

      if(
        roadDistance >=
        CFG.goalDistance
      ){

        mode = 'finish';

        finishTime =
          elapsedTime;

        exitOffsetX = 0;
        resultDelay = 0;
        bikeExitedScreen = false;

        spaceReady = false;
      }

    }else if(
      mode === 'failureDelay'
    ){

      failureDelay -=
        deltaTime;

      if(failureDelay <= 0){

        mode = 'crash';

        crashClock = 0;
        exitOffsetX = 0;
        crashAngle = 0;
      }

    }else if(mode === 'crash'){

      crashClock +=
        deltaTime;

      exitOffsetX +=
        170 *
        deltaTime;

      crashAngle =
        Math.min(
          1.25,
          crashAngle +
          2.8 *
          deltaTime
        );

      if(crashClock >= 1.25){

        mode = 'gameOver';
        spaceReady = false;
      }

    }else if(mode === 'finish'){

      if(jumping){

        /*
          空中でゴールしたあとも、
          ゴール前と同じ前進速度で背景を流す。

          これにより見えない壁へ
          衝突したような急停止を防ぐ。
        */
        roadDistance +=
          speed *
          deltaTime;

        /*
          ゴール後もジャンプ軌道を続ける。
          着地時の加速や減速判定は行わない。
        */
        updateJump(
          deltaTime,
          false
        );

      }else if(!bikeExitedScreen){

        /*
          着地後は速度720のまま退出する。
        */
        exitOffsetX +=
          CFG.finishExitSpeed *
          deltaTime;

        const bikeLeftEdge =
          BIKE_X +
          exitOffsetX -
          80;

        if(bikeLeftEdge > W){

          bikeExitedScreen = true;
          resultDelay = 0;
        }

      }else{

        /*
          バイクが完全に画面外へ出てから
          1秒待ってリザルトを表示する。

          finishTimeはすでに確定しているため、
          この時間はクリアタイムに含まれない。
        */
        resultDelay +=
          deltaTime;

        if(
          resultDelay >=
          CFG.resultDelaySeconds
        ){

          mode = 'result';
          spaceReady = false;
        }
      }
    }
  }

  function drawSky(){

    const background =
      ctx.createLinearGradient(
        0,
        0,
        0,
        H
      );

    background.addColorStop(
      0,
      '#071225'
    );

    background.addColorStop(
      0.62,
      '#142a47'
    );

    background.addColorStop(
      1,
      '#2a3648'
    );

    ctx.fillStyle =
      background;

    ctx.fillRect(
      0,
      0,
      W,
      H
    );

    ctx.fillStyle =
      '#dceaff';

    for(
      let i = 0;
      i < 45;
      i++
    ){

      ctx.globalAlpha =
        0.25 +
        (
          i % 5
        ) * 0.12;

      ctx.fillRect(
        (
          i * 137 +
          31
        ) % W,

        (
          i * 73 +
          19
        ) % 235,

        1.5,
        1.5
      );
    }

    ctx.globalAlpha = 1;

    ctx.fillStyle =
      '#0b1726';

    ctx.beginPath();
    ctx.moveTo(0,325);

    for(
      let x = 0;
      x <= W;
      x += 80
    ){

      ctx.lineTo(
        x,
        270 +
        (
          (
            x / 80
          ) % 3
        ) * 22
      );
    }

    ctx.lineTo(
      W,
      GROUND_Y
    );

    ctx.lineTo(
      0,
      GROUND_Y
    );

    ctx.fill();

    const spacing = 190;

    const movement =
      (
        roadDistance *
        worldScale() *
        0.45
      ) %
      spacing;

    for(
      let x = -spacing;
      x <= W + spacing * 2;
      x += spacing
    ){

      const streetlightX =
        x -
        movement +
        spacing;

      ctx.fillStyle =
        '#202c39';

      ctx.fillRect(
        streetlightX,
        235,
        7,
        172
      );

      ctx.fillStyle =
        '#ffe4a1';

      ctx.shadowColor =
        '#ffd269';

      ctx.shadowBlur = 18;

      ctx.beginPath();

      ctx.arc(
        streetlightX + 3,
        245,
        10,
        0,
        Math.PI * 2
      );

      ctx.fill();

      ctx.shadowBlur = 0;
    }
  }

  function dirtNoise(
    dirtId,
    index
  ){

    const value =
      Math.sin(
        dirtId * 91.731 +
        index * 47.123
      ) *
      43758.5453;

    return (
      value -
      Math.floor(value)
    );
  }

  function drawDirt(dirt){

    const x =
      worldToScreen(
        dirt.start
      );

    const width =
      (
        dirt.end -
        dirt.start
      ) *
      worldScale();

    if(
      x > W ||
      x + width < 0
    ){
      return;
    }

    const dirtTop =
      GROUND_Y + 4;

    ctx.save();

    ctx.beginPath();

    ctx.rect(
      x,
      dirtTop,
      width,
      H - dirtTop
    );

    ctx.clip();

    const mudGradient =
      ctx.createLinearGradient(
        0,
        dirtTop,
        0,
        H
      );

    mudGradient.addColorStop(
      0,
      '#a95828'
    );

    mudGradient.addColorStop(
      0.45,
      '#88411f'
    );

    mudGradient.addColorStop(
      1,
      '#74371c'
    );

    ctx.fillStyle =
      mudGradient;

    ctx.fillRect(
      x,
      dirtTop,
      width,
      H - dirtTop
    );

    ctx.fillStyle =
      '#c66b32';

    const edgeCount =
      Math.ceil(
        width / 28
      ) + 1;

    for(
      let i = 0;
      i < edgeCount;
      i++
    ){

      const blobX =
        x +
        i * 28 -
        8;

      const blobWidth =
        18 +
        dirtNoise(
          dirt.id,
          i
        ) * 18;

      const blobHeight =
        4 +
        dirtNoise(
          dirt.id,
          i + 50
        ) * 7;

      ctx.beginPath();

      ctx.ellipse(
        blobX,
        dirtTop + 2,
        blobWidth,
        blobHeight,
        0,
        0,
        Math.PI * 2
      );

      ctx.fill();
    }

    const lightSpotCount =
      Math.max(
        5,
        Math.floor(
          width / 42
        )
      );

    for(
      let i = 0;
      i < lightSpotCount;
      i++
    ){

      const alpha =
        0.22 +
        dirtNoise(
          dirt.id,
          i + 500
        ) * 0.25;

      ctx.fillStyle =
        'rgba(224,133,70,' +
        alpha +
        ')';

      ctx.beginPath();

      ctx.ellipse(
        x +
        dirtNoise(
          dirt.id,
          i + 100
        ) *
        width,

        dirtTop +
        14 +
        dirtNoise(
          dirt.id,
          i + 200
        ) *
        (
          H -
          dirtTop -
          25
        ),

        7 +
        dirtNoise(
          dirt.id,
          i + 300
        ) * 17,

        3 +
        dirtNoise(
          dirt.id,
          i + 400
        ) * 7,

        dirtNoise(
          dirt.id,
          i + 600
        ) - 0.5,

        0,
        Math.PI * 2
      );

      ctx.fill();
    }

    const darkSpotCount =
      Math.max(
        4,
        Math.floor(
          width / 55
        )
      );

    for(
      let i = 0;
      i < darkSpotCount;
      i++
    ){

      const alpha =
        0.20 +
        dirtNoise(
          dirt.id,
          i + 1100
        ) * 0.24;

      ctx.fillStyle =
        'rgba(72,29,14,' +
        alpha +
        ')';

      ctx.beginPath();

      ctx.ellipse(
        x +
        dirtNoise(
          dirt.id,
          i + 700
        ) *
        width,

        dirtTop +
        10 +
        dirtNoise(
          dirt.id,
          i + 800
        ) *
        (
          H -
          dirtTop -
          20
        ),

        8 +
        dirtNoise(
          dirt.id,
          i + 900
        ) * 21,

        3 +
        dirtNoise(
          dirt.id,
          i + 1000
        ) * 8,

        dirtNoise(
          dirt.id,
          i + 1200
        ) - 0.5,

        0,
        Math.PI * 2
      );

      ctx.fill();
    }

    ctx.restore();

    ctx.strokeStyle =
      'rgba(218,124,62,.5)';

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(
      x,
      dirtTop
    );

    ctx.lineTo(
      x + width,
      dirtTop
    );

    ctx.stroke();
  }

  function drawRoad(){

    ctx.fillStyle =
      '#59616b';

    ctx.fillRect(
      0,
      GROUND_Y,
      W,
      H - GROUND_Y
    );

    ctx.fillStyle =
      '#a6adb4';

    ctx.fillRect(
      0,
      GROUND_Y,
      W,
      5
    );

    ctx.strokeStyle =
      '#e1ca60';

    ctx.lineWidth = 6;

    ctx.setLineDash([
      52,
      38
    ]);

    ctx.lineDashOffset =
      (
        roadDistance *
        worldScale()
      ) % 90;

    ctx.beginPath();

    ctx.moveTo(
      0,
      GROUND_Y + 105
    );

    ctx.lineTo(
      W,
      GROUND_Y + 105
    );

    ctx.stroke();

    ctx.setLineDash([]);

    for(const dirt of dirtAreas){

      drawDirt(dirt);
    }
  }

  function drawProgress(){

    const progress =
      clamp(
        roadDistance /
        CFG.goalDistance,
        0,
        1
      );

    ctx.fillStyle =
      'rgba(2,6,12,.72)';

    ctx.fillRect(
      120,
      20,
      W - 240,
      13
    );

    ctx.fillStyle =
      '#61d8ff';

    ctx.fillRect(
      123,
      23,
      (
        W - 246
      ) *
      progress,
      7
    );

    ctx.strokeStyle =
      'rgba(255,255,255,.55)';

    ctx.strokeRect(
      120.5,
      20.5,

      13
    );
  }

  function drawSpeed(){

/*
  実速度が0のときは、必ず0を表示する。

  速度が1以上のプレイ中だけ
  メーターのノイズを加える。
*/
const displayedSpeed =
  speed <= 0
    ? 0
    : Math.max(
        0,
        Math.round(speed) +
        (
          mode === 'result' ||
          mode === 'gameOver'
            ? 0
            : meterNoise
        )
      );

    ctx.save();

    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';

/*
  速度が0なら、メーターフラッシュが終了したあとも
  赤い表示を維持する。
*/
const zeroSpeed =
  speed <= 0;

ctx.fillStyle =
  zeroSpeed ||
  meterFlash > 0
    ? '#ff0000'
    : '#f4f7fb';

ctx.shadowColor =
  zeroSpeed ||
  meterFlash > 0
    ? '#ff0000'
    : '#58cfff';

    ctx.shadowBlur = 12;

  function drawAccelerationEffect(){

    if(
      accelerationEffectLevel === 0 ||
      accelerationEffectTime <= 0 ||
      accelerationEffectDuration <= 0
    ){
      return;
    }

    const remainingRatio =
      clamp(
        accelerationEffectTime /
        accelerationEffectDuration,
        0,
        1
      );

    const strongEffect =
      accelerationEffectLevel === 2;

    const excellentAcceleration =
      accelerationEffectAmount === 20;

    const lineCount =
      strongEffect
        ? 30
        : 14;

    const lineAlpha =
      (
        strongEffect
          ? 0.48
          : 0.28
      ) *
      remainingRatio;

    const screenAlpha =
      (
        strongEffect
          ? 0.11
          : 0.055
      ) *
      remainingRatio;

    ctx.save();

    ctx.fillStyle =
      excellentAcceleration
        ? (
            'rgba(255,210,55,' +
            screenAlpha +
            ')'
          )
        : (
            'rgba(105,225,255,' +
            screenAlpha +
            ')'
          );

    ctx.fillRect(
      0,
      0,
      W,
      H
    );

    ctx.lineCap = 'round';

    for(
      let i = 0;
      i < lineCount;
      i++
    ){

      const seed =
        i * 83 +
        accelerationEffectLevel *
        131;

      const lineY =
        20 +
        (
          seed * 47
        ) %
        (
          H - 40
        );

      const lineMovement =
        elapsedTime *
        (
          strongEffect
            ? 1650
            : 1100
        );

      const lineAreaWidth =
        W + 500;

      const rawLineX =
        seed * 97 -
        lineMovement;

      const wrappedLineX =
        (
          (
            rawLineX %
            lineAreaWidth
          ) +
          lineAreaWidth
        ) %
        lineAreaWidth;

      const startX =
        wrappedLineX -
        250;

      const lineLength =
        (
          strongEffect
            ? 220
            : 155
        ) +
        seed %
        (
          strongEffect
            ? 150
            : 65
        );

      ctx.strokeStyle =
        excellentAcceleration
          ? (
              'rgba(255,245,190,' +
              lineAlpha +
              ')'
            )
          : (
              'rgba(180,245,255,' +
              lineAlpha +
              ')'
            );

      ctx.lineWidth =
        strongEffect
          ? 3.2
          : 2.2;

      ctx.beginPath();

      ctx.moveTo(
        startX,
        lineY
      );

      ctx.lineTo(
        startX -
        lineLength,
        lineY
      );

      ctx.stroke();
    }

    if(strongEffect){

      const thinLineCount = 22;

      for(
        let i = 0;
        i < thinLineCount;
        i++
      ){

        const seed =
          i * 109 +
          317;

        const lineY =
          12 +
          (
            seed * 61
          ) %
          (
            H - 24
          );

        const lineMovement =
          elapsedTime *
          2200;

        const lineAreaWidth =
          W + 600;

        const rawLineX =
          seed * 73 -
          lineMovement;

        const wrappedLineX =
          (
            (
              rawLineX %
              lineAreaWidth
            ) +
            lineAreaWidth
          ) %
          lineAreaWidth;

        const startX =
          wrappedLineX -
          300;

        const lineLength =
          80 +
          seed % 180;

        ctx.strokeStyle =
          excellentAcceleration
            ? (
                'rgba(255,252,220,' +
                (
                  0.40 *
                  remainingRatio
                ) +
                ')'
              )
            : (
                'rgba(225,252,255,' +
                (
                  0.34 *
                  remainingRatio
                ) +
                ')'
              );

        ctx.lineWidth = 1.2;

        ctx.beginPath();

        ctx.moveTo(
          startX,
          lineY
        );

        ctx.lineTo(
          startX -
          lineLength,
          lineY
        );

        ctx.stroke();
      }
    }

    const edgeGradient =
      ctx.createRadialGradient(
        W / 2,
        H / 2,
        H * 0.12,
        W / 2,
        H / 2,
        W * 0.67
      );

    const edgeColor =
      excellentAcceleration
        ? '255,210,55'
        : '70,210,255';

    edgeGradient.addColorStop(
      0,
      'rgba(' +
      edgeColor +
      ',0)'
    );

    edgeGradient.addColorStop(
      0.72,
      'rgba(' +
      edgeColor +
      ',0)'
    );

    edgeGradient.addColorStop(
      1,
      'rgba(' +
      edgeColor +
      ',' +
      (
        excellentAcceleration
          ? 0.24 *
            remainingRatio
          : (
              strongEffect
                ? 0.22
                : 0.08
            ) *
            remainingRatio
      ) +
      ')'
    );

    ctx.fillStyle =
      edgeGradient;

    ctx.fillRect(
      0,
      0,
      W,
      H
    );

    ctx.restore();
  }

  function drawGoal(){

    const x =
      worldToScreen(
        CFG.goalDistance
      );

    if(
      x < -60 ||
      x > W + 60
    ){
      return;
    }

    const size = 18;
    const columns = 3;

    const rows =
      Math.ceil(
        (
          H -
          GROUND_Y
        ) /
        size
      );

    for(
      let row = 0;
      row < rows;
      row++
    ){

      for(
        let column = 0;
        column < columns;
        column++
      ){

        ctx.fillStyle =
          (
            row +
            column
          ) % 2
            ? '#151515'
            : '#f5f5f5';

        ctx.fillRect(
          x +
          column *
          size,

          GROUND_Y +
          row *
          size,

          size,
          size
        );
      }
    }
  }

  function getRank(){

    if(finishTime < CFG.rankS){
      return 'S';
    }

    if(finishTime < CFG.rankA){
      return 'A';
    }

    if(finishTime < CFG.rankB){
      return 'B';
    }

    if(finishTime < CFG.rankC){
      return 'C';
    }

    return 'D';
  }

    ctx.textBaseline = 'middle';

    ctx.fillStyle =
      '#ffffff';

    ctx.shadowColor =
      '#ff7a28';

    ctx.shadowBlur = 18;

    ctx.font =
      '900 55px sans-serif';

    ctx.fillText(
      'ダート・ジャンプ・バイク',
      W / 2,
      82
    );

    ctx.shadowBlur = 0;

    ctx.fillStyle =
      'rgba(2,6,13,.96)';

    ctx.fillRect(
      105,
      152,
      W - 210,
      260
    );

    ctx.strokeStyle =
      'rgba(255,160,65,.62)';

    ctx.lineWidth = 2;

    ctx.strokeRect(
      105,
      152,
      W - 210,
      260
    );

    const instructions = [
      'ジャンプ　　SPACE',
      'スタイリッシュジャンプ　　ダートギリギリでSPACE',
      'スタイリッシュランディング　　着地ギリギリでSPACE',

    ];

    for(

    ){

      );

    }

    ctx.fillStyle =
      '#ffb44e';

    ctx.font =
      '900 29px sans-serif';

    ctx.fillText(
      'SPACEで開始',
      W / 2,
      470
    );
  }

  function drawResult(){

    ctx.fillStyle =
      'rgba(1,5,11,.82)';

    ctx.fillRect(
      0,
      0,
      W,
      H
    );

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';

    ctx.font =
      'bold 27px sans-serif';

    ctx.fillText(
      'TIME',
      W / 2,
      160
    );

    ctx.font =
      '900 72px monospace';

    ctx.fillText(
      finishTime.toFixed(2),
      W / 2,
      238
    );

    ctx.fillStyle =
      '#ffbd38';

    ctx.font =
      '900 34px sans-serif';

    ctx.fillText(
      'RANK',
      W / 2,
      318
    );

    ctx.font =
      '900 105px sans-serif';

    ctx.fillText(
      getRank(),
      W / 2,
      418
    );

    ctx.fillStyle =
      '#ffffff';

    ctx.font =
      'bold 23px sans-serif';

    ctx.fillText(
      'SPACEでもう一度',
      W / 2,
      495
    );
  }

  function drawGameOver(){

    ctx.fillStyle =
      'rgba(0,0,0,.62)';

    ctx.fillRect(
      0,
      0,
      W,
      H
    );

    ctx.textAlign = 'center';

    ctx.fillStyle =
      '#ff0000';

    ctx.font =
      '900 62px sans-serif';

    ctx.fillText(
      'GAME OVER',
      W / 2,
      245
    );

    ctx.fillStyle =
      '#ffffff';

    ctx.font =
      'bold 24px sans-serif';

    ctx.fillText(
      'SPACEでもう一度',
      W / 2,
      335
    );
  }

function render(){

  ctx.setTransform(
    canvasScale,
    0,
    0,
    canvasScale,
    canvasOffsetX,
    canvasOffsetY
  );

  ctx.clearRect(
    -canvasOffsetX /
    canvasScale,

    -canvasOffsetY /
    canvasScale,

    canvas.width /
    canvasScale,

    canvas.height /
    canvasScale
  );

  /*
    タイトル画面。

    タイトル画面では進捗バーと速度表示を
    描画しないため、ここで個別に処理する。
  */
  if(mode === 'title'){

    ctx.save();

    ctx.beginPath();

    ctx.rect(
      0,
      0,
      W,
      H
    );

    ctx.clip();

    drawTitle();

    ctx.restore();

    return;
  }

  /*
    背景、道路、ゴール、バイク、
    パーティクルなどを描画する。

    この範囲だけ画面揺れを適用する。
  */
  ctx.save();

  ctx.beginPath();

  ctx.rect(
    0,
    0,
    W,
    H
  );

  ctx.clip();

  if(screenShake > 0){

    ctx.translate(
      randomRange(
        -screenShake,
        screenShake
      ),

      randomRange(
        -screenShake,
        screenShake
      )
    );
  }

  drawSky();
  drawRoad();
  drawGoal();

  let drawX =
    BIKE_X;

  let drawY =
    bikeY;

  let drawRotation = 0;

  /*
    転倒演出中とゲームオーバー後は、
    同じ転倒位置と角度を維持する。
  */
  if(
    mode === 'crash' ||
    mode === 'gameOver'
  ){

    drawX +=
      exitOffsetX;

    drawY +=
      Math.min(
        55,
        crashClock * 45
      );

    drawRotation =
      crashAngle;

  }else if(mode === 'finish'){

    drawX +=
      exitOffsetX;
  }

  if(
    mode !== 'result' &&
    !bikeExitedScreen
  ){

    drawBike(
      drawX,
      drawY,
      drawRotation
    );
  }

  drawAccelerationEffect();
  drawParticles();
  drawPopupTexts();

  /*
    ここで画面揺れを終了する。
  */
  ctx.restore();

  /*
    進捗バーと速度表示を、
    画面揺れの影響を受けない状態で描く。

    これによりダート接触時に枠が
    太くなったり明るくなったりしない。
  */
  ctx.save();

  ctx.beginPath();

  ctx.rect(
    0,
    0,
    W,
    H
  );

  ctx.clip();

  drawProgress();
  drawSpeed();

  /*
    リザルト画面も揺れの影響を受けない。
  */
  if(mode === 'result'){

    drawResult();
  }

  /*
    ゲームオーバー画面も揺れの影響を受けない。

    倒れたバイクは、先ほどの描画範囲で
    転倒した姿勢のまま描かれている。
  */
  if(mode === 'gameOver'){

    drawGameOver();
  }

  ctx.restore();
}

  function keyDown(event){

    if(event.code !== 'Space'){
      return;
    }

    event.preventDefault();

    if(event.repeat){
      return;
    }

    if(mode === 'title'){

      resetGame();
      return;
    }

    if(
      mode === 'result' ||
      mode === 'gameOver'
    ){

      if(spaceReady){

        resetGame();
      }

      return;
    }

    if(
      mode !== 'play' ||
      !spaceReady
    ){
      return;
    }

    if(jumping){

      registerLandingInput();

    }else{

      startJump();
    }
  }

  function keyUp(event){

    if(event.code !== 'Space'){
      return;
    }

    event.preventDefault();

    spaceReady = true;
  }

  function resize(){

    if(
      !root ||
      !canvas
    ){
      return;
    }

    const rect =
      root.getBoundingClientRect();

    const pixelRatio =
      Math.min(
        window.devicePixelRatio || 1,
        2
      );

    canvas.width =
      Math.max(
        1,
        Math.round(
          rect.width *
          pixelRatio
        )
      );

    canvas.height =
      Math.max(
        1,
        Math.round(
          rect.height *
          pixelRatio
        )
      );

    canvasScale =
      Math.min(
        canvas.width / W,
        canvas.height / H
      );

    canvasOffsetX =
      (
        canvas.width -
        W * canvasScale
      ) / 2;

    canvasOffsetY =
      (
        canvas.height -
        H * canvasScale
      ) / 2;
  }

  function gameLoop(timestamp){

    if(destroyed){
      return;
    }

    const deltaTime =
      previousTime
        ? Math.min(
            0.033,
            (
              timestamp -
              previousTime
            ) / 1000
          )
        : 0;

    previousTime =
      timestamp;

    update(
      deltaTime
    );

    render();

    animationFrame =
      requestAnimationFrame(
        gameLoop
      );
  }

  function focusGame(){

    if(root){

      root.focus();
    }
  }

  function mount(target){

    destroyed = false;
    previousTime = 0;

    root =
      document.createElement(
        'div'
      );

    root.className =
      'djb-root';

    root.tabIndex = 0;

    root.setAttribute(
      'aria-label',
      'ダート・ジャンプ・バイク'
    );

    canvas =
      document.createElement(
        'canvas'
      );

    const hint =
      document.createElement(
        'div'
      );

    hint.className =
      'djb-focus';

    hint.textContent =
      '画面をクリックして操作';

    root.appendChild(
      canvas
    );

    root.appendChild(
      hint
    );

    target.appendChild(
      root
    );

    ctx =
      canvas.getContext(
        '2d'
      );

    resize();

    window.addEventListener(
      'keydown',
      keyDown,
      {
        passive:false
      }
    );

    window.addEventListener(
      'keyup',
      keyUp,
      {
        passive:false
      }
    );

    window.addEventListener(
      'resize',
      resize
    );

    root.addEventListener(
      'pointerdown',
      focusGame
    );

    animationFrame =
      requestAnimationFrame(
        gameLoop
      );

    setTimeout(
      focusGame,
      0
    );
  }

  function destroy(){

    if(destroyed){
      return;
    }

    destroyed = true;

    cancelAnimationFrame(
      animationFrame
    );

    window.removeEventListener(
      'keydown',
      keyDown
    );

    window.removeEventListener(
      'keyup',
      keyUp
    );

    window.removeEventListener(
      'resize',
      resize
    );

    if(root){

      root.removeEventListener(
        'pointerdown',
        focusGame
      );

      root.remove();
    }

    root = null;
    canvas = null;
    ctx = null;

    dirtAreas = [];
    particles = [];
    popupTexts = [];
  }

  return {
    mount:mount,
    destroy:destroy
  };
}

const game = {
  id:GAME_ID,
  name:'ダート・ジャンプ・バイク',
  instance:null,

  mount:function(target){

    this.destroy();

    this.instance =
      createGame();

    this.instance.mount(
      target
    );
  },

  destroy:function(){

    if(this.instance){

      this.instance.destroy();
      this.instance = null;
    }
  }
};

if(
  window.MiniGames &&
  typeof window.MiniGames.register ===
    'function'
){

  window.MiniGames.register(
    game
  );

}else{

  document.documentElement.style.width =
    '100%';

  document.documentElement.style.height =
    '100%';

  document.body.style.cssText =
    'margin:0;' +
    'width:100%;' +
    'height:100%;' +
    'overflow:hidden;' +
    'background:#000;';

  const host =
    document.createElement(
      'div'
    );

  host.style.cssText =
    'position:fixed;' +
    'inset:0;' +
    'width:100%;' +
    'height:100%;' +
    'background:#000;';

  document.body.appendChild(
    host
  );

  game.mount(
    host
  );
}

})();
</script>

<script>
(function(){
'use strict';

const GAME_ID='timing-sheathe-complete';

function createGame(){

  const W=960;
  const H=540;
  const TAU=Math.PI*2;

  const CFG={
    swordStartX:348,
    swordStartY:270,
    sheathMouthX:655,
    sheathMouthY:270,

    swingDegrees:30,

    bladeLength:250,
    bladeWidth:20,
    handleLength:104,
    sheathLength:285,

    snapDuration:0.045,
    insertionDuration:0.095,

/*
  回転速度は最初から最後まで
  滑らかに上昇させる。
*/
baseSwingCycles:0.28,
swingCycleLinearGrowth:0.025,
swingCycleCurveGrowth:0.0045,
maximumCycles:2.15,

    initialAngleTolerance:12.5,
    angleToleranceLoss:0.42,
    minimumAngleTolerance:4.0,

    mouthHalfHeight:28,

    fadeOutSeconds:0.12,
    blackHoldSeconds:0.10,
    fadeInSeconds:0.13,

    failureDelaySeconds:0.58,

    rankS:14,
    rankA:11,
    rankB:8,
    rankC:5
  };

  let root=null;
  let canvas=null;
  let ctx=null;

  let animationFrame=0;
  let previousTime=0;
  let destroyed=false;

  let canvasScale=1;
  let canvasOffsetX=0;
  let canvasOffsetY=0;

  let mode='title';
  let score=0;

  let swordX=CFG.swordStartX;
  let swordY=CFG.swordStartY;
  let swordAngle=0;
  let inputAngle=0;

  let swingClock=-Math.PI/2;
  let actionTime=0;
  let transitionTime=0;
  let failureTime=0;

  let spaceReady=false;

  let screenFlash=0;
  let screenShake=0;
  let pulseTime=0;
  let successEffectTriggered=false;

  let particles=[];
  let streaks=[];
  let rings=[];
  let afterimages=[];

  function clamp(value,minimum,maximum){
    return Math.max(
      minimum,
      Math.min(maximum,value)
    );
  }

  function randomRange(minimum,maximum){
    return minimum+Math.random()*(maximum-minimum);
  }

  function toRadians(degrees){
    return degrees*Math.PI/180;
  }

  function shortestAngleDifference(angleA,angleB){
    return Math.atan2(
      Math.sin(angleA-angleB),
      Math.cos(angleA-angleB)
    );
  }

 function currentSwingCycles(){

  /*
    成功回数に比例する上昇と、
    後半ほど効いてくる二次曲線を組み合わせる。

    10回目を境に切り替えないため、
    毎回少しずつ自然に速くなる。
  */
  const linearGrowth =
    score *
    CFG.swingCycleLinearGrowth;

  const curveGrowth =
    score *
    score *
    CFG.swingCycleCurveGrowth;

  return Math.min(
    CFG.maximumCycles,

    CFG.baseSwingCycles +
    linearGrowth +
    curveGrowth
  );
}

  function currentAngleTolerance(){

  /*
    成功するたびに0.42度ずつ狭くする。

    10回目で突然変化せず、
    最初から少しずつ厳しくなる。
  */
  return Math.max(
    CFG.minimumAngleTolerance,

    CFG.initialAngleTolerance -
    score *
    CFG.angleToleranceLoss
  );
}


function resetSword(){

  swordX =
    CFG.swordStartX;

  swordY =
    CFG.swordStartY;

  swordAngle =
    -toRadians(
      CFG.swingDegrees
    );

  inputAngle = 0;

  swingClock = -Math.PI / 2;

  actionTime = 0;

  successEffectTriggered = false;

  afterimages = [];
}

  function startGame(){

    score=0;

    particles=[];
    streaks=[];
    rings=[];
    afterimages=[];

    screenFlash=0;
    screenShake=0;
    pulseTime=0;

    transitionTime=0;
    failureTime=0;

    resetSword();

    mode='aim';
    spaceReady=false;
  }

  function getSwordTip(x,y,angle){

    return{
      x:x+Math.cos(angle)*CFG.bladeLength,
      y:y+Math.sin(angle)*CFG.bladeLength
    };
  }

  function isSuccessfulInput(angle){

    const projectedY=
      CFG.swordStartY+
      Math.tan(angle)*
      (CFG.sheathMouthX-CFG.swordStartX);

    const positionIsCorrect=
      Math.abs(
        projectedY-CFG.sheathMouthY
      )<=CFG.mouthHalfHeight;

    const angleDifference=
      Math.abs(
        shortestAngleDifference(angle,0)
      );

    const angleIsCorrect=
      angleDifference<=
      toRadians(currentAngleTolerance());

    const directionIsCorrect=
      Math.cos(angle)>0;

    return(
      directionIsCorrect &&
      positionIsCorrect &&
      angleIsCorrect
    );
  }

function launchSword(){

  if(mode !== 'aim'){
    return;
  }

  spaceReady = false;

  inputAngle =
    swordAngle;

  actionTime = 0;
  afterimages = [];

  if(
    isSuccessfulInput(
      inputAngle
    )
  ){

    /*
      成功時は水平へ補正して、
      高速納刀へ進む。
    */
    swordAngle = 0;
    mode = 'snap';

  }else{

    /*
      失敗したことは確定しているが、
      この時点ではゲームオーバーにしない。

      入力した角度のまま刀を飛ばし、
      実際に鞘の位置へ到達してから
      衝突するかどうかを判定する。
    */
    swordAngle =
      inputAngle;

    mode = 'missFlight';

    actionTime = 0;

    screenFlash = 0;
    screenShake = 0;
  }
}

  function createFailureEffects(){

    for(let i=0;i<34;i++){

      particles.push({
        x:CFG.sheathMouthX+randomRange(-12,12),
        y:CFG.sheathMouthY+randomRange(-20,20),

        vx:randomRange(-310,130),
        vy:randomRange(-250,250),

        life:randomRange(0.24,0.68),
        maximumLife:0.68,

        size:randomRange(2,6),

        color:
          i%3
            ?'#c8c1b5'
            :'#ff3024'
      });
    }
  }

  function createSuccessEffects(){

    const effectLevel=score;

    const particleCount=Math.min(
      180,
      24+effectLevel*9
    );

    for(let i=0;i<particleCount;i++){

      let colors=[
        '#fff9df',
        '#ffd968',
        '#ffffff'
      ];

      if(effectLevel>=5){
        colors=[
          '#fff8cf',
          '#ffd44c',
          '#ff923d',
          '#ffffff'
        ];
      }

      if(effectLevel>=13){
        colors=[
          '#fff8bd',
          '#ffd13f',
          '#ff6a2b',
          '#ff2838',
          '#ffffff'
        ];
      }

      particles.push({
        x:CFG.sheathMouthX+randomRange(-8,8),
        y:CFG.sheathMouthY+randomRange(-18,18),

        vx:randomRange(
          -480-effectLevel*7,
          260+effectLevel*4
        ),

        vy:randomRange(
          -360-effectLevel*4,
          360+effectLevel*4
        ),

        life:randomRange(0.24,0.82),
        maximumLife:0.82,

        size:randomRange(
          2,
          5+Math.min(effectLevel,18)*0.22
        ),

        color:colors[i%colors.length]
      });
    }

    const streakCount=Math.min(
      42,
      3+effectLevel*2
    );

    for(let i=0;i<streakCount;i++){

      streaks.push({
        angle:randomRange(-Math.PI,Math.PI),

        length:randomRange(
          110,
          270+effectLevel*12
        ),

        life:randomRange(0.18,0.46),
        maximumLife:0.46,

        width:randomRange(
          1.5,
          4.5+effectLevel*0.08
        )
      });
    }

    rings.push({
      life:0.52,
      maximumLife:0.52,
      delay:0
    });

    if(effectLevel>=5){
      rings.push({
        life:0.62,
        maximumLife:0.62,
        delay:0.07
      });
    }

    if(effectLevel>=10){
      rings.push({
        life:0.72,
        maximumLife:0.72,
        delay:0.14
      });
    }

    screenFlash=Math.min(
      0.58,
      0.18+effectLevel*0.022
    );

    screenShake=Math.min(
      13,
      2.5+effectLevel*0.5
    );

    pulseTime=1;
  }

  function succeed(){

    score+=1;

    createSuccessEffects();

    actionTime=0;
    mode='impact';
  }

  function updateEffects(deltaTime){

if(mode === 'impact'){
 
deltaTime *= 5;

}

    screenFlash=Math.max(
      0,
      screenFlash-deltaTime*2.5
    );

    screenShake=Math.max(
      0,
      screenShake-deltaTime*24
    );

    pulseTime=Math.max(
      0,
      pulseTime-deltaTime*3
    );

    for(let i=particles.length-1;i>=0;i--){

      const particle=particles[i];

      particle.life-=deltaTime;

      if(particle.life<=0){
        particles.splice(i,1);
        continue;
      }

      particle.vx*=Math.pow(0.07,deltaTime);
      particle.vy*=Math.pow(0.07,deltaTime);

      particle.vy+=170*deltaTime;

      particle.x+=particle.vx*deltaTime;
      particle.y+=particle.vy*deltaTime;
    }

    for(let i=streaks.length-1;i>=0;i--){

      const streak=streaks[i];

      streak.life-=deltaTime;

      if(streak.life<=0){
        streaks.splice(i,1);
      }
    }

    for(let i=rings.length-1;i>=0;i--){

      const ring=rings[i];

      if(ring.delay>0){
        ring.delay-=deltaTime;
      }else{
        ring.life-=deltaTime;
      }

      if(ring.life<=0){
        rings.splice(i,1);
      }
    }

    for(let i=afterimages.length-1;i>=0;i--){

      const image=afterimages[i];

      image.life-=deltaTime;

      if(image.life<=0){
        afterimages.splice(i,1);
      }
    }
  }

  function update(deltaTime){

    updateEffects(deltaTime);

    if(mode==='aim'){

      swingClock+=
        deltaTime*
        currentSwingCycles()*
        TAU;

      swordAngle=
        Math.sin(swingClock)*
        toRadians(CFG.swingDegrees);

}else if(mode==='snap'){

  actionTime +=
    deltaTime;

  const progress =
    clamp(
      actionTime /
      CFG.snapDuration,
      0,
      1
    );

  const easedProgress =
    1 -
    Math.pow(
      1 - progress,
      4
    );

  const targetX =
    CFG.sheathMouthX -
    CFG.bladeLength;

  swordX =
    CFG.swordStartX +
    (
      targetX -
      CFG.swordStartX
    ) *
    easedProgress;

  swordY =
    CFG.sheathMouthY;

  swordAngle = 0;

  afterimages.push({
    x:swordX,
    y:swordY,
    angle:0,
    life:0.10,
    maximumLife:0.10
  });

  if(progress >= 1){

    actionTime = 0;
    mode = 'insert';
  }

}else if(mode==='insert'){

  actionTime +=
    deltaTime;

  const progress =
    clamp(
      actionTime /
      CFG.insertionDuration,
      0,
      1
    );

  const easedProgress =
    1 -
    Math.pow(
      1 - progress,
      3
    );

  const insertionStartX =
    CFG.sheathMouthX -
    CFG.bladeLength;

  /*
    鍔の中心を鞘口の4px手前で止める。
  */
  const guardStopOffset =
    4;

  const guardStopX =
    CFG.sheathMouthX -
    guardStopOffset;

  swordX =
    insertionStartX +
    (
      guardStopX -
      insertionStartX
    ) *
    easedProgress;

  swordY =
    CFG.sheathMouthY;

  swordAngle = 0;

  /*
    納刀が70%進んだ瞬間に、
    スコア加算と成功エフェクトを一度だけ行う。
  */
  if(
    progress >= 0.70 &&
    !successEffectTriggered
  ){

    successEffectTriggered =
      true;

    score += 1;

    createSuccessEffects();
  }

  /*
    納刀完了後は短い演出時間へ移る。

    スコアは70%地点ですでに加算済みなので、
    ここでは加算しない。
  */
  if(progress >= 1){

    /*
      処理落ちなどで70%地点を飛び越えた場合にも、
      必ず一度だけ成功処理を行う。
    */
    if(!successEffectTriggered){

      successEffectTriggered =
        true;

      score += 1;

      createSuccessEffects();
    }

    actionTime = 0;
    mode = 'impact';
  }

    }else if(mode==='impact'){

      actionTime+=deltaTime;

      const impactDuration=Math.min(
        0.22,
        0.10+score*0.006
      );

      if(actionTime>=impactDuration){
        mode='fadeOut';
        transitionTime=0;
      }

    }else if(mode==='fadeOut'){

      transitionTime+=deltaTime;

      if(
        transitionTime>=
        CFG.fadeOutSeconds
      ){
        mode='blackHold';
        transitionTime=0;
        resetSword();
      }

    }else if(mode==='blackHold'){

      transitionTime+=deltaTime;

      if(
        transitionTime>=
        CFG.blackHoldSeconds
      ){
        mode='fadeIn';
        transitionTime=0;
      }

}else if(mode==='fadeIn'){

  transitionTime+=deltaTime;

  if(
    transitionTime>=
    CFG.fadeInSeconds
  ){
    mode='aim';
    transitionTime=0;
  }

}else if(mode === 'missFlight'){

  /*
    移動前の切っ先位置。
  */
const oldTip =
  getSwordTip(
    swordX,
    swordY,
    swordAngle
  );

  /*
    SPACEを押した瞬間の角度へ
    真っすぐ高速で飛ばす。

    重力は加えないため、
    遠くへ外した場合も入力方向を維持する。
  */
  const missFlightSpeed =
    3500;

  swordX +=
    Math.cos(
      inputAngle
    ) *
    missFlightSpeed *
    deltaTime;

  swordY +=
    Math.sin(
      inputAngle
    ) *
    missFlightSpeed *
    deltaTime;

  swordAngle =
    inputAngle;

  /*
    移動後の切っ先位置。
  */
  const newTip =
    getSwordTip(
      swordX,
      swordY,
      swordAngle
    );

  /*
    切っ先が鞘口のX座標を
    今のフレームで横切ったか確認する。
  */
  if(
    oldTip.x <
      CFG.sheathMouthX &&
    newTip.x >=
      CFG.sheathMouthX
  ){

    /*
      フレーム間の正確な横切り位置を求める。
    */
    const crossingRatio =
      (
        CFG.sheathMouthX -
        oldTip.x
      ) /
      Math.max(
        0.0001,
        newTip.x -
        oldTip.x
      );

    const crossingY =
      oldTip.y +
      (
        newTip.y -
        oldTip.y
      ) *
      crossingRatio;

    const distanceFromSheath =
      Math.abs(
        crossingY -
        CFG.sheathMouthY
      );

    /*
      鞘口の近くを通った場合だけ、
      実際に鞘へ衝突した扱いにする。
    */
    const failureCollisionRange =
      55;

    if(
      distanceFromSheath <=
      failureCollisionRange
    ){

      /*
        切っ先を衝突位置へ固定する。

        これにより、鞘へ到達する前に
        エフェクトが発生しない。
      */
      swordX =
        CFG.sheathMouthX -
        Math.cos(
          inputAngle
        ) *
        CFG.bladeLength;

      swordY =
        crossingY -
        Math.sin(
          inputAngle
        ) *
        CFG.bladeLength;

      createFailureEffects();

      screenFlash = 0.22;
      screenShake = 9;

      actionTime = 0;
      mode = 'failureImpact';
    }
  }

  /*
    鞘から大きく外れた刀は、
    そのまま画面外へ飛んでから
    ゲームオーバーにする。
  */
  const swordTip =
    getSwordTip(
      swordX,
      swordY,
      swordAngle
    );

  if(
    swordTip.x > W + 180 ||
    swordTip.x < -180 ||
    swordTip.y < -180 ||
    swordTip.y > H + 180
  ){

    mode = 'gameOver';
    spaceReady = false;
  }

}else if(mode === 'failureImpact'){

  actionTime +=
    deltaTime;

  /*
    鞘へ衝突したあと、
    刀を少し左下へ弾き返す。
  */
  swordX -=
    130 *
    deltaTime;

  swordY +=
    120 *
    deltaTime;

  swordAngle +=
    2.8 *
    deltaTime;

  /*
    衝突を短時間見せてから
    ゲームオーバーへ移る。
  */
  if(actionTime >= 0.48){

    mode = 'gameOver';
    spaceReady = false;
  }
}
  }

function drawSwordAt(
  x,
  y,
  angle,
  alpha,
  clipInsertedBlade
){

  ctx.save();

  ctx.globalAlpha =
    alpha;

  ctx.translate(
    x,
    y
  );

  ctx.rotate(
    angle
  );

  ctx.shadowColor =
    'rgba(0,0,0,.58)';

  ctx.shadowBlur = 16;
  ctx.shadowOffsetY = 7;

  /*
    刀身だけを別の描画状態で描く。

    納刀中は、鞘口より右へ入った刀身だけを隠す。
    鍔と柄にはクリッピングを適用しない。
  */
  ctx.save();

  if(clipInsertedBlade){

    /*
      現在は座標変換後なので、
      鞘口の画面座標を刀のローカル座標へ変換する。

      納刀中は刀が水平なので、
      鞘口までの距離は
      sheathMouthX - swordX で求められる。
    */
    const localSheathMouthX =
      CFG.sheathMouthX -
      x;

    ctx.beginPath();

    ctx.rect(
      -20,
      -100,
      localSheathMouthX + 20,
      200
    );

    ctx.clip();
  }

  const bladeGradient =
    ctx.createLinearGradient(
      0,
      -15,
      0,
      15
    );

  bladeGradient.addColorStop(
    0,
    '#ffffff'
  );

  bladeGradient.addColorStop(
    0.42,
    '#dce8eb'
  );

  bladeGradient.addColorStop(
    0.68,
    '#84969d'
  );

  bladeGradient.addColorStop(
    1,
    '#f7ffff'
  );

  ctx.fillStyle =
    bladeGradient;

  ctx.strokeStyle =
    '#28343a';

  ctx.lineWidth = 2.5;

  /*
    刀身。
  */
  ctx.beginPath();

  ctx.moveTo(
    0,
    -CFG.bladeWidth / 2
  );

  ctx.lineTo(
    CFG.bladeLength - 25,
    -CFG.bladeWidth / 2
  );

  ctx.lineTo(
    CFG.bladeLength,
    0
  );

  ctx.lineTo(
    CFG.bladeLength - 25,
    CFG.bladeWidth / 2
  );

  ctx.lineTo(
    0,
    CFG.bladeWidth / 2
  );

  ctx.closePath();

  ctx.fill();
  ctx.stroke();

  /*
    刃の光。
  */
  ctx.shadowColor =
    'transparent';

  ctx.strokeStyle =
    'rgba(255,255,255,.9)';

  ctx.lineWidth = 2;

  ctx.beginPath();

  ctx.moveTo(
    15,
    -5
  );

  ctx.lineTo(
    CFG.bladeLength - 30,
    -5
  );

  ctx.stroke();

  /*
    ここで刀身用のクリッピングを終了する。
  */
  ctx.restore();

  /*
    ここから鍔と柄。

    刀身用のクリッピングは解除済みなので、
    鍔が鞘口へ近づいても欠けない。
  */
  ctx.shadowColor =
    'rgba(0,0,0,.42)';

  ctx.shadowBlur = 8;
  ctx.shadowOffsetY = 4;

  /*
    鍔。
  */
  ctx.fillStyle =
    '#9ba3a8';

  ctx.beginPath();

  ctx.ellipse(
    0,
    0,
    11,
    38,
    0,
    0,
    TAU
  );

  ctx.fill();

  ctx.strokeStyle =
    '#343b40';

  ctx.lineWidth = 2.5;

  ctx.stroke();

  ctx.shadowColor =
    'transparent';

  /*
    柄。
  */
  ctx.fillStyle =
    '#161212';

  ctx.strokeStyle =
    '#050404';

  ctx.lineWidth = 3;

  ctx.fillRect(
    -CFG.handleLength,
    -16,
    CFG.handleLength,
    32
  );

  ctx.strokeRect(
    -CFG.handleLength,
    -16,
    CFG.handleLength,
    32
  );

  /*
    柄巻き。
  */
  ctx.strokeStyle =
    '#983a30';

  ctx.lineWidth = 5;

  for(
    let handleX =
      -CFG.handleLength + 8;

    handleX < -2;

    handleX += 16
  ){

    ctx.beginPath();

    ctx.moveTo(
      handleX,
      -14
    );

    ctx.lineTo(
      handleX + 13,
      14
    );

    ctx.stroke();
  }

  /*
    柄頭。
  */
  ctx.fillStyle =
    '#747d83';

  ctx.fillRect(
    -CFG.handleLength - 11,
    -19,
    12,
    38
  );

  ctx.restore();
}

/*
  画面全体の納刀エフェクト。

  鞘口を中心に放射線を出し、
  画面外周も金色に発光させる。

  成功回数が増えるほど、
  放射線の数と太さが増える。
*/
if(pulseTime > 0){

  const fullScreenEffectAlpha =
    pulseTime *
    Math.min(
      0.72,
      0.24 +
      score * 0.025
    );

  /*
    画面全体へ伸びる放射線。
  */
  const fullScreenLineCount =
    Math.min(
      72,
      10 +
      score * 3
    );

  ctx.save();

  ctx.translate(
    CFG.sheathMouthX,
    CFG.sheathMouthY
  );

  ctx.lineCap =
    'round';

  for(
    let i = 0;
    i < fullScreenLineCount;
    i++
  ){

    const lineAngle =
      (
        i /
        fullScreenLineCount
      ) *
      TAU +
      score * 0.17;

    const unevenLength =
      520 +
      (
        (
          i * 73 +
          score * 41
        ) %
        260
      );

    const startDistance =
      48 +
      (
        i % 5
      ) *
      11;

    ctx.strokeStyle =
      i % 4 === 0
        ? (
            'rgba(255,255,225,' +
            fullScreenEffectAlpha +
            ')'
          )
        : (
            'rgba(255,202,62,' +
            (
              fullScreenEffectAlpha *
              0.72
            ) +
            ')'
          );

    ctx.lineWidth =
      1.2 +
      Math.min(
        score,
        20
      ) *
      0.08 +
      (
        i % 3
      ) *
      0.45;

    ctx.beginPath();

    ctx.moveTo(
      Math.cos(
        lineAngle
      ) *
      startDistance,

      Math.sin(
        lineAngle
      ) *
      startDistance
    );

    ctx.lineTo(
      Math.cos(
        lineAngle
      ) *
      unevenLength,

      Math.sin(
        lineAngle
      ) *
      unevenLength
    );

    ctx.stroke();
  }

  ctx.restore();

  /*
    画面外周を金色に発光させる。
  */
  const edgeGlow =
    ctx.createRadialGradient(
      CFG.sheathMouthX,
      CFG.sheathMouthY,
      80,

      CFG.sheathMouthX,
      CFG.sheathMouthY,
      720
    );

  edgeGlow.addColorStop(
    0,
    'rgba(255,225,115,0)'
  );

  edgeGlow.addColorStop(
    0.52,
    'rgba(255,205,65,0)'
  );

  edgeGlow.addColorStop(
    1,
    'rgba(255,146,25,' +
    (
      fullScreenEffectAlpha *
      0.48
    ) +
    ')'
  );

  ctx.fillStyle =
    edgeGlow;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );
}

    if(screenFlash>0){

  function getTransitionOpacity(){

    if(mode==='fadeOut'){

        transitionTime/
        CFG.fadeOutSeconds,
        0,
        1

      return 1;

    if(mode==='fadeIn'){

      return(
        1-
        clamp(
          transitionTime/
          CFG.fadeInSeconds,
          0,
          1
        )
      );
    }

    return 0;

    ctx.setTransform(

    ctx.clearRect(

      0,
      1 -

      actionTime * 145

    8 *
    impactPower;

  impactShakeY =
    Math.sin(
      actionTime * 190

    4 *
    impactPower;

  impactRotation =
    Math.sin(
      actionTime * 130
    ) *
    0.012 *
    impactPower;

    if(mode==='title'){

      startGame();
      return;
    }

    if(mode==='gameOver'){

      if(spaceReady){
        startGame();
      }

      return;
    }

    if(

      spaceReady

      launchSword();

  function resize(){

    if(
      !root ||
      !canvas
    ){
      return;
    }

    const rect=
      root.getBoundingClientRect();

    const pixelRatio=
      Math.min(
        window.devicePixelRatio||1,
        2
      );

    canvas.width=Math.max(
      1,
      Math.round(
        rect.width*
        pixelRatio
      )
    );

    canvas.height=Math.max(
      1,
      Math.round(
        rect.height*
        pixelRatio
      )
    );

    canvasScale=Math.min(
      canvas.width/W,
      canvas.height/H
    );

    canvasOffsetX=
      (
        canvas.width-
        W*canvasScale
      )/2;

    canvasOffsetY=
      (
        canvas.height-
        H*canvasScale
      )/2;
  }

  function gameLoop(timestamp){

    if(destroyed){
      return;
    }

    const deltaTime=
      previousTime
        ?Math.min(
            0.033,
            (
              timestamp-
              previousTime
            )/1000
          )
        :0;

    previousTime=timestamp;

    update(deltaTime);
    render();

    animationFrame=
      requestAnimationFrame(
        gameLoop
      );
  }

  function focusGame(){

    if(root){
      root.focus();
    }
  }

  function mount(target){

    destroyed=false;
    previousTime=0;

    root=
      document.createElement(
        'div'
      );

    root.className='tsg-root';
    root.tabIndex=0;

    root.setAttribute(
      'aria-label',
      '刹那納刀'
    );

    canvas=
      document.createElement(
        'canvas'
      );

    const hint=
      document.createElement(
        'div'
      );

    hint.className='tsg-focus';

    hint.textContent=
      '画面をクリックして操作';

    root.appendChild(canvas);
    root.appendChild(hint);

    target.appendChild(root);

    ctx=canvas.getContext('2d');

    resize();

    window.addEventListener(
      'keydown',
      keyDown,
      {
        passive:false
      }
    );

    window.addEventListener(
      'keyup',
      keyUp,
      {
        passive:false
      }
    );

    window.addEventListener(
      'resize',
      resize
    );

    root.addEventListener(
      'pointerdown',
      focusGame
    );

    animationFrame=
      requestAnimationFrame(
        gameLoop
      );

    setTimeout(
      focusGame,
      0
    );
  }

  function destroy(){

    if(destroyed){
      return;
    }

    destroyed=true;

    cancelAnimationFrame(
      animationFrame
    );

    window.removeEventListener(
      'keydown',
      keyDown
    );

    window.removeEventListener(
      'keyup',
      keyUp
    );

    window.removeEventListener(
      'resize',
      resize
    );

    if(root){

      root.removeEventListener(
        'pointerdown',
        focusGame
      );

      root.remove();
    }

    root=null;
    canvas=null;
    ctx=null;

    particles=[];
    streaks=[];
    rings=[];
    afterimages=[];
  }

  return{
    mount:mount,
    destroy:destroy
  };
}

finalRankS:250,

  let root = null;
